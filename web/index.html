<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LionBox - 本地 AI 编程助手</title>
    <style>
        /* =====================================================================
           配色：全部走 CSS 变量，只有下面两块定义颜色值，组件样式一律用 var(--x)。
           两套主题 —— data-theme="dark"（黑 + 灰）/ data-theme="light"（白 + 浅灰），
           挂在 <html> 上，由 App.setTheme() 切换（设置 → 界面）。
           ===================================================================== */
        :root, html[data-theme="dark"] {
            --bg: #0d0e10;            /* 页面底：近黑，不用纯黑（纯黑显脏、发闷） */
            --panel: #17191c;         /* 面板：侧栏 / 顶栏 / 输入区 */
            --panel-2: #1e2126;       /* 卡片 / 气泡 / 输入框 */
            --inset: #101214;         /* 更深一层的凹槽（代码块、进度条槽） */
            --hover: #24272c;         /* 悬停 / 选中的底 */
            --border: #2a2d31;        /* 主边框 */
            --border-soft: #212429;   /* 次级边框、分隔线 */
            --text: #e4e6e8;          /* 主文字 */
            --text-dim: #a3a8ae;      /* 次要文字 */
            --text-mute: #787e85;     /* 弱化文字（提示、路径） */
            --accent: #6f7f95;        /* 强调色：低饱和灰蓝 */
            --accent-hover: #8091a7;
            --accent-soft: #9fb0c4;   /* 强调色的浅版（图标、次要标记） */
            --accent-fg: #f6f7f9;     /* 压在强调色上的文字 */
            --info: #8fa6bf;          /* 中性信息（工具调用行） */
            --ok: #5f9e7f;            /* 成功 */
            --warn: #c2a05a;          /* 进行中 / 提醒 */
            --err: #c06a5c;           /* 失败 */
            --err-text: #dfa294;      /* 失败块里的文字 */
            --err-bg: #221a18;        /* 失败块底 */
            --ok-bg: #14201a;         /* 成功块底 */
            --scroll: #33373d;        /* 滚动条 */
            --code-bg: rgba(255,255,255,.07);
            --mask: rgba(0,0,0,.62);  /* 模态遮罩 */
            --shadow: rgba(0,0,0,.45);
            --sw-dark: #0d0e10;       /* 主题卡上的小色块（要显示的就是那套配色本身） */
            --sw-light: #fafafa;
        }

        html[data-theme="light"] {
            --bg: #fafafa;
            --panel: #f2f3f5;
            --panel-2: #ffffff;
            --inset: #eceef1;
            --hover: #e7eaee;
            --border: #dcdee2;
            --border-soft: #e6e8ec;
            --text: #1b1d20;
            --text-dim: #5c6167;
            --text-mute: #8b9096;
            --accent: #5b6b80;
            --accent-hover: #4b5a6d;
            --accent-soft: #7d8ea3;
            --accent-fg: #ffffff;
            --info: #4a6b8a;
            --ok: #3f7d5f;
            --warn: #8a6a1f;
            --err: #a9503f;
            --err-text: #8c4433;
            --err-bg: #f7ece9;
            --ok-bg: #eaf3ee;
            --scroll: #c6cad0;
            --code-bg: rgba(0,0,0,.06);
            --mask: rgba(20,22,26,.38);
            --shadow: rgba(20,22,26,.18);
            --sw-dark: #0d0e10;
            --sw-light: #fafafa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; color: var(--text); background: var(--bg); }
        #app { display: flex; height: 100vh; overflow: hidden; }
        
        /* 侧边栏 */
        .sidebar { width: 280px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
        .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .logo-icon { font-size: 28px; }
        .logo-text { font-size: 18px; font-weight: 700; }
        .sidebar-section { padding: 16px; border-bottom: 1px solid var(--border-soft); }
        .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-mute); margin-bottom: 8px; letter-spacing: 0.5px; }
        .workspace-info { display: flex; align-items: center; justify-content: space-between; padding: 8px; background: var(--panel-2); border-radius: 8px; border: 1px solid var(--border); }
        .workspace-path { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
        .session-list { max-height: 300px; overflow-y: auto; }

        /* ---- 按工作区分组的"选项卡" ---- */
        .session-list { max-height: 46vh; overflow-y: auto; }
        .ws-tab { margin-bottom: 6px; border-radius: 8px; background: var(--panel-2); overflow: hidden; }
        .ws-tab-head { display: flex; align-items: center; gap: 6px; padding: 7px 8px;
                       cursor: pointer; user-select: none; }
        .ws-tab-head:hover { background: var(--border-soft); }
        .ws-tab-head.current { box-shadow: inset 3px 0 0 var(--accent); }
        .ws-caret { width: 12px; font-size: 10px; color: var(--text-dim); }
        .ws-name { flex: 1; font-size: 12.5px; color: var(--text); overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap; }
        .ws-count { font-size: 10.5px; color: var(--text-dim); background: var(--border);
                    border-radius: 8px; padding: 1px 6px; }
        .ws-add { border: 0; background: transparent; color: var(--text-dim); cursor: pointer;
                  font-size: 14px; line-height: 1; padding: 2px 4px; }
        .ws-add:hover { color: var(--info); }
        .ws-body { padding: 2px 4px 6px 4px; }
        .ws-body .session-item { padding: 6px 6px 6px 8px; }
        .ws-empty { font-size: 11px; color: var(--text-mute); padding: 4px 10px 8px; }
        .ws-pick { margin-left: 4px; background: var(--border-soft); color: var(--text-dim); border: 1px solid var(--border);
                   border-radius: 5px; font-size: 10.5px; padding: 1px 3px; max-width: 112px; }
        .ws-pick:hover { color: var(--text); }
        #clearAllSessions:hover { color: var(--err); }
        #clearAllSessions:disabled { opacity: .4; cursor: default; }
        .session-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; margin-bottom: 4px; border-radius: 8px; cursor: pointer; }
        .session-item:hover { background: var(--hover); }
        .session-item.active { background: var(--accent); color: var(--accent-fg); }
        .session-item .del-btn { opacity: 0; background: none; border: none; color: var(--err); cursor: pointer; font-size: 16px; }
        .session-item:hover .del-btn { opacity: 1; }
        .mode-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .mode-btn { padding: 8px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text-dim); font-size: 12px; cursor: pointer; }
        .mode-btn:hover { background: var(--hover); }
        .mode-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
        .sidebar-footer { margin-top: auto; padding: 16px; border-top: 1px solid var(--border); }
        
        /* 主内容 */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
        .top-bar-left { display: flex; align-items: center; gap: 12px; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); }
        .breadcrumb .sep { color: var(--text-mute); }
        .top-bar-right { display: flex; align-items: center; gap: 12px; }
        .adapter-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
        select { padding: 6px 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; min-width: 100px; }
        select:focus { outline: none; border-color: var(--accent); }
        
        /* 消息区 */
        .message-area { flex: 1; overflow-y: auto; padding: 24px; scroll-behavior: smooth; }
        .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; text-align: center; }
        .welcome-icon { font-size: 64px; margin-bottom: 16px; }
        .welcome h1 { font-size: 28px; margin-bottom: 8px; background: linear-gradient(135deg, var(--accent), var(--accent-soft)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .welcome p { color: var(--text-dim); margin-bottom: 24px; }
        .features { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 500px; }
        .feature { padding: 16px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; }
        .feature:hover { border-color: var(--accent); }
        .feature .fi { font-size: 24px; }
        .feature .ft { font-size: 13px; font-weight: 600; }
        .feature .fd { font-size: 11px; color: var(--text-dim); }
        
        /* 消息气泡 */
        .msg { display: flex; gap: 12px; margin-bottom: 16px; max-width: 800px; margin-left: auto; margin-right: auto; }
        .msg.user { flex-direction: row-reverse; }
        .msg-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .msg.user .msg-avatar { background: var(--accent); }
        .msg.bot .msg-avatar { background: var(--accent-soft); }
        .msg-body { padding: 12px 16px; border-radius: 12px; line-height: 1.6; max-width: 700px; }
        .msg.user .msg-body { background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px; }
        .msg.bot .msg-body { background: var(--panel-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .msg-body pre { background: var(--inset); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; font-family: monospace; font-size: 13px; }
        .msg-body code { font-family: monospace; font-size: 13px; background: var(--code-bg); padding: 2px 6px; border-radius: 4px; }
        
        /* 输入区 */
        .input-area { padding: 12px 24px; background: var(--panel); border-top: 1px solid var(--border); }
        .input-row { display: flex; align-items: flex-end; gap: 8px; max-width: 800px; margin: 0 auto; }
        .input-row textarea { flex: 1; padding: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: inherit; font-size: 14px; resize: none; min-height: 44px; max-height: 200px; }
        .input-row textarea:focus { outline: none; border-color: var(--accent); }
        .input-hints { display: flex; justify-content: space-between; max-width: 800px; margin: 6px auto 0; font-size: 12px; color: var(--text-mute); }
        
        /* 按钮通用 */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 6px 14px; border: 1px solid transparent; border-radius: 8px; font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-ghost { background: transparent; color: var(--text-dim); border-color: var(--border); }
        .btn-ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-icon { width: 36px; height: 36px; padding: 0; }
        .btn-send { width: 44px; height: 44px; border-radius: 50%; font-size: 18px; flex-shrink: 0; }
        
        /* 模态框 */
        .modal-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--mask); z-index: 9000; display: none; }
        .modal-mask.show { display: flex; align-items: center; justify-content: center; }
        .modal-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 700px; max-height: 80vh; display: flex; flex-direction: column; z-index: 9001; }
        .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .modal-head h2 { font-size: 16px; }
        .modal-head .close { background: none; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        
        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }
        /* ================= 设置面板：区块 / 行 / 开关 ================= */
        .set-block { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; background: var(--panel-2); }
        .set-block-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .set-block-title { font-size: 13.5px; font-weight: 600; color: var(--text); }
        .set-note { font-size: 11.5px; color: var(--text-mute); line-height: 1.7; }
        .set-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-bottom: 6px; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 8px; }
        .set-row .grow { flex: 1; min-width: 0; }
        .set-name { display: block; font-size: 13px; color: var(--text); }
        .set-desc { display: block; font-size: 11px; color: var(--text-mute); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; }
        .set-badge { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--hover); color: var(--text-dim); white-space: nowrap; }
        .set-err { display: block; font-size: 11px; color: var(--err); margin-top: 3px; }
        .set-group-title { font-size: 11.5px; color: var(--text-dim); margin: 12px 0 6px; letter-spacing: .5px; }
        .set-input { padding: 6px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; box-sizing: border-box; }
        .set-msg { font-size: 12px; color: var(--text-mute); }
        .set-msg.ok { color: var(--ok); }
        .set-msg.err { color: var(--err); }

        /* 开关：checkbox 伪装成滑块 */
        .switch { position: relative; display: inline-block; width: 38px; height: 20px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; margin: 0; }
        .switch .knob { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: var(--hover); border: 1px solid var(--border); border-radius: 999px; transition: background .15s, border-color .15s; cursor: pointer; }
        .switch .knob::after { content: ''; position: absolute; width: 13px; height: 13px; left: 2px; top: 2px; border-radius: 50%; background: var(--text-mute); transition: transform .15s, background .15s; }
        .switch input:checked + .knob { background: var(--accent); border-color: var(--accent); }
        .switch input:checked + .knob::after { transform: translateX(17px); background: var(--accent-fg); }
        .switch input:disabled + .knob { opacity: .5; cursor: default; }

        /* 技能 / 引用的小标签 */
        .tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; margin: 0 6px 6px 0; font-size: 11.5px; background: var(--hover); border: 1px solid var(--border); border-radius: 999px; color: var(--text); }
        .tag button { background: none; border: 0; color: var(--text-mute); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 1px; }
        .tag button:hover { color: var(--err); }

        /* 主题卡（设置 → 界面） */
        .theme-card { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px; margin-bottom: 8px; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 8px; cursor: pointer; color: var(--text); font-family: inherit; }
        .theme-card:hover { border-color: var(--accent); }
        .theme-card.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
        .theme-swatch { width: 34px; height: 24px; border-radius: 6px; border: 1px solid var(--border); flex-shrink: 0; }
        .theme-check { color: var(--accent); font-size: 14px; width: 14px; flex-shrink: 0; }

        /* ================= 输入框：@ 引用标签 + 候选浮层 ================= */
        .input-row { position: relative; }
        .ref-bar { max-width: 800px; margin: 0 auto 6px; display: flex; flex-wrap: wrap; gap: 6px; }
        .ref-chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 2px 8px; font-size: 11.5px; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; color: var(--text-dim); }
        .ref-chip .t { color: var(--text); font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 340px; }
        .ref-chip button { background: none; border: 0; color: var(--text-mute); cursor: pointer; font-size: 13px; line-height: 1; }
        .ref-chip button:hover { color: var(--err); }
        .mention-popup { position: absolute; left: 0; right: 56px; bottom: calc(100% + 6px); max-height: 260px; overflow-y: auto; padding: 4px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px var(--shadow); z-index: 8000; }
        .mention-item { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px; cursor: pointer; }
        .mention-item.active { background: var(--hover); }
        .mention-item .mi-type { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--hover); color: var(--text-dim); flex-shrink: 0; }
        .mention-item .mi-label { font-size: 12.5px; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mention-item .mi-detail { font-size: 11px; color: var(--text-mute); flex-shrink: 0; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mention-empty { padding: 8px 10px; font-size: 11.5px; color: var(--text-mute); }
    </style>
</head>
<body>
<div id="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo"><span class="logo-icon">🦁</span><span class="logo-text">LionBox</span></div>
            <button class="btn btn-primary btn-sm" style="width:100%" onclick="App.newSession()">＋ 新建对话</button>
        </div>
        <div class="sidebar-section">
            <div class="section-title">工作区</div>
            <div class="workspace-info">
                <span class="workspace-path" id="wsPath">未选择工作区</span>
                <button class="btn btn-ghost btn-sm" onclick="App.pickWorkspace()">选择</button>
            </div>
        </div>
        <div class="sidebar-section">
            <div class="section-title" style="display:flex;align-items:center;justify-content:space-between">
                <span>对话（按工作区分组）<span id="sessionTotal" style="color:var(--text-mute);font-weight:400"></span></span>
                <button class="ws-add" id="clearAllSessions" title="删除所有对话（工作区保留）"
                        style="font-size:11.5px" onclick="App.deleteAllSessions()">🗑 清空</button>
            </div>
            <div class="session-list" id="sessionList"><div style="text-align:center;color:var(--text-mute);padding:20px">暂无会话</div></div>
        </div>
        <div class="sidebar-section">
            <div class="section-title">工作模式</div>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="STANDARD" onclick="App.setMode(this,'STANDARD')">标准</button>
                                <button class="mode-btn" data-mode="MINIMAL" onclick="App.setMode(this,'MINIMAL')">极简</button>
            </div>
        </div>
        <div class="sidebar-footer">
            <button class="btn btn-ghost" style="width:100%;margin-bottom:6px" onclick="App.showSettings()">⚙️ 设置</button>
            <button class="btn btn-ghost" style="width:100%" onclick="App.showPlugins()">🧩 插件 / 技能</button>
        </div>
    </aside>

    <!-- 主内容 -->
    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="btn btn-ghost btn-icon" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
                <div class="breadcrumb"><span id="bcWs">工作区</span><span class="sep">›</span><span id="bcSession">新会话</span></div>
            </div>
            <div class="top-bar-right">
                <span id="runtimeBanner" onclick="App.showSettings()" title="点这里切换模型来源"
                      style="font-size:12px;color:var(--text-dim);margin-right:4px;cursor:pointer;
                             padding:3px 8px;border:1px solid var(--border);border-radius:6px"></span>
                <span style="font-size:12px;color:var(--text-dim)" title="接口调用格式"><span class="adapter-dot"></span> <span id="adapterName">就绪</span></span>
                <select id="modelSelect" onchange="App.onModelChange()"><option value="">选择模型...</option></select>
                <select id="thinkingLevel" disabled><option>选择模型后加载</option></select>
            </div>
        </header>

        <!-- 模型下载进度：前台可见（这是"下 5 GB 时到底在干嘛"的唯一答案） -->
        <div id="dlBar" style="display:none;padding:8px 16px;background:var(--panel-2);
             border-bottom:1px solid var(--border)">
            <div style="display:flex;align-items:center;gap:10px;font-size:12.5px;
                 color:var(--text);max-width:1100px;margin:0 auto">
                <span id="dlIcon">⏳</span>
                <span id="dlText" style="white-space:nowrap;color:var(--text)">正在下载模型…</span>
                <div style="flex:1;height:9px;background:var(--inset);border:1px solid var(--border);
                     border-radius:5px;overflow:hidden;min-width:120px">
                    <div id="dlFill" style="height:100%;width:0%;
                         background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .4s"></div>
                </div>
                <span id="dlPct" style="width:46px;text-align:right;color:var(--warn);
                     font-variant-numeric:tabular-nums">0%</span>
                <span id="dlSpeed" style="color:var(--text-mute);min-width:150px"></span>
            </div>
        </div>

        <div class="message-area" id="msgArea">
            <div class="welcome">
                <div class="welcome-icon">🦁</div>
                <h1>LionBox</h1>
                <p>本地 AI 编程助手 · <span id="welcomePluginCount">插件</span> · 流式执行 · 模型完全本地运行</p>
                <div class="features">
                    <div class="feature"><div class="fi">🔧</div><div class="ft" id="welcomePluginCount2">插件</div><div class="fd" id="welcomePluginDetail">工具 + 技能</div></div>
                    <div class="feature"><div class="fi">⚡</div><div class="ft">流式执行</div><div class="fd">识别即调度</div></div>
                    <div class="feature"><div class="fi">📦</div><div class="ft">本地推理</div><div class="fd">无需联网 · 无需API Key</div></div>
                    <div class="feature"><div class="fi">📝</div><div class="ft">事件溯源</div><div class="fd">完整记录回放</div></div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <!-- 本地模型：前台常驻（挑版本、下载、看进度都在这儿，不用翻设置） -->
            <div id="modelPanel" style="max-width:1100px;margin:0 auto 8px;padding:8px 12px;
                 background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
                 font-size:12.5px;color:var(--text-dim)"></div>

            <!-- 模型提问面板：ask_user 工具调用时弹出，用户答完自动收起 -->
            <div id="askUserPanel" style="display:none;max-width:800px;margin:0 auto 10px;
                 background:var(--panel-2);border:1px solid var(--accent);border-radius:8px;padding:12px 14px">
                <div style="font-size:12px;color:var(--accent-soft);margin-bottom:6px">🤖 模型需要你确认</div>
                <div id="askUserText" style="font-size:14px;color:var(--text);line-height:1.7;
                     margin-bottom:10px;white-space:pre-wrap"></div>
                <div id="askUserOptions" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px"></div>
                <div style="display:flex;gap:8px;align-items:center">
                    <input id="askUserInput" placeholder="输入你的回答…"
                           style="flex:1;padding:7px 12px;background:var(--inset);border:1px solid var(--border);
                                  border-radius:6px;color:var(--text);font-size:13px;box-sizing:border-box"
                           onkeydown="if(event.key==='Enter'){event.preventDefault();App.submitAskUser();}">
                    <button class="btn btn-primary btn-sm" onclick="App.submitAskUser()">提交回答</button>
                </div>
                <div id="askUserHint" style="font-size:11px;color:var(--text-mute);margin-top:8px"></div>
            </div>
            <div id="agentControls" style="display:none;max-width:800px;margin:0 auto 8px;align-items:center;gap:8px">
                <button class="btn btn-ghost btn-sm" id="btnPause" onclick="App.togglePause()">⏸ 暂停</button>
                <button class="btn btn-ghost btn-sm" onclick="App.stopAgent()" style="color:var(--err);border-color:var(--err)">⏹ 停止</button>
                <span id="agentStateHint" style="font-size:12px;color:var(--text-mute)">运行中…</span>
            </div>
            <!-- 引用了哪些文件 / 历史对话 / 技能：一眼看到，点 × 就能删 -->
            <div id="refBar" class="ref-bar" style="display:none"></div>
            <div class="input-row">
                <!-- @ 补全候选浮层：输入 @ 后弹在输入框正上方 -->
                <div id="mentionPopup" class="mention-popup" style="display:none"></div>
                <textarea id="msgInput" placeholder="输入消息... (Shift+Enter换行，Enter发送，@ 引用文件/历史/技能)" rows="1"></textarea>
                <button class="btn btn-primary btn-send" id="sendBtn" onclick="App.send()">➤</button>
            </div>
            <div class="input-hints">
                <span>💡 先选择工作区，再创建会话</span>
                <span id="pluginCount">已加载 0 个插件</span>
            </div>
        </div>
    </main>
</div>

<!-- 模态框 -->
<div class="modal-mask" id="modalMask">
    <div class="modal-box">
        <div class="modal-head">
            <h2 id="modalTitle">标题</h2>
            <button class="close" onclick="App.closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script>
// ===== 主题引导：尽量早挂上 data-theme，刷新时不会先闪一下另一套配色 =====
(function() {
    try {
        var saved = localStorage.getItem('lionbox.theme') || 'auto';
        var light = false;
        try {
            light = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        } catch (e2) { /* 没有 matchMedia 就当暗色 */ }
        var eff = (saved === 'dark' || saved === 'light') ? saved : (light ? 'light' : 'dark');
        if (document.documentElement && document.documentElement.setAttribute) {
            document.documentElement.setAttribute('data-theme', eff);
        }
    } catch (e) { /* 读不出来就用 <html> 上的默认值（暗色） */ }
})();

var App = {
    ws: null,
    mode: 'STANDARD',
    sessionId: null,
    processing: false,
    paused: false,
    currentBotDiv: null,
    toolLines: [],
    lastEventTs: 0,
    // 已经画过的事件 id：后端按毫秒过滤（毫秒边界会重复返回几条），这里按 id 兜底去重，
    // 否则同一条 TOOL_CALL_START 会在每次轮询里再画一遍（实测 web_search 画了 9 次）。
    seenEvents: {},
    seenEventOrder: [],
    pollTimer: null,
    appConfig: null,
    savedModel: '',
    savedThinkingLevel: '',
    pickingWs: false,
    // 界面主题：'auto' 跟随系统 / 'dark' 黑灰 / 'light' 白灰
    themePref: 'auto',
    themeEffective: 'dark',
    currentSettingsTab: 'appearance',
    // 设置面板用到的数据（插件 / 技能）
    pluginsData: [],
    pluginKinds: [],
    pluginDevMode: false,
    pluginsDir: '',
    skillsData: [],
    activeSkills: [],
    // @ 补全与引用标签
    _refs: [],
    _mentionItems: [],
    _mentionIndex: 0,
    _mentionOpen: false,
    _mentionSeq: 0,

    init: function() {
        var self = this;
        // 主题：先把上次选的那套挂上（颜色全是 CSS 变量，换主题不用刷新）
        this.initTheme();

        var input = document.getElementById('msgInput');
        // 回车发送；@ 候选浮层开着时，按键先给浮层用（↑↓ 选、Enter/Tab 确认、Esc 关）
        input.onkeydown = function(e) {
            if (self.mentionKeydown(e)) { return; }
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); self.send(); }
        };
        // 自动高度 + @ 补全 + 引用标签
        input.oninput = function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            self.onInputChanged();
        };
        // 失焦收起浮层（候选项用 mousedown 选，不会被这里抢先）
        input.onblur = function() { self.hideMentionPopup(); };
        // 自动初始化：创建工作区+会话
        this.autoInit();
    },

    autoInit: function() {
        var self = this;
        this.loadPlugins();
        // 顶部显示当前模型来源（本地模型 / 自定义 API），以及本地模型是否已加载
        this.refreshRuntimeBanner();
        // 模型下载进度：前台进度条靠它每 1.5 秒刷一次
        this.startLocalWatcher();
        // 前台「模型」面板：先拿到清单，才知道你选的那份下没下
        this.refreshModelCache();
        // 先恢复应用配置（模型、apiKey、baseUrl等），再恢复会话与历史
        this.restoreConfig(function() {
            self.refreshRuntimeBanner();
            self.loadSessions(function(sessions) {
                if (sessions && sessions.length > 0) {
                    // 有历史会话：恢复最近一个会话及其对话历史
                    var latest = sessions[sessions.length - 1];
                    self.sessionId = latest.sessionId;
                    self.ws = latest.workspaceId;
                    if (latest.mode) self.setModeUi(latest.mode);
                    document.getElementById('wsPath').textContent = latest.workspaceId;
                    document.getElementById('bcWs').textContent = latest.workspaceId;
                    self.setBreadcrumbSession(latest.sessionId);
                    self.loadHistory(latest.sessionId);
                } else {
                    // 无历史会话：注册默认工作区并创建会话
                    self.createDefaultSession();
                }
            });
        });
    },

    // 从后端恢复持久化的应用配置（模型、适配器、提供商）
    restoreConfig: function(callback) {
        var self = this;
        fetch('/api/chat/config').then(function(r) { return r.json(); }).then(function(result) {
            if (!result.success) { if (callback) callback(); return; }
            self.appConfig = result.data || {};
            var key = self.appConfig.activeAdapter === 'ANTHROPIC' ? 'anthropic' : 'openai';
            var ac = self.appConfig[key] || {};
            self.savedModel = ac.model || '';
            self.savedThinkingLevel = ac.thinkingLevel || '';
            self.fillModelsFromConfig(function() {
                if (callback) callback();
            });
        }).catch(function() { if (callback) callback(); });
    },

    // 从保存的配置填充模型下拉框
    fillModelsFromConfig: function(callback) {
        var self = this;
        var sel = document.getElementById('modelSelect');
        var cfg = this.appConfig || {};
        var key = cfg.activeAdapter === 'ANTHROPIC' ? 'anthropic' : 'openai';
        var ac = cfg[key] || {};
        var models = [];
        var providers = cfg.providers || {};
        for (var pid in providers) {
            var p = providers[pid];
            if (p && p.availableModels && p.availableModels.length > 0 && p.baseUrl === ac.baseUrl) {
                models = p.availableModels;
                break;
            }
        }
        if (models.length === 0 && ac.model) {
            models = [{modelId: ac.model, modelName: ac.model}];
        }
        sel.innerHTML = '<option value="">选择模型...</option>';
        if (models.length === 0) { if (callback) callback(); return; }
        models.forEach(function(m) {
            var opt = document.createElement('option');
            opt.value = m.modelId || m.id;
            opt.textContent = m.modelName || m.name || m.modelId || m.id;
            sel.appendChild(opt);
        });
        if (ac.model) {
            sel.value = ac.model;
            if (!sel.value) sel.selectedIndex = 1;
        } else {
            sel.selectedIndex = 1;
        }
        this.onModelChange();
        if (callback) callback();
    },

    createDefaultSession: function() {
        var self = this;
        // 无历史会话时：从后端获取系统常用目录（动态，不含本机信息），
        // 注册默认工作区并创建会话
        fetch('/api/native-dialog/common-dirs').then(function(r) { return r.json(); })
          .then(function(dirs) {
            var defaultPath = (dirs.success && dirs.data && dirs.data['用户目录']) ? dirs.data['用户目录'] : '';
            if (!defaultPath) { throw new Error('无法获取用户目录'); }
            return fetch('/api/workspaces', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({path: defaultPath})
            }).then(function(r) { return r.json(); })
              .then(function(result) {
                if (result.success) {
                    self.ws = result.data.id || result.data.path;
                    document.getElementById('wsPath').textContent = result.data.path;
                    document.getElementById('bcWs').textContent = result.data.path;
                }
                // 自动创建会话
                return fetch('/api/sessions', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({workspaceId: self.ws || defaultPath, mode: self.mode})
                }).then(function(r) { return r.json(); });
              })
              .then(function(result) {
                if (result.success && result.data) {
                    self.sessionId = result.data.sessionId;
                    self.setBreadcrumbSession(result.data.sessionId);
                }
              });
          })
          .catch(function(e) { console.log('自动初始化:', e); });
    },

    // ====== 工作区 ======
    pickWorkspace: function() {
        var self = this;
        if (this.pickingWs) return; // 防止重复点击弹出多个窗口
        this.pickingWs = true;
        // 按钮置为"请稍候"，防止连点
        var btn = document.querySelector('.workspace-info .btn');
        var btnOriginal = btn ? btn.textContent : '选择';
        if (btn) { btn.textContent = '请稍候…'; btn.disabled = true; }
        var done = function() {
            self.pickingWs = false;
            if (btn) { btn.textContent = btnOriginal; btn.disabled = false; }
        };
        // 弹Windows原生标准文件夹选择窗口（现代Explorer样式）
        var initial = this.ws || '';
        fetch('/api/native-dialog/select-directory?initialPath=' + encodeURIComponent(initial))
          .then(function(r) { return r.json(); })
          .then(function(result) {
            done();
            if (result.success && result.data) {
                self.selectWs(result.data);
            } else {
                // 取消或失败 → 页内常用路径模态框兜底（不再弹系统窗口）
                self.openWorkspaceFallbackModal();
            }
          })
          .catch(function() {
            done();
            self.openWorkspaceFallbackModal();
          });
    },

    // 常用路径兜底模态框（原生对话框不可用时）
    openWorkspaceFallbackModal: function() {
        var self = this;
        var render = function(commonPaths) {
            var icons = {'桌面':'🖥️', '文档':'📄', '下载':'📥', '图片':'🖼️', '用户目录':'🏠'};
            var html = '<p style="color:var(--text-dim);margin-bottom:16px">选择常用目录或手动输入路径：</p>';
            html += '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">';
            Object.keys(commonPaths).forEach(function(name) {
                var p = commonPaths[name];
                if (!p) return;
                var esc = p.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                html += '<button onclick="App.selectWs(\'' + esc + '\')" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-size:13px;text-align:left">';
                html += '<span style="font-size:18px">' + (icons[name] || '📁') + '</span><span style="flex:1">' + name + '</span>';
                html += '<span style="font-size:11px;color:var(--text-mute);font-family:monospace">' + p + '</span></button>';
            });
            html += '</div>';
            html += '<div style="display:flex;gap:8px"><input id="customWsPath" style="flex:1;padding:8px 12px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:monospace;font-size:13px" placeholder="输入自定义路径，如 D:\\my-project">';
            html += '<button class="btn btn-primary" onclick="App.selectWs(document.getElementById(\'customWsPath\').value)">确定</button></div>';
            self.openModal('选择工作区', html);
        };
        // 常用目录从后端动态获取（基于当前系统用户，不含本机硬编码信息）
        fetch('/api/native-dialog/common-dirs').then(function(r) { return r.json(); })
          .then(function(result) { render((result.success && result.data) ? result.data : {}); })
          .catch(function() { render({}); });
    },

    selectWs: function(path) {
        if (!path || !path.trim()) return;
        var self = this;
        fetch('/api/workspaces', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({path: path.trim()})
        }).then(function(r) { return r.json(); })
          .then(function(result) {
            if (!result.success) { alert(result.error || '注册失败'); return; }
            // 会话绑定工作区ID（绝对路径），界面显示原始路径
            self.ws = result.data.id || path.trim();
            document.getElementById('wsPath').textContent = result.data.path || path.trim();
            document.getElementById('bcWs').textContent = result.data.path || path.trim();
            self.closeModal();
            // 立即创建绑定新工作区的会话，让工作区设置生效
            return fetch('/api/sessions', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({workspaceId: self.ws, mode: self.mode})
            }).then(function(r) { return r.json(); });
        })
          .then(function(sres) {
            if (sres && sres.success && sres.data) {
                self.sessionId = sres.data.sessionId;
                self.setBreadcrumbSession(sres.data.sessionId);
                self.loadSessions();
                self.clearMessages();
            }
        }).catch(function(e) { alert('注册失败: ' + e.message); });
    },

    // ====== 会话 ======
    newSession: function() {
        var self = this;
        if (!this.ws) { alert('请先选择工作区'); return; }
        fetch('/api/sessions', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({workspaceId: this.ws, mode: this.mode})
        }).then(function(r) { return r.json(); })
          .then(function(result) {
            if (result.success) {
                self.sessionId = result.data.sessionId;
                self.setBreadcrumbSession(result.data.sessionId);
                self.loadSessions();
                self.clearMessages();
            } else {
                alert(result.error || '创建失败');
            }
        });
    },

    /** 会话在界面上的显示名：有名字用名字；还没命名的显示"新会话 + 时间"，绝不再显示UUID */
    sessionLabel: function(s) {
        if (s && s.name && s.name.trim()) return s.name;
        var t = '';
        if (s && s.createdAt) {
            try {
                var d = new Date(s.createdAt);
                if (!isNaN(d.getTime())) {
                    t = ' · ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
                }
            } catch (e) { /* 时间解析失败就不显示 */ }
        }
        return '新会话' + t;
    },

    /** 把会话名写进顶部面包屑；没有名字时显示"新会话" */
    setBreadcrumbSession: function(sid) {
        var s = (this.sessionsData || []).filter(function(x) { return x.sessionId === sid; })[0];
        var el = document.getElementById('bcSession');
        if (!el) return;
        if (s && s.name && s.name.trim()) {
            el.textContent = s.name;
        } else if (!sid) {
            el.textContent = '新会话';
        } else {
            el.textContent = '新会话（发出第一条消息后自动命名）';
        }
    },

    /**
     * 加载对话列表 —— 现在按**工作区分组**显示成可收起的选项卡。
     *
     * 为什么要同时拉工作区：会话里只存了 workspaceId（就是工作区路径），
     * 光看路径不好认，得拿工作区列表把显示名取出来。
     */
    loadSessions: function(callback) {
        var self = this;
        Promise.all([
            fetch('/api/sessions').then(function(r) { return r.json(); }),
            fetch('/api/workspaces').then(function(r) { return r.json(); })
        ]).then(function(res) {
            var sessions = (res[0] && res[0].success && res[0].data) ? res[0].data : [];
            var workspaces = (res[1] && res[1].success && res[1].data) ? res[1].data : [];
            self.sessionsData = sessions;
            self.workspacesData = workspaces;
            self.renderSessionTabs(sessions, workspaces);
            // 当前会话的名字可能刚由模型生成，同步到面包屑
            var cur = sessions.filter(function(x) { return x.sessionId === self.sessionId; })[0];
            if (cur && cur.name && cur.name.trim()) {
                document.getElementById('bcSession').textContent = cur.name;
            }
            if (callback) callback(sessions);
        }).catch(function() {
            var list = document.getElementById('sessionList');
            if (list) list.innerHTML = '<div style="text-align:center;color:var(--err);padding:16px">对话列表加载失败</div>';
            if (callback) callback([]);
        });
    },

    /**
     * 清空所有对话（工作区保留）。
     *
     * 这是不可撤销的操作，所以问两次：第二次把"要删掉多少个"写清楚，
     * 避免手滑点一下就没了。
     */
    deleteAllSessions: function() {
        var self = this;
        var n = (this.sessionsData || []).length;
        if (n === 0) { alert('当前没有对话。'); return; }
        if (!confirm('要删除全部 ' + n + ' 个对话吗？\n\n工作区会保留，对话内容与历史都会删掉。')) return;
        if (!confirm('再确认一次：这 ' + n + ' 个对话删掉之后**无法恢复**。继续？')) return;

        var btn = document.getElementById('clearAllSessions');
        if (btn) { btn.disabled = true; btn.textContent = '清空中…'; }
        fetch('/api/sessions', {method: 'DELETE'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                if (btn) { btn.disabled = false; btn.textContent = '🗑 清空'; }
                if (!res || !res.success) { alert('清空失败：' + ((res && res.error) || '未知错误')); return; }
                var deleted = (res.data && res.data.deleted) || n;
                // 当前对话已经不存在了：清干净界面上的消息区
                self.sessionId = null;
                var box = document.getElementById('messages');
                if (box) box.innerHTML = '<div style="text-align:center;color:var(--text-mute);padding:40px">'
                    + '对话已清空，点「＋ 新建对话」开始</div>';
                var bc = document.getElementById('bcSession');
                if (bc) bc.textContent = '未选择对话';
                self.loadSessions();
                setTimeout(function() { alert('已清空 ' + deleted + ' 个对话。'); }, 50);
            })
            .catch(function(e) {
                if (btn) { btn.disabled = false; btn.textContent = '🗑 清空'; }
                alert('清空失败：' + e);
            });
    },

    /** 工作区显示名：取路径最后一段（反斜杠/正斜杠都认） */
    wsLabel: function(ws) {
        var p = (ws && (ws.path || ws.workspaceId)) ? String(ws.path || ws.workspaceId) : '';
        p = p.replace(/[\/]+$/, '');
        var parts = p.split(/[\/]+/).filter(function(x) { return x; });
        return parts.length ? parts[parts.length - 1] : (p || '(未知工作区)');
    },

    /** 被收起的工作区（记在 localStorage，刷新后保持） */
    collapsedWs: function() {
        try { return JSON.parse(localStorage.getItem('lionbox.wsCollapsed') || '[]'); }
        catch (e) { return []; }
    },

    /** 收起 / 展开一个工作区选项卡 */
    toggleWsTab: function(wsId) {
        var c = this.collapsedWs();
        var i = c.indexOf(wsId);
        if (i >= 0) { c.splice(i, 1); } else { c.push(wsId); }
        localStorage.setItem('lionbox.wsCollapsed', JSON.stringify(c));
        this.renderSessionTabs(this.sessionsData || [], this.workspacesData || []);
    },

    /** 给某个对话换工作区（选项卡会跟着变） */
    moveSession: function(sid, wsId) {
        var self = this;
        fetch('/api/sessions/' + sid + '/workspace', {
            method: 'PUT', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({workspaceId: wsId})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!res || !res.success) {
                alert('换工作区失败：' + ((res && res.error) || '未知错误'));
                return;
            }
            self.loadSessions();
        }).catch(function(e) { alert('换工作区失败：' + e); });
    },

    /** 在某个工作区里新建对话 */
    newSessionIn: function(wsId) {
        var self = this;
        this.ws = wsId;
        document.getElementById('wsPath').textContent = wsId;
        fetch('/api/sessions', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({workspaceId: wsId, mode: this.mode})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!res || !res.success) { alert('新建对话失败：' + ((res && res.error) || '')); return; }
            var sid = res.data.sessionId;
            var c = self.collapsedWs().filter(function(x) { return x !== wsId; });
            localStorage.setItem('lionbox.wsCollapsed', JSON.stringify(c));
            self.loadSessions(function() { self.switchSession(sid); });
        });
    },

    /**
     * 渲染工作区选项卡：每个工作区一行表头（可点开/收起），
     * 展开后列出属于它的对话；每行对话右边有个小下拉可以改工作区。
     *
     * <p>**没有对话的工作区不显示**（只是不占列表位置，文件夹和注册都不动）。
     * 以前为了能在空工作区里建对话而把它们全列出来，结果历史遗留的
     * 空壳工作区把列表撑满了；而且顶栏「选择」挑完文件夹会立刻在里面
     * 建一个会话，真用过的工作区本来就至少有 1 个。
     */
    renderSessionTabs: function(sessions, workspaces) {
        var self = this;
        var list = document.getElementById('sessionList');
        if (!list) return;
        sessions = sessions || [];
        workspaces = workspaces || [];

        var groups = {};
        var order = [];
        sessions.forEach(function(s) {
            var k = s.workspaceId || '(未绑定工作区)';
            if (!groups[k]) { groups[k] = []; order.push(k); }
            groups[k].push(s);
        });
        // 注意：这里**不再**把没有对话的工作区加进来。
        // workspaces（/api/workspaces）仍然全部保留，只是不在对话列表里占位：
        //   · 对话右边的「选工作区」下拉仍然列全部工作区，想把对话挪进去照样可以；
        //   · 挪进去之后那个工作区自然就出现了。
        // （用户要的就是这个：没对话就删掉显示 —— 不是删文件夹。）
        // 当前对话所在工作区排最前
        var cur = sessions.filter(function(x) { return x.sessionId === self.sessionId; })[0];
        if (cur && cur.workspaceId && order.indexOf(cur.workspaceId) > 0) {
            order.splice(order.indexOf(cur.workspaceId), 1);
            order.unshift(cur.workspaceId);
        }

        // 标题右边显示对话总数（清空前用户能看到要删掉多少）
        var totalEl = document.getElementById('sessionTotal');
        if (totalEl) totalEl.textContent = sessions.length ? '（' + sessions.length + '）' : '';
        var clearBtn = document.getElementById('clearAllSessions');
        if (clearBtn) clearBtn.disabled = sessions.length === 0;

        if (!order.length) {
            // 一个对话都没有时，不列任何工作区（含以前用过、现在空的）
            list.innerHTML = '<div style="text-align:center;color:var(--text-mute);padding:20px">还没有对话<br>' +
                '<span style="font-size:11px">点上面「选择」挑个工作区，或直接「＋ 新建对话」</span></div>';
            return;
        }

        var collapsed = self.collapsedWs();
        var html = '';
        order.forEach(function(wsId) {
            var items = groups[wsId] || [];
            var isCur = cur && cur.workspaceId === wsId;
            var isCollapsed = collapsed.indexOf(wsId) >= 0;
            var label = self.wsLabel({path: wsId});
            html += '<div class="ws-tab">'
                 +  '<div class="ws-tab-head' + (isCur ? ' current' : '') + '" title="' + self.escapeAttr(wsId) + '"'
                 +       ' onclick="App.toggleWsTab(\'' + self.escapeAttr(wsId) + '\')">'
                 +    '<span class="ws-caret">' + (isCollapsed ? '▶' : '▼') + '</span>'
                 +    '<span class="ws-name">' + self.escapeHtml(label) + '</span>'
                 +    '<span class="ws-count">' + items.length + '</span>'
                 +    '<button class="ws-add" title="在这个工作区新建对话"'
                 +            ' onclick="event.stopPropagation();App.newSessionIn(\'' + self.escapeAttr(wsId) + '\')">＋</button>'
                 +  '</div>';
            if (!isCollapsed) {
                html += '<div class="ws-body">';
                items.forEach(function(s) {
                    var active = s.sessionId === self.sessionId ? ' active' : '';
                    var unnamed = !(s.name && s.name.trim());
                    html += '<div class="session-item' + active + '"'
                         +      ' onclick="App.switchSession(\'' + s.sessionId + '\')">'
                         +   '<span class="s-name" style="' + (unnamed ? 'color:var(--text-mute)' : '') + '"'
                         +         ' title="双击重命名"'
                         +         ' ondblclick="event.stopPropagation();App.renameSession(\'' + s.sessionId + '\')">'
                         +     self.escapeHtml(self.sessionLabel(s)) + '</span>'
                         +   '<button class="del-btn" title="重命名"'
                         +           ' onclick="event.stopPropagation();App.renameSession(\'' + s.sessionId + '\')">✎</button>'
                         +   '<button class="del-btn" title="删除"'
                         +           ' onclick="event.stopPropagation();App.deleteSession(\'' + s.sessionId + '\')">×</button>';
                    // 每个对话都能选工作区
                    html += '<select class="ws-pick" title="把这个对话放到别的工作区"'
                         +        ' onclick="event.stopPropagation()"'
                         +        ' onchange="event.stopPropagation();App.moveSession(\'' + s.sessionId + '\', this.value)">';
                    var seen = {};
                    var opts = order.slice();
                    workspaces.forEach(function(w) {
                        var k = w.path || w.workspaceId;
                        if (k && opts.indexOf(k) < 0) opts.push(k);
                    });
                    if (opts.indexOf(wsId) < 0) opts.push(wsId);
                    opts.forEach(function(k) {
                        if (seen[k]) return;
                        seen[k] = 1;
                        html += '<option value="' + self.escapeAttr(k) + '"'
                             +  (k === wsId ? ' selected' : '') + '>'
                             +  self.escapeHtml(self.wsLabel({path: k})) + '</option>';
                    });
                    html += '</select></div>';
                });
                html += '</div>';
            }
            html += '</div>';
        });
        list.innerHTML = html;
    },

    /** 放进 HTML 属性里的转义 */
    escapeAttr: function(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    },

    escapeHtml: function(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    },

    /**
     * 修改会话名。
     * 标题是模型在首条消息之后异步生成的，所以刚发完消息那几秒名字可能还没出来——
     * 这里如果用户没看到名字就点了重命名，也允许他直接起一个（模型看到已有名字就不会再覆盖）。
     */
    renameSession: function(sid) {
        var self = this;
        var cur = (this.sessionsData || []).filter(function(x) { return x.sessionId === sid; })[0];
        var old = (cur && cur.name) ? cur.name : '';
        var name = prompt('给这个会话起个名字：', old);
        if (name === null) return;                 // 取消
        name = name.trim();
        if (!name) return;
        fetch('/api/sessions/' + encodeURIComponent(sid) + '/name', {
            method: 'PUT', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({name: name})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!res.success) { alert(res.error || '重命名失败'); return; }
            if (self.sessionId === sid) document.getElementById('bcSession').textContent = name;
            self.loadSessions();
        });
    },

    /**
     * 首条消息发出后，模型异步生成标题，这里轮询等它出现。
     * 最多等 30 秒；等不到也没关系，用户可以自己双击改名。
     */
    pollSessionTitle: function(sid) {
        var self = this;
        var tries = 0;
        var timer = setInterval(function() {
            tries++;
            var cur = (self.sessionsData || []).filter(function(x) { return x.sessionId === sid; })[0];
            if (cur && cur.name && cur.name.trim()) { clearInterval(timer); self.loadSessions(); return; }
            if (tries > 15) { clearInterval(timer); return; }
            self.loadSessions();
        }, 2000);
    },

    switchSession: function(sid) {
        this.sessionId = sid;
        var s = (this.sessionsData || []).filter(function(x) { return x.sessionId === sid; })[0];
        this.setBreadcrumbSession(sid);
        // 同步该会话的工作模式到界面
        if (s && s.mode) {
            this.mode = s.mode;
            this.setModeUi(s.mode);
        }
        this.loadSessions();
        // 加载该会话的历史消息
        this.loadHistory(sid);
    },

    // 从后端加载会话历史消息并渲染
    loadHistory: function(sid) {
        var self = this;
        var area = document.getElementById('msgArea');
        area.innerHTML = '';
        fetch('/api/sessions/' + encodeURIComponent(sid) + '/history')
          .then(function(r) { return r.json(); })
          .then(function(result) {
            if (!result.success || !result.data || result.data.length === 0) {
                area.innerHTML = '<div class="welcome"><div class="welcome-icon">🦁</div><h1>LionBox</h1><p>此会话暂无消息，开始对话吧</p></div>';
                return;
            }
            // 工具行统一成"🔧 调用工具：X …" / "✅ X 完成" / "❌ X 失败"（和实时流一样的格式），
            // 而且不顶头像；【系统提示】是给模型看的，不进对话显示。
            result.data.forEach(function(m) {
                if (m.role === 'user') {
                    if ((m.content || '').indexOf('【系统提示】') === 0) { return; }
                    self.appendMsg('user', self.formatContent(m.content || ''));
                } else if (m.role === 'assistant') {
                    var c = m.content || '';
                    if (c.trim()) { self.appendMsg('bot', self.formatContent(c)); }
                    (m.toolCalls || []).forEach(function(t) {
                        if (!t || !t.name) { return; }
                        self.appendMsg('bot',
                            '<span style="font-size:12px;color:var(--info)">🔧 调用工具：<b>'
                            + self.escapeHtml(t.name) + '</b> …</span>', true);
                    });
                } else if (m.role === 'tool') {
                    var body = String(m.content || '');
                    var bad = body.indexOf('工具执行错误') >= 0 || body.indexOf('执行异常') >= 0
                              || body.indexOf('失败') === 0;
                    self.appendMsg('bot', '<span style="font-size:12px;color:'
                        + (bad ? 'var(--err)' : 'var(--ok)') + '">' + (bad ? '❌ ' : '✅ ')
                        + self.escapeHtml(m.toolName || '') + (bad ? ' 失败' : ' 完成') + '</span>', true);
                }
                // system消息不显示
            });
          })
          .catch(function() {
            area.innerHTML = '<div class="welcome"><div class="welcome-icon">🦁</div><h1>LionBox</h1><p>历史加载失败</p></div>';
          });
    },

    deleteSession: function(sid) {
        var self = this;
        if (!confirm('确定删除此会话？')) return;
        fetch('/api/sessions/' + sid, {method:'DELETE'}).then(function() {
            if (self.sessionId === sid) self.sessionId = null;
            self.loadSessions();
        });
    },

    // ====== 模式 ======
    setMode: function(btn, mode) {
        this.setModeUi(mode);
        this.mode = mode;
        // 同步到后端：当前会话立即按新模式工作
        if (this.sessionId) {
            fetch('/api/sessions/' + encodeURIComponent(this.sessionId) + '/mode', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({mode: mode})
            }).catch(function() {});
        }
    },

    // 仅更新界面高亮（恢复历史会话时使用）
    setModeUi: function(mode) {
        document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
        // 现在只有标准/极简；老会话里存着 PTC/CREATIVE 的，高亮落回「标准」
        if (mode !== 'STANDARD' && mode !== 'MINIMAL') { mode = 'STANDARD'; }
        var btn = document.querySelector('.mode-btn[data-mode="' + mode + '"]');
        if (btn) btn.classList.add('active');
    },

    // ====== 聊天 ======
    send: function() {
        var self = this;
        var input = document.getElementById('msgInput');
        var msg = input.value.trim();
        if (!msg) return;
        if (!this.sessionId) { alert('请先创建会话'); return; }
        if (this.processing) { return; }

        this.appendMsg('user', msg);
        input.value = '';
        input.style.height = 'auto';
        this.hideMentionPopup();
        this.renderRefs();          // 正文清空了，引用小标签也跟着收起来

        var botDiv = this.appendMsg('bot', '<span style="color:var(--text-mute)">思考中...</span>');
        this.currentBotDiv = botDiv;
        this.processing = true;
        this.paused = false;
        this.toolLines = [];
        this.lastEventTs = Date.now();
        this.seenEvents = {};
        this.seenEventOrder = [];

        // 显示控制条，禁用发送按钮
        var controls = document.getElementById('agentControls');
        controls.style.display = 'flex';
        document.getElementById('btnPause').textContent = '⏸ 暂停';
        document.getElementById('agentStateHint').textContent = '运行中…';
        document.getElementById('sendBtn').disabled = true;

        // 启动工具事件轮询：实时显示调用的工具名
        if (this.pollTimer) clearInterval(this.pollTimer);
        this.pollTimer = setInterval(function() { self.pollEvents(); }, 800);

        // 会话还没有名字的话，这条消息会触发模型生成标题（后端异步做），
        // 这里起一个短轮询把生成好的名字拉回来显示。
        var curSess = (this.sessionsData || []).filter(function(x) { return x.sessionId === self.sessionId; })[0];
        if (!curSess || !curSess.name || !curSess.name.trim()) {
            this.pollSessionTitle(this.sessionId);
        }

        fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                sessionId: this.sessionId,
                message: msg,
                model: document.getElementById('modelSelect').value || '',
                thinkingLevel: document.getElementById('thinkingLevel').value || 'MEDIUM'
            })
        }).then(function(r) { return r.json(); })
          .then(function(result) {
            var toolsHtml = self.toolLines.join('');
            var text = result.success ? (result.data || '') : '';
            botDiv.querySelector('.msg-body').innerHTML = toolsHtml
                + (result.success ? self.formatContent(text)
                                  : '<span style="color:var(--err)">❌ ' + (result.error || '未知错误') + '</span>');
            // 这一轮模型只调了工具、没写正文：别在上面挂个 🦁，保持一行行工具行
            if (result.success && !String(text).trim()) {
                var av = botDiv.querySelector('.msg-avatar');
                if (av) { av.innerHTML = ''; }
            }
            self.finishProcessing();
          })
          .catch(function(e) {
            botDiv.querySelector('.msg-body').innerHTML = self.toolLines.join('') + '<span style="color:var(--err)">❌ ' + e.message + '</span>';
            self.finishProcessing();
          });
    },

    // 轮询工具事件，实时显示工具调用名
    pollEvents: function() {
        var self = this;
        if (!this.sessionId || !this.processing) return;
        // 顺带看一眼模型有没有在向我提问（ask_user 工具）
        this.pollQuestion();
        fetch('/api/events/' + encodeURIComponent(this.sessionId) + '?after=' + this.lastEventTs)
          .then(function(r) { return r.json(); })
          .then(function(res) {
            if (!res.success || !res.data) return;
            var changed = false;
            res.data.forEach(function(ev) {
                var t = ev.timestamp ? new Date(ev.timestamp).getTime() : 0;
                if (t > self.lastEventTs) self.lastEventTs = t;
                // 去重：同一条事件只画一次
                var eid = ev.eventId || (ev.type + '@' + ev.timestamp + '#' + ((ev.data && ev.data.toolName) || ''));
                if (self.seenEvents[eid]) return;
                self.seenEvents[eid] = 1;
                self.seenEventOrder.push(eid);
                if (self.seenEventOrder.length > 800) {
                    var drop = self.seenEventOrder.shift();
                    delete self.seenEvents[drop];
                }
                var name = (ev.data && ev.data.toolName) || '';
                if (ev.type === 'TOOL_CALL_START' && name) {
                    self.toolLines.push('<div style="font-size:12px;color:var(--info);margin-top:4px">🔧 调用工具：<b>' + name + '</b> …</div>');
                    changed = true;
                } else if (ev.type === 'TOOL_CALL_COMPLETE' && name) {
                    self.toolLines.push('<div style="font-size:12px;color:var(--ok);margin-top:2px">✅ ' + name + ' 完成</div>');
                    changed = true;
                } else if (ev.type === 'TOOL_CALL_ERROR' && name) {
                    self.toolLines.push('<div style="font-size:12px;color:var(--err);margin-top:2px">❌ ' + name + ' 失败</div>');
                    changed = true;
                }
            });
            if (changed) {
                self.updateBotStatus(self.paused
                    ? '<span style="color:var(--warn)">⏸ 已暂停，点击「继续」恢复</span>'
                    : '<span style="color:var(--text-mute)">思考中...</span>');
            }
          })
          .catch(function() { /* 轮询失败忽略 */ });
    },

    // ====== 模型提问（ask_user 工具）======
    // 后端在等用户回答时会把问题挂成"待回答"，这里轮询到就弹面板。
    // 用户在面板里答完 → POST 答案 → 后端放行 → 模型接着做。
    pollQuestion: function() {
        var self = this;
        if (!this.sessionId || !this.processing) return;
        fetch('/api/questions/pending?sessionId=' + encodeURIComponent(this.sessionId))
          .then(function(r) { return r.json(); })
          .then(function(res) {
            if (!res || !res.success) return;
            var q = res.data;
            if (q && q.id) {
                if (self.currentQuestionId !== q.id) self.showAskUser(q);
            } else if (self.currentQuestionId) {
                self.hideAskUser();          // 已经答过或超时了，收起面板
            }
          })
          .catch(function() { /* 轮询失败忽略 */ });
    },

    showAskUser: function(q) {
        this.currentQuestionId = q.id;
        var panel = document.getElementById('askUserPanel');
        document.getElementById('askUserText').textContent = q.question || '';
        var opts = document.getElementById('askUserOptions');
        opts.innerHTML = '';
        (q.options || []).forEach(function(o) {
            var b = document.createElement('button');
            b.className = 'btn btn-sm';
            b.textContent = o;
            b.onclick = function() { App.submitAskUser(o); };
            opts.appendChild(b);
        });
        var input = document.getElementById('askUserInput');
        input.value = '';
        document.getElementById('askUserHint').textContent =
            (q.options && q.options.length ? '可以点上面的选项，也可以自己输入；' : '')
            + '不回答的话，模型等一会儿会自己往下走。';
        panel.style.display = 'block';
        input.focus();
    },

    hideAskUser: function() {
        this.currentQuestionId = null;
        var panel = document.getElementById('askUserPanel');
        if (panel) panel.style.display = 'none';
    },

    submitAskUser: function(preset) {
        var self = this;
        if (!this.currentQuestionId) return;
        var input = document.getElementById('askUserInput');
        var answer = (preset != null ? preset : input.value || '').trim();
        if (!answer) { input.focus(); return; }
        var hint = document.getElementById('askUserHint');
        fetch('/api/questions/answer', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({questionId: this.currentQuestionId, answer: answer})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (res && res.success) {
                self.hideAskUser();
                if (self.toolLines) {
                    self.toolLines.push('<div style="font-size:12px;color:var(--accent-soft);margin-top:2px">💬 已回答：' +
                        self.escapeHtml(answer) + '</div>');
                    self.updateBotStatus('<span style="color:var(--text-mute)">思考中...</span>');
                }
            } else if (hint) {
                hint.style.color = 'var(--err)';
                hint.textContent = '✗ ' + ((res && res.error) || '提交失败');
            }
        }).catch(function(e) {
            if (hint) { hint.style.color = 'var(--err)'; hint.textContent = '✗ ' + e; }
        });
    },

    // 刷新机器人气泡状态文字（保留已显示的工具调用行）
    updateBotStatus: function(statusHtml) {        if (!this.currentBotDiv) return;
        this.currentBotDiv.querySelector('.msg-body').innerHTML = statusHtml + this.toolLines.join('');
    },

    // 完成处理：隐藏控制条、恢复发送按钮
    finishProcessing: function() {
        this.processing = false;
        this.paused = false;
        this.currentBotDiv = null;
        this.toolLines = [];
        if (this.pollTimer) { clearInterval(this.pollTimer); this.pollTimer = null; }
        this.hideAskUser();          // 任务结束了，提问面板也要收掉
        document.getElementById('agentControls').style.display = 'none';
        document.getElementById('sendBtn').disabled = false;
    },

    // 暂停/继续切换
    togglePause: function() {
        if (!this.sessionId || !this.processing) return;
        var self = this;
        var action = this.paused ? 'resume' : 'pause';
        fetch('/api/chat/control/' + action, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({sessionId: this.sessionId})
        }).then(function(r) { return r.json(); })
          .then(function(res) {
            if (!res.success) { alert(res.error || '操作失败'); return; }
            self.paused = !self.paused;
            var btn = document.getElementById('btnPause');
            var hint = document.getElementById('agentStateHint');
            if (self.paused) {
                btn.textContent = '▶ 继续';
                hint.textContent = '⏸ 已暂停（下一轮工具调用前生效）';
                self.updateBotStatus('<span style="color:var(--warn)">⏸ 已暂停，点击「继续」恢复</span>');
            } else {
                btn.textContent = '⏸ 暂停';
                hint.textContent = '运行中…';
                self.updateBotStatus('<span style="color:var(--text-mute)">思考中...</span>');
            }
          })
          .catch(function(e) { alert('操作失败: ' + e.message); });
    },

    // 停止任务
    stopAgent: function() {
        if (!this.sessionId || !this.processing) return;
        var self = this;
        fetch('/api/chat/control/stop', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({sessionId: this.sessionId})
        }).then(function(r) { return r.json(); })
          .then(function(res) {
            if (!res.success) { alert(res.error || '操作失败'); return; }
            document.getElementById('agentStateHint').textContent = '⏹ 正在停止…（下一轮工具调用前生效）';
            self.updateBotStatus('<span style="color:var(--err)">⏹ 正在停止…</span>');
          })
          .catch(function(e) { alert('操作失败: ' + e.message); });
    },

    appendMsg: function(role, html, noAvatar) {
        var area = document.getElementById('msgArea');
        var welcome = area.querySelector('.welcome');
        if (welcome) welcome.remove();

        var div = document.createElement('div');
        div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
        // 工具调用/结果那些行不该顶个 🦁：用户要的格式就是一行一行干净的工具行
        var face = noAvatar ? '' : (role === 'user' ? '👤' : '🦁');
        div.innerHTML = '<div class="msg-avatar">' + face + '</div><div class="msg-body">' + html + '</div>';
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
        return div;
    },

    clearMessages: function() {
        document.getElementById('msgArea').innerHTML = '<div class="welcome"><div class="welcome-icon">🦁</div><h1>LionBox</h1><p>选择会话或新建对话开始</p></div>';
    },

    formatContent: function(text) {
        if (!text) return '';
        return text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                   .replace(/`([^`]+)`/g, '<code>$1</code>')
                   .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                   .replace(/\n/g, '<br>');
    },

    // ====== 插件 ======
    /** 底部那句"已加载 N 个插件"：新老两种返回都认，拿不到就不更新（不影响聊天） */
    loadPlugins: function() {
        fetch('/api/plugins').then(function(r) { return r.json(); }).then(function(res) {
            var list = App.respList(res, 'plugins');
            if (!list) { return; }
            var el = document.getElementById('pluginCount');
            if (el) { el.textContent = '已加载 ' + list.length + ' 个插件'; }
            // 欢迎页原来把插件数量写死在标题里（"NN个插件 · 4 Skill + 47 Tool"）——
            // 插件是会长的东西，写死的数字过两天就是错的（实测注册表里是 67 个）。
            // 现在按 /api/plugins 的实际数量渲染。
            var pluginCount = 0;
            var skillCount = 0;
            var toolCount = 0;
            for (var i = 0; i < list.length; i++) {
                var kind = String((list[i] || {}).kind || '').toUpperCase();
                if (kind === 'SKILL') { skillCount++; }
                else if (kind === 'BASE_TOOL' || kind === 'ADVANCED_TOOL' || kind === 'TOOL') { toolCount++; }
                else if (kind === 'PLUGIN' || kind === 'SYSTEM' || kind === '') { pluginCount++; }
            }
            var total = list.length;
            var a = document.getElementById('welcomePluginCount');
            var b = document.getElementById('welcomePluginCount2');
            var c = document.getElementById('welcomePluginDetail');
            if (a) { a.textContent = total + ' 个插件'; }
            if (b) { b.textContent = total + ' 个插件'; }
            if (c) {
                c.textContent = (toolCount ? toolCount + ' 个工具' : '')
                    + (skillCount ? (toolCount ? ' + ' : '') + skillCount + ' 个技能' : '')
                    || '插件化架构';
            }
        }).catch(function() { /* 插件列表拿不到就算了，别影响别的 */ });
    },

    /** 侧栏「插件 / 技能」：直接打开设置里的插件页签（老入口，保留） */
    showPlugins: function() {
        this.showSettings('plugins');
    },

    // ====== 设置 ======
    showSettings: function(tab) {
        // 页签名要直白：本地模型不是"API提供商"，叫那个名字没人会点进来找本地模型
        var html = '<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">'
            + '<button class="btn btn-sm" id="setTabAppearance" onclick="App.settingsTab(\'appearance\')">界面</button>'
            + '<button class="btn btn-sm" id="setTabPlugins" onclick="App.settingsTab(\'plugins\')">插件</button>'
            + '<button class="btn btn-sm" id="setTabPluginParams" onclick="App.settingsTab(\'pluginparams\')">插件参数</button>'
            + '<button class="btn btn-sm" id="setTabSkills" onclick="App.settingsTab(\'skills\')">技能</button>'
            + '<button class="btn btn-sm" id="setTabProviders" onclick="App.settingsTab(\'providers\')">模型来源（本地 / API）</button>'
            + '<button class="btn btn-sm" id="setTabApprovals" onclick="App.settingsTab(\'approvals\')">审批策略</button>'
            + '<button class="btn btn-sm" id="setTabNotification" onclick="App.settingsTab(\'notification\')">音效提醒</button>'
            + '<button class="btn btn-sm" id="setTabLlama" onclick="App.settingsTab(\'llama\')">本地模型 / llama.cpp</button>'
            + '</div><div id="settingsContent"></div>';
        this.openModal('设置', html);
        this.settingsTab(tab || 'appearance');
    },

    // 设置页签切换
    settingsTab: function(tab) {
        var self = this;
        var titles = {'appearance':'setTabAppearance', 'plugins':'setTabPlugins',
                      'pluginparams':'setTabPluginParams', 'skills':'setTabSkills',
                      'providers':'setTabProviders', 'approvals':'setTabApprovals',
                      'notification':'setTabNotification', 'llama':'setTabLlama'};
        Object.keys(titles).forEach(function(t) {
            var b = document.getElementById(titles[t]);
            if (!b) return;
            if (t === tab) {
                b.style.background = 'var(--accent)';
                b.style.color = 'var(--accent-fg)';
                b.style.borderColor = 'var(--accent)';
            } else {
                b.style.background = '';
                b.style.color = '';
                b.style.borderColor = '';
            }
        });
        this.currentSettingsTab = tab;
        if (tab === 'appearance') self.renderAppearanceTab();
        else if (tab === 'plugins') self.renderPluginsTab();
        else if (tab === 'pluginparams') self.renderPluginParamsTab();
        else if (tab === 'skills') self.renderSkillsTab();
        else if (tab === 'providers') self.renderProvidersTab();
        else if (tab === 'approvals') self.renderApprovalsTab();
        else if (tab === 'notification') self.renderNotificationTab();
        else if (tab === 'llama') self.renderLlamaTab();
    },

    // ====== 本地模型 / llama.cpp 页签 ======
    // 两件事：换模型版本（安装包里选的是同一份清单）、改 llama.cpp 的全部启动参数。
    // 参数改完要重启本地模型才生效 —— 界面会明确提示，并提供一键重启。
    renderLlamaTab: function() {
        var self = this;
        var inp = 'width:100%;padding:6px 10px;background:var(--panel-2);border:1px solid var(--border);'
                + 'border-radius:6px;color:var(--text);font-size:13px;box-sizing:border-box';
        var lbl = 'font-size:11.5px;color:var(--text-dim);display:block;margin-bottom:3px';
        var box = 'border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px';
        var grid = 'display:grid;grid-template-columns:1fr 1fr;gap:10px';

        function field(key, label, hint, value, type) {
            return '<div><label style="' + lbl + '" title="' + self.escapeAttr(hint) + '">' + label + '</label>'
                 + '<input id="llama_' + key + '" type="' + (type || 'text') + '" style="' + inp + '"'
                 + ' value="' + self.escapeAttr(value == null ? '' : value) + '"></div>';
        }

        Promise.all([
            fetch('/api/runtime/local/config').then(function(r) { return r.json(); }),
            fetch('/api/runtime/local/models').then(function(r) { return r.json(); })
        ]).then(function(res) {
            var d = (res[0] && res[0].success && res[0].data) ? res[0].data : {};
            var models = (res[1] && res[1].success && res[1].data) ? res[1].data : [];
            // 还没启动过运行时的话，“正在用”谁都不该标；这时候配置的那个只是“当前选择”，
            // 不能写成“已选中但没在用”（那会让人以为跑着呢、只是跑错了）。
            var hasCurrent = models.some(function(m) { return m.current; });

            var html = '';

            // ── 顶部一句话：现在用的是哪份、文件在哪 ──
            var dCur = null;
            models.forEach(function(m) { if (m.file === d.modelFile) { dCur = m; } });
            var curName = dCur ? dCur.label : (d.modelFile || '未选');
            var curSize = dCur ? (dCur.sizeText || (dCur.sizeGb + ' GB')) : '';
            var curState = '';
            if (hasCurrent) {
                curState = '<span style="color:var(--ok)">✓ 正在使用</span>';
            } else if (dCur && dCur.downloaded) {
                curState = '<span style="color:var(--accent)">已选好·发一条消息就会用它</span>';
            } else {
                curState = '<span style="color:var(--err)">还没下载</span>';
            }
            html += '<div style="' + box + '">';
            html += '<div style="font-weight:600;margin-bottom:10px">模型</div>';
            html += '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;'
                 +  'padding:10px 12px;background:var(--inset);border:1px solid var(--border);border-radius:10px">'
                 +  '<div style="flex:1;min-width:200px">'
                 +  '<div style="font-size:11.5px;color:var(--text-mute)">当前在用</div>'
                 +  '<div style="font-size:15px;color:var(--text);font-weight:600;margin-top:2px">'
                 +  self.escapeHtml(curName)
                 +  (curSize ? ' <span style="font-size:12px;color:var(--text-mute);font-weight:400">' + curSize + '</span>' : '')
                 +  '</div>'
                 +  '<div style="font-size:12px;margin-top:3px">' + curState + '</div>'
                 +  '</div>'
                 +  '<button class="btn btn-sm" onclick="App.openModelsDir()">📂 打开模型文件夹</button>'
                 +  '</div>';
            html += '<div style="font-size:11.5px;color:var(--text-mute);margin-top:8px;line-height:1.7">'
                 +  '模型文件放在 <span style="font-family:monospace;color:var(--text-dim)">'
                 +  self.escapeHtml(d.modelDir || '') + '</span>：'
                 +  '想换版本就在下面点「下载」，'
                 +  '你自己的 .gguf 丢进去也会出现在下面。</div>';

            // ── 一份模型一张卡：一句话 + 一个主动作 ──
            var modelCard = function(m, custom) {
                var sizeTxt = m.sizeText ? m.sizeText : (m.sizeGb + ' GB');
                // 状态只有四种说法，不再用“已选中但没在用”这种内部话
                var state, btn = '';
                if (m.downloading) {
                    state = '<span style="color:var(--warn)">正在下载…</span>';
                    btn = '<button class="btn btn-sm" disabled>下载中</button>';
                } else if (m.current) {
                    state = '<span style="color:var(--ok)">✓ 正在使用</span>';
                } else if (m.configured && m.downloaded) {
                    state = '<span style="color:var(--accent)">已选好·下一条消息就用它</span>';
                    btn = '<button class="btn btn-sm" onclick="App.restartLocalModel()">立即加载</button>';
                } else if (m.downloaded) {
                    state = '<span style="color:var(--text-mute)">已下载，现在没用它</span>';
                    btn = '<button class="btn btn-sm btn-primary" onclick="App.switchLlamaModel(\'' + m.file + '\')">用它</button>';
                } else {
                    state = '<span style="color:var(--text-mute)">本机还没有这份权重</span>';
                    btn = '<button class="btn btn-sm btn-primary" onclick="App.downloadLlamaModel(\'' + m.file + '\')">下载</button>';
                }
                var card = '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;'
                         +  'padding:10px 12px;margin-top:8px;background:var(--panel-2);'
                         +  'border:1px solid ' + (m.current ? 'var(--accent)' : 'var(--border)') + ';border-radius:10px">'
                         +  '<div style="flex:1;min-width:200px">'
                         +  '<div style="font-size:13.5px;color:var(--text)">'
                         +  self.escapeHtml(m.label)
                         +  ' <span style="font-size:12px;color:var(--text-mute)">' + sizeTxt + '</span>'
                         +  (custom ? ' <span style="font-size:11px;color:var(--text-mute)">· 你自己放的</span>' : '')
                         +  '</div>'
                         +  '<div style="font-size:11.5px;color:var(--text-mute);margin-top:3px">'
                         +  self.escapeHtml(m.note || '') + '</div>'
