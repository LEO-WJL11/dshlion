                         +  '<div style="font-size:12px;margin-top:5px">' + state + '</div>'
                         +  (m.downloading
                             ? '<div style="margin-top:6px;height:6px;background:var(--inset);'
                               + 'border:1px solid var(--border);border-radius:4px;overflow:hidden">'
                               + '<div id="dlrowfill_' + self.escapeAttr(m.file) + '" '
                               + 'style="height:100%;width:0%;background:var(--accent);transition:width .4s">'
                               + '</div></div>'
                             : '')
                         +  '</div>'
                         +  '<div style="white-space:nowrap">' + btn + '</div>'
                         +  '</div>';
                return card;
            };

            var official = models.filter(function(m) { return !m.custom; });
            var custom = models.filter(function(m) { return m.custom; });
            official.forEach(function(m) { html += modelCard(m, false); });
            if (custom.length) {
                html += '<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border);'
                     +  'font-size:12px;color:var(--text-dim)">你自己放进模型文件夹的（' + custom.length
                     +  '）</div>';
                custom.forEach(function(m) { html += modelCard(m, true); });
            }
            html += '</div>';

            // ── 配置和实际用的不一致时，只给一个动作 ──
            if (d.modelMismatch) {
                html += '<div style="border:1px solid var(--err);background:var(--err-bg);border-radius:10px;'
                     +  'padding:10px 12px;margin-bottom:12px;font-size:12.5px;color:var(--err-text)">'
                     +  '⚠️ ' + self.escapeHtml(d.modelMismatch)
                     +  '<div style="margin-top:8px">'
                     +  '<button class="btn btn-sm" onclick="App.downloadLlamaModel(\''
                     +  self.escapeAttr(d.modelFile) + '\')">下载这一份</button></div></div>';
            }


            // ── 高级：llama.cpp 启动参数（默认收起，不懂就别动）──
            html += '<div style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px">'
                 +  '<button class="btn btn-sm" onclick="App.toggleLlamaAdvanced()" id="llamaAdvBtn">'
                 +  '⚙️ 高级：llama.cpp 启动参数（不懂就别动）▾</button>'
                 +  '<div style="font-size:11.5px;color:var(--text-mute);margin-top:6px">'
                 +  '下面是跑模型那个进程的启动参数（给懂 llama.cpp 的人用）：'
                 +  '改完点保存，再点「重启本地模型」才生效。'
                 +  '拿不准的项就别动，默认值是按这台机器调过的。</div>'
                 +  '</div>';
            html += '<div id="llamaAdvanced" style="display:none">';
                // ---- 上下文 / 显存 ----
                html += '<div style="' + box + '">';
                html += '<div style="font-weight:600;margin-bottom:8px">上下文与显存</div>';
                html += '<div style="' + grid + '">'
                     + field('ctxSize', '上下文长度 -c', '越大越吃显存；本地模型默认 262144（256K）', d.ctxSize)
                     + field('ngl', 'GPU 层数 -ngl', '999 = 全部放到显卡；0 = 纯 CPU', d.ngl)
                     + field('kvCacheTypeK', 'KV 缓存类型 K -ctk', 'q4_0 / q8_0 / f16；量化必须开 flash attention', d.kvCacheTypeK)
                     + field('kvCacheTypeV', 'KV 缓存类型 V -ctv', '同上', d.kvCacheTypeV)
                     + field('parallelSlots', '并行槽位 -np', '多槽位会把上下文平分，一般保持 1', d.parallelSlots)
                     + '<div><label style="' + lbl + '">flash attention -fa</label>'
                     +   '<select id="llama_flashAttn" style="' + inp + '">'
                     +   '<option value="true"' + (String(d.flashAttn) === 'true' ? ' selected' : '') + '>开（on）</option>'
                     +   '<option value="false"' + (String(d.flashAttn) === 'true' ? '' : ' selected') + '>关（off）</option>'
                     +   '</select></div>'
                     + '</div></div>';

                // ---- 性能 ----
                html += '<div style="' + box + '">';
                html += '<div style="font-weight:600;margin-bottom:8px">性能</div>';
                html += '<div style="' + grid + '">'
                     + field('threads', 'CPU 线程 -t', '0 = 让 llama.cpp 自己决定', d.threads)
                     + field('batchSize', '批大小 -b', '预填充批次；显存紧张就调小', d.batchSize)
                     + field('ubatchSize', '微批 -ub', '同上，一般不动', d.ubatchSize)
                     + field('maxPredict', '单次生成上限 -n', '防止一轮写满上下文', d.maxPredict)
                     + '</div></div>';

                // ---- 采样 ----
                html += '<div style="' + box + '">';
                html += '<div style="font-weight:600;margin-bottom:8px">采样</div>';
                html += '<div style="font-size:11.5px;color:var(--text-mute);margin-bottom:8px">'
                     + '出厂默认（temp 0.8、无重复惩罚）实测会让这个模型跑飞，别随手改回去。</div>';
                html += '<div style="' + grid + '">'
                     + field('temperature', '温度 --temp', '', d.temperature)
                     + field('topP', 'top-p', '', d.topP)
                     + field('topK', 'top-k', '0 = 关闭', d.topK)
                     + field('minP', 'min-p', '0 = 关闭', d.minP)
                     + field('repeatPenalty', '重复惩罚 --repeat-penalty', '1.0 = 关闭', d.repeatPenalty)
                     + field('repeatLastN', '惩罚回看窗口 --repeat-last-n', '', d.repeatLastN)
                     + field('seed', '随机种子 --seed', '-1 = 每次随机', d.seed)
                     + '</div></div>';

                // ---- 服务与自由参数 ----
                html += '<div style="' + box + '">';
                html += '<div style="font-weight:600;margin-bottom:8px">服务地址与自由参数</div>';
                html += '<div style="' + grid + '">'
                     + field('host', '监听地址 --host', '一般不动', d.host)
                     + field('port', '端口 --port', '改了要同步改自定义 API 的地址', d.port)
                     + '</div>';
                html += '<div style="margin-top:10px"><label style="' + lbl + '">'
                     + '额外参数（原样拼到命令行最后，能填任何这里没有的开关）</label>'
                     + '<textarea id="llama_extraArgs" rows="2" style="' + inp + ';font-family:monospace"'
                     + ' placeholder="例如：--no-mmap --log-disable">'
                     + self.escapeHtml(d.extraArgs || '') + '</textarea></div>';
                html += '</div>';

                // ---- 操作按钮 ----
                html += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
                     +  '<button class="btn btn-primary" onclick="App.saveLlamaConfig()">保存参数</button>'
                     +  '<button class="btn" onclick="App.restartLocalModel()">重启本地模型</button>'
                     +  '<span id="llamaMsg" style="font-size:12px;color:var(--text-mute)"></span></div>';
                html += '<div style="margin-top:10px;font-size:11.5px;color:var(--text-mute)">'
                     + '当前状态：' + (d.running ? '本地模型正在运行' : '本地模型未运行')
                     + '；改完参数请点「重启本地模型」。</div>';
            html += '</div>';

            document.getElementById('settingsContent').innerHTML = html;
        });
    },

    /** 高级参数的展开 / 收起 */
    toggleLlamaAdvanced: function() {
        var box2 = document.getElementById('llamaAdvanced');
        var btn = document.getElementById('llamaAdvBtn');
        if (!box2) { return; }
        var show = box2.style.display === 'none';
        box2.style.display = show ? 'block' : 'none';
        if (btn) {
            btn.innerHTML = '⚙️ 高级：llama.cpp 启动参数（不懂就别动）' + (show ? '▴' : '▾');
        }
    },

    /** 保存 llama.cpp 参数 */
    saveLlamaConfig: function() {
        var self = this;
        var keys = ['ctxSize', 'ngl', 'kvCacheTypeK', 'kvCacheTypeV', 'parallelSlots',
                    'threads', 'batchSize', 'ubatchSize', 'maxPredict',
                    'temperature', 'topP', 'topK', 'minP', 'repeatPenalty', 'repeatLastN', 'seed',
                    'host', 'port', 'extraArgs'];
        var body = {};
        keys.forEach(function(k) {
            var el = document.getElementById('llama_' + k);
            if (el) body[k] = el.value;
        });
        var fa = document.getElementById('llama_flashAttn');
        if (fa) body.flashAttn = (fa.value === 'true');
        var msg = document.getElementById('llamaMsg');
        if (msg) msg.textContent = '保存中…';
        fetch('/api/runtime/local/config', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (msg) msg.textContent = res && res.success
                ? '已保存。重启本地模型后生效。'
                : ('保存失败：' + ((res && res.error) || ''));
        }).catch(function(e) { if (msg) msg.textContent = '保存失败：' + e; });
    },

    /** 模型清单里找一行（窗口里要显示名字与体积） */
    modelRow: function(file) {
        var list = App.modelsCache || [];
        for (var i = 0; i < list.length; i++) {
            if (list[i].file === file) { return list[i]; }
        }
        return { file: file, label: file, downloaded: false };
    },

    /**
     * 前台下载窗口：点「使用」或「下载」就弹出来，进度就在里面走。
     *
     * 以前只弹一句浏览器原生提示，写着“会在后台下载”—— 用户看到的是“东西在背后
     * 悄悄下”，不知道到底在干什么。现在下载是一件**前台可见**的事：
     * 名字、体积、进度条、速度、剩余时间都在窗口里，下完当场给「立即使用」，
     * 失败当场给原因和「重试」。关掉窗口不影响下载（下面那块面板还在跟着走）。
     */
    openDownloadDialog: function(file, mode) {
        App._dlgFile = file;
        App._dlgMode = mode || 'download';      // download = 只下不切；use = 下完就用它
        var m = App.modelRow(file);
        var sizeTxt = m.sizeText || (m.sizeGb ? (m.sizeGb + ' GB') : '');
        var html = '<div style="font-size:13.5px;color:var(--text);margin-bottom:4px">'
                 + App.escapeHtml(m.label || file) + '</div>'
                 + '<div style="font-size:11.5px;color:var(--text-mute);font-family:monospace;margin-bottom:12px">'
                 + App.escapeHtml(file) + (sizeTxt ? ' · ' + sizeTxt : '') + '</div>'
                 + '<div id="dlgState" style="font-size:12.5px;color:var(--warn);margin-bottom:8px">'
                 + '正在准备下载…</div>'
                 + '<div style="height:12px;background:var(--inset);border:1px solid var(--border);'
                 + 'border-radius:6px;overflow:hidden">'
                 + '<div id="dlgFill" style="height:100%;width:0%;'
                 + 'background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .4s"></div></div>'
                 + '<div style="display:flex;justify-content:space-between;font-size:11.5px;'
                 + 'color:var(--text-dim);margin-top:6px">'
                 + '<span id="dlgBytes">0 MB</span><span id="dlgPct">0%</span>'
                 + '<span id="dlgSpeed"></span></div>'
                 + '<div id="dlgBtns" style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">'
                 + '<button class="btn btn-sm" onclick="App.collapseDownloadDialog()">收起（下载继续）</button>'
                 + '</div>';
        App.openModal('模型下载', html);
    },

    /** 收起窗口（下载不停，面板上还能看） */
    collapseDownloadDialog: function() {
        App._dlgFile = null;
        App.closeModal();
    },

    /** 窗口里的“立即使用”：已经配好的就重启加载，只下不切的就切过去 */
    dialogUseNow: function() {
        var file = App._dlgFile;
        App.collapseDownloadDialog();
        if (!file) { return; }
        if (App._dlgMode === 'use') { App.restartLocalModel(); }
        else { App.switchLlamaModel(file); }
    },

    /** 把当前状态刷到下载窗口里（由 tickLocal 每拍调） */
    updateDownloadDialog: function(st) {
        var file = App._dlgFile;
        if (!file) { return; }
        var fill = document.getElementById('dlgFill');
        if (!fill) { return; }                      // 窗口已经关了
        var state = document.getElementById('dlgState');
        var m = App.modelRow(file);
        var phase = st.phase || '';
        var downloading = phase === 'downloading'
            && (!st.downloadingFile || st.downloadingFile === file);
        var bytes = st.downloadBytes || 0, total = st.downloadTotal || 0;

        if (downloading) {
            var pct = total > 0 ? Math.floor(bytes * 100 / total) : 0;
            fill.style.width = pct + '%';
            document.getElementById('dlgPct').textContent = pct + '%';
            document.getElementById('dlgBytes').textContent =
                App.mbText(bytes) + (total > 0 ? ' / ' + App.mbText(total) : '');
            document.getElementById('dlgSpeed').textContent = App._dlSpeedTxt || '';
            state.style.color = 'var(--warn)';
            state.textContent = '正在下载…（关掉这个窗口也会继续下）';
            return;
        }
        if (m.downloaded) {
            fill.style.width = '100%';
            document.getElementById('dlgPct').textContent = '100%';
            state.style.color = 'var(--ok)';
            state.textContent = '✓ 下载完成，可以用了';
            document.getElementById('dlgBtns').innerHTML =
                '<button class="btn btn-sm" onclick="App.collapseDownloadDialog()">关闭</button>'
                + '<button class="btn btn-sm btn-primary" onclick="App.dialogUseNow()">立即使用</button>';
            return;
        }
        if (phase === 'failed') {
            fill.style.background = 'var(--err)';
            state.style.color = 'var(--err)';
            state.textContent = '✗ 下载失败：' + (st.lastError || '原因见日志');
            document.getElementById('dlgBtns').innerHTML =
                '<button class="btn btn-sm" onclick="App.collapseDownloadDialog()">关闭</button>'
                + '<button class="btn btn-sm" onclick="App.retryDownloadDialog()">重试</button>';
        }
    },

    /** 窗口里的「重试」 */
    retryDownloadDialog: function() {
        var file = App._dlgFile;
        if (!file) { return; }
        var fill = document.getElementById('dlgFill');
        if (fill) { fill.style.background = 'linear-gradient(90deg,var(--accent),var(--ok))'; }
        var state = document.getElementById('dlgState');
        if (state) { state.style.color = 'var(--warn)'; state.textContent = '重新开始下载…'; }
        App.startDownload(file);
    },

    /** 发起下载（窗口与面板都指向它） */
    startDownload: function(file) {
        App.startLocalWatcher(true);
        if (App.refreshModelCache) { App.refreshModelCache(); }
        fetch('/api/runtime/local/models/download', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({file: file})
        }).then(function(r) { return r.json(); }).then(function(res) {
            var state = document.getElementById('dlgState');
            if (!res || !res.success) {
                if (state) {
                    state.style.color = 'var(--err)';
                    state.textContent = '✗ 没能开始下载：' + ((res && res.error) || '');
                }
                return;
            }
            var msg = document.getElementById('llamaMsg');
            if (msg) { msg.textContent = res.message || ('已开始下载 ' + file); }
            App.tickLocal();
        }).catch(function(e) {
            var state = document.getElementById('dlgState');
            if (state) { state.style.color = 'var(--err)'; state.textContent = '✗ 没能开始下载：' + e; }
        });
    },

    /** 切换/使用某个模型（没下载的话先把下载窗口弹出来） */
    switchLlamaModel: function(file) {
        var m = App.modelRow(file);
        if (!m.downloaded) {
            App.openDownloadDialog(file, 'use');    // 前台窗口：进度就在里面
        }
        App.startLocalWatcher(true);
        var msg = document.getElementById('llamaMsg');
        if (msg) msg.textContent = '正在切换…';
        fetch('/api/runtime/local/model', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({file: file, download: true})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (msg) msg.textContent = (res && res.success)
                ? ((res.message || '已切换') + '（' + file + '）')
                : ('切换失败：' + ((res && res.error) || ''));
            App.tickLocal();
            setTimeout(function() { App.renderLlamaTab(); }, 1200);
        }).catch(function(e) { if (msg) msg.textContent = '切换失败：' + e; });
    },

    /** 只下载这一份（不切换）：可以把几份都先下好，再挑一份用 */
    downloadLlamaModel: function(file) {
        App.openDownloadDialog(file, 'download');
        App.startDownload(file);
    },

    /** 打开模型目录（想自己往里面塞 GGUF 时用） */
    openModelsDir: function() {
        var msg = document.getElementById('llamaMsg');
        fetch('/api/runtime/local/models/open-dir', {method: 'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                var dir = (res && res.data && res.data.dir) || '';
                if (msg) msg.textContent = (res && res.success)
                    ? ('已打开：' + dir + '（把 .gguf 丢进去，点「刷新」就能看到）')
                    : ('没能自动打开，请手动打开：' + dir);
            })
            .catch(function(e) { if (msg) msg.textContent = '没能打开目录：' + e; });
    },

    /** 重启本地模型（参数生效） */
    restartLocalModel: function() {
        var msg = document.getElementById('llamaMsg');
        if (msg) msg.textContent = '正在重启本地模型（要重新加载权重，可能要一两分钟）…';
        fetch('/api/runtime/local/restart', {method: 'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                if (msg) msg.textContent = res && res.success
                    ? '本地模型已按新参数启动。'
                    : ('重启失败：' + ((res && res.error) || ''));
            })
            .catch(function(e) { if (msg) msg.textContent = '重启失败：' + e; });
    },

    // ====== 音效提醒页签 ======
    // 任务完成 / 需要审批 / 任务出错时播放提示音。
    // 试听走的是后端真实播放（POST /api/notification/test），和实际提醒完全同一条路径 ——
    // 如果用浏览器 <audio> 放，会出现"试听挺响、真提醒没声"这种对不上的情况。
    renderNotificationTab: function() {
        fetch('/api/notification').then(function(r) { return r.json(); }).then(function(res) {
            var c = (res && res.success && res.data) ? res.data : {};
            var rowStyle = 'display:flex;align-items:center;justify-content:space-between;'
                         + 'padding:9px 0;border-bottom:1px solid var(--border-soft)';
            var nameStyle = 'font-size:13px;color:var(--text)';
            var descStyle = 'font-size:11px;color:var(--text-mute);margin-top:3px';
            var chk = 'width:16px;height:16px;cursor:pointer;accent-color:var(--accent)';

            function row(id, label, desc, checked, disabled) {
                return '<div style="' + rowStyle + '">'
                     +   '<div><div style="' + nameStyle + '">' + label + '</div>'
                     +   '<div style="' + descStyle + '">' + desc + '</div></div>'
                     +   '<input type="checkbox" id="' + id + '" style="' + chk + '"'
                     +   (checked ? ' checked' : '') + (disabled ? ' disabled' : '')
                     +   ' onchange="App.onNotificationChange()">'
                     + '</div>';
            }

            var html = '<p style="color:var(--text-dim);margin-bottom:14px;font-size:12px;line-height:1.7">'
                + '在这些时机播放提示音，不用一直盯着屏幕。<br>'
                + '音效由本机播放（不联网、不上传），改完立即生效。</p>';

            html += row('ntfEnabled', '启用音效提醒', '总开关', c.enabled !== false);

            var off = (c.enabled === false);
            html += row('ntfDone', '任务完成', '一轮任务跑完、停下来等你时',
                        c.soundDone !== false, off);
            html += row('ntfApproval', '需要审批', '工具被审批策略拦下、要你确认时',
                        c.soundApproval !== false, off);
            html += row('ntfQuestion', '向你提问', '模型信息不足、用 ask_user 问你一件事时',
                        c.soundQuestion !== false, off);
            html += row('ntfError', '任务出错', '模型调用失败或被手动中止时',
                        c.soundError !== false, off);

            // 音量
            var vol = (c.volume == null ? 80 : c.volume);
            html += '<div style="padding:14px 0 4px">'
                 +  '<div style="display:flex;justify-content:space-between;margin-bottom:6px">'
                 +    '<span style="' + nameStyle + '">音量</span>'
                 +    '<span id="ntfVolText" style="font-size:12px;color:var(--text-dim)">' + vol + '</span>'
                 +  '</div>'
                 +  '<input type="range" id="ntfVolume" min="0" max="100" step="5" value="' + vol + '"'
                 +  ' style="width:100%;accent-color:var(--accent)"'
                 +  ' oninput="document.getElementById(\'ntfVolText\').textContent=this.value"'
                 +  ' onchange="App.onNotificationChange()">'
                 +  '<div style="' + descStyle + '">0 = 静音</div>'
                 + '</div>';

            // 试听
            html += '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">'
                 +  '<div style="' + nameStyle + ';margin-bottom:8px">试听</div>'
                 +  '<button class="btn btn-sm" style="margin-right:8px" onclick="App.testSound(\'done\')">任务完成</button>'
                 +  '<button class="btn btn-sm" style="margin-right:8px" onclick="App.testSound(\'approval\')">需要审批</button>'
                 +  '<button class="btn btn-sm" style="margin-right:8px" onclick="App.testSound(\'question\')">向你提问</button>'
                 +  '<button class="btn btn-sm" onclick="App.testSound(\'error\')">任务出错</button>'
                 +  '<div style="' + descStyle + ';margin-top:8px">'
                 +  '试听不受总开关和节流限制，可以连点；音量按上面那条走。</div>'
                 + '</div>';

            html += '<div id="ntfStatus" style="margin-top:12px;font-size:12px;color:var(--ok)"></div>';

            document.getElementById('settingsContent').innerHTML = html;
        });
    },

    /** 任一开关/音量变化：立即保存，不需要额外的"保存"按钮 */
    onNotificationChange: function() {
        var st = document.getElementById('ntfStatus');
        var enabledEl = document.getElementById('ntfEnabled');
        if (!enabledEl) return;
        var body = {
            enabled: enabledEl.checked,
            soundDone: document.getElementById('ntfDone').checked,
            soundApproval: document.getElementById('ntfApproval').checked,
            soundQuestion: document.getElementById('ntfQuestion').checked,
            soundError: document.getElementById('ntfError').checked,
            volume: parseInt(document.getElementById('ntfVolume').value, 10)
        };
        // 总开关关掉时把分开关置灰；但不动它们的值，重新打开还能恢复原样
        ['ntfDone','ntfApproval','ntfQuestion','ntfError'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.disabled = !body.enabled;
        });
        fetch('/api/notification', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify(body)
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!st) return;
            st.style.color = res.success ? 'var(--ok)' : 'var(--err)';
            st.textContent = res.success ? '✓ 已保存' : ('✗ ' + (res.error || '保存失败'));
            setTimeout(function() { if (st) st.textContent = ''; }, 2000);
        }).catch(function(e) {
            if (st) { st.style.color = 'var(--err)'; st.textContent = '✗ 保存失败: ' + e; }
        });
    },

    /** 试听：走后端真实播放，和实际提醒同一条路径 */
    testSound: function(kind) {
        var st = document.getElementById('ntfStatus');
        fetch('/api/notification/test?kind=' + encodeURIComponent(kind), {method:'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                if (!st) return;
                st.style.color = res.success ? 'var(--ok)' : 'var(--err)';
                st.textContent = (res.success ? '✓ ' : '✗ ')
                               + (res.data || res.message || res.error || '');
            })
            .catch(function(e) {
                if (st) { st.style.color = 'var(--err)'; st.textContent = '✗ ' + e; }
            });
    },

    // ====== 模型来源页签（本地模型 / 自定义 API） ======
    renderProvidersTab: function() {
        var self = this;
        fetch('/api/runtime/mode').then(function(r) { return r.json(); }).then(function(res) {
            var d = (res && res.success && res.data) ? res.data : {};
            var mode = d.mode || 'local';
            var st = d.localStatus || {};
            var inp = 'width:100%;padding:7px 12px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;box-sizing:border-box';
            var mono = inp + ';font-family:monospace';
            var lbl = 'font-size:12px;color:var(--text-dim);display:block;margin-bottom:4px';

            var html = '<p style="color:var(--text-dim);margin-bottom:16px">选一种模型来源。'
                     + '<b style="color:var(--text)">本地模型</b>用本机自带的权重，不联网、不要 Key；'
                     + '<b style="color:var(--text)">自定义 API</b>填你自己的接口地址与密钥，'
                     + '任何兼容 OpenAI 调用格式的服务都能用。</p>';

            // ---- 模式切换 ----
            html += '<div style="display:flex;gap:8px;margin-bottom:18px">'
                 +  '<button id="modeLocal" class="btn ' + (mode === 'local' ? 'btn-primary' : '') + '" '
                 +  'style="flex:1" onclick="App.setRuntimeMode(\'local\')">本地模型</button>'
                 +  '<button id="modeCustom" class="btn ' + (mode === 'custom' ? 'btn-primary' : '') + '" '
                 +  'style="flex:1" onclick="App.setRuntimeMode(\'custom\')">自定义 API</button>'
                 +  '</div>';

            // ---- 本地模型 ----
            html += '<div style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px">';
            html += '<div style="font-weight:600;margin-bottom:10px">本地模型</div>';
            html += '<div style="margin-bottom:8px"><label style="' + lbl + '">推理端点</label>'
                 +  '<input style="' + mono + '" value="' + ((d.localBaseUrl || '') + '') + '" readonly></div>';
            html += '<div style="margin-bottom:8px"><label style="' + lbl + '">内置模型</label>'
                 +  '<input style="' + mono + '" value="' + ((d.localModel || '') + '') + '" readonly></div>';
            html += '<div id="localStatus" style="margin:10px 0;font-size:13px;line-height:1.7">'
                 +  self.localStatusText(st) + '</div>';
            html += '<button class="btn" style="margin-right:8px" onclick="App.downloadLocalModel()">下载模型</button>';
            html += '<button class="btn" style="margin-right:8px" onclick="App.loadLocalModel()">立即加载模型</button>';
            html += '<button class="btn" style="margin-right:8px" onclick="App.warmUpModel()">预热提示词</button>';
            html += '<button class="btn" onclick="App.unloadLocalModel()">卸载模型（释放显存）</button>';
            html += '<div id="warmupStatus" style="margin-top:8px;font-size:12px;color:var(--text-mute)"></div>';
            html += '<div style="margin-top:10px;font-size:12px;color:var(--text-mute)">'
                 +  '权重不随安装包分发：你在下面选了哪份，软件一启动就开始下那一份'
                 +  '（不占显存，进度就在输入框上面那块「模型」面板里；也可以点「下载模型」）。<br>'
                 +  '没下完也不耽误聊天：会先用目录里现成的那份，并在上面如实说明用的是哪份。'
                 +  '如果用自定义 API，本地模型永远不会被加载。<br>'
                 +  '<b>纯 CPU 推理时建议点一次「预热提示词」</b>：它会把系统提示词和工具定义'
                 +  '的前缀缓存提前算好，这样你的第一条消息不用等预填充（顺便实测出预填充速度）。</div>';
            html += '</div>';

            // ---- 自定义 API ----
            // 刻意不预设任何厂商：不填模板、不举例厂商名、不预置默认值，
            // 就是三个空输入框，URL / Key / 模型名全部由用户自己填。
            //
            // 表单要读 customApi 存档（而不是当前生效的端点）：
            // 切到本地模式后当前端点会变成内置运行时，如果这时表单也跟着清空，
            // 用户切回自定义 API 就得把地址和 Key 重新敲一遍 —— 看起来就是"点不回去"。
            var saved = d.customApi || {};
            var cUrl   = (mode === 'custom') ? (d.baseUrl || '') : (saved.baseUrl || '');
            var cKey   = (mode === 'custom') ? (d.apiKey || '')  : (saved.apiKey || '');
            var cModel = (mode === 'custom') ? (d.model || '')   : (saved.model || '');
            var hasSaved = !!(saved.baseUrl || saved.model);

            html += '<div style="border:1px solid var(--border);border-radius:8px;padding:14px">';
            html += '<div style="font-weight:600;margin-bottom:10px">自定义 API</div>';
            if (hasSaved && mode !== 'custom') {
                html += '<div style="margin-bottom:10px;font-size:12px;color:var(--ok)">'
                     +  '✓ 已保存过一份配置，点「自定义 API」会直接切回去，不用重填</div>';
            }
            html += '<div style="margin-bottom:8px"><label style="' + lbl + '">接口地址（Base URL）</label>'
                 +  '<input id="cfgCustomUrl" style="' + mono + '" placeholder="https://..." value="'
                 +  self.escapeHtml(cUrl) + '"></div>';
            html += '<div style="margin-bottom:8px"><label style="' + lbl + '">API Key</label>'
                 +  '<input id="cfgCustomKey" type="password" style="' + mono + '" placeholder="在这里粘贴你的 Key" value="'
                 +  self.escapeHtml(cKey) + '"></div>';
            html += '<div style="margin-bottom:8px"><label style="' + lbl + '">模型名称</label>'
                 +  '<input id="cfgCustomModel" style="' + mono + '" placeholder="填服务商给出的模型 ID" value="'
                 +  self.escapeHtml(cModel) + '"></div>';
            html += '<div id="customStatus" style="margin:10px 0;font-size:13px;color:var(--text-dim)"></div>';
            html += '<button class="btn btn-primary" onclick="App.saveCustomApi()">保存并启用</button>';
            html += '<div style="margin-top:10px;font-size:12px;color:var(--text-mute);line-height:1.8">'
                 +  '· 地址要填到版本号那一层，通常是 <span style="font-family:monospace">…/v1</span><br>'
                 +  '· 只要兼容 OpenAI 的 <span style="font-family:monospace">/chat/completions</span> 调用格式就能用，不限服务商<br>'
                 +  '· Key 只存在本机（用户目录下的 .lioncode/app-config.json），不会上传到任何地方<br>'
                 +  '· 切到本地模型不会清掉这里的内容，随时可以切回来</div>';
            html += '</div>';

            // ---- 工具调用方式（两种格式都支持，这里只是选"首选哪个"）----
            var tcm = d.toolCallMode || 'auto';
            html += '<div style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:14px">';
            html += '<div style="font-weight:600;margin-bottom:10px">工具调用方式</div>';
            html += '<div style="margin-bottom:8px"><label style="' + lbl + '">首选格式</label>'
                 +  '<select id="cfgToolCallMode" onchange="App.saveToolCallMode()" style="' + inp + '">'
                 +  '<option value="auto"'   + (tcm === 'auto'   ? ' selected' : '') + '>自动（推荐）—— 云端走原生 function calling，本地模型走向文本格式</option>'
                 +  '<option value="native"' + (tcm === 'native' ? ' selected' : '') + '>原生 function calling —— 下发 tools 定义，走 API 工具通道</option>'
                 +  '<option value="text"'   + (tcm === 'text'   ? ' selected' : '') + '>仅文本 —— 不发 tools，用提示词里的 &lt;tool_call&gt; 格式</option>'
                 +  '</select></div>';
            html += '<div id="toolCallModeStatus" style="margin:6px 0 10px;font-size:13px;color:var(--text-dim)"></div>';
            html += '<div style="font-size:12px;color:var(--text-mute);line-height:1.8">'
                 +  '· 两种格式<b>都能识别</b>：模型用原生 tool_calls 回、还是用文本 '
                 +  '<span style="font-family:monospace">&lt;tool_call&gt;</span> 回，系统都认，这里选的只是"让模型优先用哪种"<br>'
                 +  '· 本地模型是按住文本格式微调的，而且本地运行时没开工具模板，所以默认走文本<br>'
                 +  '· 云端 API 走原生更稳（结构化返回、不用解析文本），默认就这样<br>'
                 +  '· 接口不认 tools 或工具配套参数时会自动降级重试，不用手动切换</div>';
            html += '</div>';

            document.getElementById('settingsContent').innerHTML = html;
        });
    },

    /** 把本地运行时状态渲染成一行中文 */
    localStatusText: function(st) {
        st = st || {};
        if (!st.runtimeInstalled) {
            return '<span style="color:var(--err)">✗ 找不到模型运行时（runtime-vulkan\\llama-server.exe）</span>';
        }
        if (!st.modelInstalled) {
            // 没下载 ≠ 出错：权重是首次使用时才下的，这里要把话说清楚，
            // 不然用户一打开设置页就以为坏了（而且真正的失败原因会被这行红字盖住）。
            if (st.phase === 'downloading') {
                var mb = Math.floor((st.downloadBytes || 0) / 1048576);
                if (st.downloadTotal > 0) {
                    var pct = Math.floor((st.downloadBytes || 0) * 100 / st.downloadTotal);
                    return '<span style="color:var(--warn)">⏳ 正在下载模型… ' + pct + '%（'
                         + mb + ' / ' + Math.floor(st.downloadTotal / 1048576) + ' MB）</span>';
                }
                return '<span style="color:var(--warn)">⏳ 正在下载模型…（已下 ' + mb + ' MB）</span>';
            }
            if (st.lastError) {
                return '<span style="color:var(--err)">✗ 模型没能就绪：' + st.lastError + '</span>';
            }
            return '<span style="color:var(--warn)">○ 模型尚未下载（只下一次）</span>'
                 + '<span style="color:var(--text-mute)"> —— 发第一条消息会自动开始下载，'
                 + '也可以点下面的「下载模型」先下好</span>';
        }
        if (st.running) {
            return '<span style="color:var(--ok)">✓ 模型已加载，正在服务</span>'
                 + '<span style="color:var(--text-mute)"> （' + (st.host || '') + ':' + (st.port || '') + '）</span>';
        }
        if (st.starting) {
            return '<span style="color:var(--warn)">⏳ 正在加载模型…</span>'
                 + '<span style="color:var(--text-mute)"> 首次加载约 30~90 秒</span>';
        }
        if (st.lastError) {
            return '<span style="color:var(--err)">✗ 上次启动失败：' + st.lastError + '</span>';
        }
        return '<span style="color:var(--text-dim)">○ 模型未加载（发出第一条消息时自动加载）</span>';
    },

    /** 切换运行方式 */
    setRuntimeMode: function(mode) {
        var self = this;
        if (mode === 'custom') {
            // 先看表单里有没有值；没有就把存档读回来填上（表单在本地模式下是空的时候才会这样）
            var box = document.getElementById('customStatus');
            var url = (document.getElementById('cfgCustomUrl') || {}).value || '';
            var key = (document.getElementById('cfgCustomKey') || {}).value || '';
            var mdl = (document.getElementById('cfgCustomModel') || {}).value || '';
            if (url.trim() && mdl.trim()) {
                self.saveCustomApi();
                return;
            }
            // 表单本身也空 —— 让后端从存档里取，取不到会明确报错
            fetch('/api/runtime/mode', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({mode: 'custom', baseUrl: url.trim(),
                                      apiKey: key.trim(), model: mdl.trim()})
            }).then(function(r) { return r.json(); }).then(function(res) {
                if (!res.success) {
                    if (box) {
                        box.style.color = 'var(--err)';
                        box.textContent = '✗ ' + (res.error || '切换失败') + '（请在下面填好三项再点）';
                    }
                    return;
                }
                App.fillModels([{modelId: res.data.model, modelName: res.data.model}]);
                App.renderProvidersTab();
                App.refreshRuntimeBanner();
            });
            return;
        }
        fetch('/api/runtime/mode', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({mode: 'local'})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!res.success) { alert(res.error || '切换失败'); return; }
            App.renderProvidersTab();
            App.refreshRuntimeBanner();
        });
    },

    /** 保存自定义 API 并切过去 */
    saveCustomApi: function() {
        var box = document.getElementById('customStatus');
        var baseUrl = (document.getElementById('cfgCustomUrl') || {}).value || '';
        var apiKey  = (document.getElementById('cfgCustomKey') || {}).value || '';
        var model   = (document.getElementById('cfgCustomModel') || {}).value || '';
        if (!baseUrl.trim()) { box.style.color = 'var(--err)'; box.textContent = '请填写 Base URL'; return; }
        if (!model.trim())   { box.style.color = 'var(--err)'; box.textContent = '请填写模型名称'; return; }
        box.style.color = 'var(--text-dim)';
        box.textContent = '正在保存并测试连接…';
        fetch('/api/runtime/mode', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({mode: 'custom', baseUrl: baseUrl.trim(), apiKey: apiKey.trim(), model: model.trim()})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!res.success) { box.style.color = 'var(--err)'; box.textContent = '✗ ' + (res.error || '保存失败'); return; }
            box.style.color = 'var(--ok)';
            box.textContent = '✓ 已启用自定义 API';
            App.fillModels([{id: model.trim(), name: model.trim()}]);
            App.renderProvidersTab();
            App.refreshRuntimeBanner();
        }).catch(function(e) {
            box.style.color = 'var(--err)'; box.textContent = '✗ 保存失败: ' + e;
        });
    },

    /** 保存工具调用方式（auto / native / text） */
    saveToolCallMode: function() {
        var sel = document.getElementById('cfgToolCallMode');
        var box = document.getElementById('toolCallModeStatus');
        if (!sel) { return; }
        var mode = sel.value;
        box.style.color = 'var(--text-dim)';
        box.textContent = '正在保存…';
        fetch('/api/runtime/tool-call-mode', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({mode: mode})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!res || !res.success) {
                box.style.color = 'var(--err)';
                box.textContent = '✗ ' + ((res && res.error) || '保存失败');
                return;
            }
            box.style.color = 'var(--ok)';
            box.textContent = '✓ 已保存：' + ({
                auto:   '自动（云端原生 / 本地文本）',
                native: '原生 function calling',
                text:   '仅文本 <tool_call>'
            }[mode] || mode) + '（下一条消息生效）';
        }).catch(function(e) {
            box.style.color = 'var(--err)';
            box.textContent = '✗ 保存失败: ' + e;
        });
    },

    /** 预热：把系统提示词 + 工具定义的前缀缓存提前算好（纯 CPU 推理时很关键） */
    warmUpModel: function() {
        var box = document.getElementById('warmupStatus');
        if (box) { box.innerHTML = '<span style="color:var(--warn)">⏳ 正在预热（首次会把模型也拉起来）…</span>'; }
        fetch('/api/runtime/warmup', {method:'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                var d = (res && res.data) || {};
                if (!box) { return; }
                if (!d.warmed) {
                    box.innerHTML = '<span style="color:var(--err)">未预热：' + (d.reason || '未知') + '</span>';
                    return;
                }
                box.innerHTML = '<span style="color:var(--ok)">✓ 预热完成</span>'
                    + '<span style="color:var(--text-mute)">　前缀 ' + d.promptTokens + ' token，'
                    + '耗时 ' + d.seconds + ' 秒 → <b>' + d.tokensPerSecond + ' tok/s</b> 预填充速度'
                    + '（含工具定义 ' + d.toolDefinitions + ' 个）</span>';
            })
            .catch(function(e) {
                if (box) { box.innerHTML = '<span style="color:var(--err)">✗ 预热失败: ' + e + '</span>'; }
            });
    },

    /** 手动加载本地模型 */
    /**
     * 只下载权重、不加载模型（不占显存）。
     * 权重不随安装包分发，首次用到时后端会自动下；这个按钮是给"想先下好"的人用的。
     */
    downloadLocalModel: function() {
        var box = document.getElementById('localStatus');
        var cur = (document.getElementById('llama_modelFile') || {}).value || '';
        if (cur) { App.openDownloadDialog(cur, 'download'); }
        box.innerHTML = '<span style="color:var(--warn)">⏳ 正在下载体积…（进度在下面那个窗口里）</span>';
        fetch('/api/runtime/local/download', {method:'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                var st = (res && res.data) || {};
                if (st.modelInstalled) {
                    box.innerHTML = '<span style="color:var(--ok)">✓ 权重已下载完成</span>'
                                  + App.localStatusText(st);
                } else {
                    box.innerHTML = App.localStatusText(st);
                }
                // 注意：这里原来调的是 App.loadModels()，而那个函数根本不存在 ——
                // 异常会被下面的 catch 捕获，于是界面显示"✗ 下载失败: TypeError: ..."，
                // 明明下载成功了却报失败。刷新模型下拉用的是 fillModelsFromConfig()。
                if (res && res.success) { App.fillModelsFromConfig(); }
            })
            .catch(function(e) {
                box.innerHTML = '<span style="color:var(--err)">✗ 下载失败: ' + e + '</span>';
            });
    },

    loadLocalModel: function() {
        var box = document.getElementById('localStatus');
        box.innerHTML = '<span style="color:var(--warn)">⏳ 正在加载模型…（首次约 30~90 秒）</span>';
        fetch('/api/runtime/local/start', {method:'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                box.innerHTML = App.localStatusText((res && res.data) || {});
                if (res && res.success) { App.refreshRuntimeBanner(); App.fillModelsFromConfig(); }
            })
            .catch(function(e) {
                box.innerHTML = '<span style="color:var(--err)">✗ 加载失败: ' + e + '</span>';
            });
    },

    /** 手动卸载本地模型 */
    unloadLocalModel: function() {
        fetch('/api/runtime/local/stop', {method:'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                var box = document.getElementById('localStatus');
                if (box) box.innerHTML = App.localStatusText((res && res.data) || {});
                App.refreshRuntimeBanner();
            });
    },

    /** 顶部提示条：当前用的是本地模型还是自定义 API */
    refreshRuntimeBanner: function() {
        fetch('/api/runtime/mode').then(function(r) { return r.json(); }).then(function(res) {
            if (!res || !res.success) return;
            var d = res.data || {};
            var el = document.getElementById('runtimeBanner');
            if (!el) return;
            if (d.mode === 'custom') {
                el.innerHTML = '<span style="color:var(--info)">●</span> 自定义 API：'
                             + '<span style="font-family:monospace">' + (d.model || '') + '</span>'
                             + ' <span style="color:var(--text-mute)">切换 ▾</span>';
                el.title = (d.baseUrl || '') + '（点击切换模型来源）';
            } else {
                var st = d.localStatus || {};
                var dot = st.running ? '<span style="color:var(--ok)">●</span>'
                                     : '<span style="color:var(--text-mute)">○</span>';
                var txt = st.running ? '已加载' : '未加载';
                // 正在下载你选的那份权重时，横幅里直接报进度，
                // 不然用户只看到“未加载”，以为没动静。
                if (st.phase === 'downloading') {
                    var dmb = Math.floor((st.downloadBytes || 0) / 1048576);
                    txt = st.downloadTotal > 0
                        ? '正在下载 ' + Math.floor((st.downloadBytes || 0) * 100 / st.downloadTotal)
                          + '%（' + dmb + '/' + Math.floor(st.downloadTotal / 1048576) + ' MB）'
                        : '正在下载（已下 ' + dmb + ' MB）';
                    dot = '<span style="color:var(--warn)">●</span>';
                }
                el.innerHTML = dot + ' 本地模型：' + (d.model || '')
                             + ' <span style="color:var(--text-mute)">' + txt + ' · 切换 ▾</span>';
                el.title = (d.baseUrl || '') + '（点击切换模型来源）';
                // 下载中的进度由 App.tickLocal 统一刷（进度条 + 横幅一起动）
                if (st.phase === 'downloading') { App.startLocalWatcher(); }
            }
        });
    },

    /**
     * 模型下载观察器：每 1.5 秒查一次本地运行时状态，把前台进度条刷新。
     *
     * 为什么单独一个：下载是后端后台线程在跑，界面得自己盯着；
     * 顺带算出速度和剩余时间 —— 下 5 GB 的时候，"还要多久"比百分比更让人安心。
     */
    startLocalWatcher: function(fast) {
        // 下载时 1.5 秒一次（进度条要跟得上），空闲时 5 秒一次（够发现"后端自己开始下了"）
        var want = fast ? 1500 : 5000;
        if (App._localTimer && App._localSpeed === want) return;
        if (App._localTimer) { clearInterval(App._localTimer); }
        App._localSpeed = want;
        App._localTimer = setInterval(function() { App.tickLocal(); }, want);
        App.tickLocal();
    },

    tickLocal: function() {
        fetch('/api/runtime/local').then(function(r) { return r.json(); }).then(function(res) {
            var st = (res && res.data) || {};
            App._lastLocal = st;
            App.renderDownloadBar(st);
            App.renderModelPanel();
            App.updateDownloadDialog(st);
        }).catch(function() { /* 网络抖一下就等下一拍 */ });
    },

    /** 模型清单缓存（面板要用；别每 1.5 秒拉一次） */
    refreshModelCache: function() {
        return fetch('/api/runtime/local/models').then(function(r) { return r.json(); })
            .then(function(res) {
                App.modelsCache = (res && res.success && res.data) ? res.data : [];
                App.renderModelPanel();
                return App.modelsCache;
            }).catch(function() { return App.modelsCache || []; });
    },

    toggleModelPanel: function() {
        App._modelPanelOpen = !App._modelPanelOpen;
        App.renderModelPanel();
    },

    /**
     * 前台「模型」面板。收起来是一行状态，有事（没下 / 在下 / 下载失败 / 手动展开）就摊开。
     */
    renderModelPanel: function() {
        var box = document.getElementById('modelPanel');
        if (!box) return;
        var st = App._lastLocal || {};
        var models = App.modelsCache || [];
        if (!models.length) { box.style.display = 'none'; return; }
        box.style.display = 'block';

        var phase = st.phase || '';
        var downloading = phase === 'downloading';
        var dfile = st.downloadingFile || '';
        var cur = st.modelFile || '';
        var curRow = null;
        for (var i = 0; i < models.length; i++) {
            if (models[i].file === cur) { curRow = models[i]; }
        }
        var curLabel = curRow ? curRow.label : cur;

        // 你选的那份还没下载：这是最该让用户看见的情况
        var missing = curRow && !curRow.downloaded;
        var open = App._modelPanelOpen === true || downloading || phase === 'failed' || missing;

        var html = '';
        // ---- 收起时的那一行 ----
        var dot, line;
        if (downloading) {
            dot = '<span style="color:var(--warn)">●</span>';
            line = '正在下载 <b style="color:var(--text)">' + App.escapeHtml(dfile || cur) + '</b>';
        } else if (phase === 'failed') {
            dot = '<span style="color:var(--err)">●</span>';
            line = '下载失败：' + App.escapeHtml(st.lastError || '看日志');
        } else if (missing) {
            dot = '<span style="color:var(--err)">●</span>';
            line = '你选的 <b style="color:var(--text)">' + App.escapeHtml(curLabel)
                 + '</b> 还没下载（' + (curRow.sizeText || (curRow.sizeGb + ' GB')) + '）'
                 + (st.running ? '，现在临时在用别的' : '');
        } else {
            dot = st.running ? '<span style="color:var(--ok)">●</span>' : '<span style="color:var(--text-mute)">○</span>';
            line = '本地模型：<b style="color:var(--text)">' + App.escapeHtml(curLabel) + '</b>'
                 + ' <span style="color:var(--text-mute)">'
                 + (st.running ? '正在用' : '已就绪（发消息时加载）') + '</span>';
        }
        html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
             +  '<span>' + dot + '</span><span style="flex:1;min-width:180px">' + line + '</span>'
             +  '<button class="btn btn-sm" onclick="App.toggleModelPanel()">'
             +  (open ? '收起 ▴' : '版本 / 下载 ▾') + '</button>'
             +  '<button class="btn btn-sm" onclick="App.openModelsDir()">📂 文件夹</button>'
             +  '<button class="btn btn-sm" onclick="App.showSettings()">⚙️ 详细设置</button>'
             +  '</div>';

        // ---- 摊开时：下载总进度条 ----
        if (open && downloading) {
            var bytes = st.downloadBytes || 0, total = st.downloadTotal || 0;
            var pct = total > 0 ? Math.floor(bytes * 100 / total) : 0;
            var speedTxt = App._dlSpeedTxt || '';
            html += '<div style="display:flex;align-items:center;gap:10px;margin-top:8px">'
                 +  '<div style="flex:1;height:10px;background:var(--inset);border:1px solid var(--border);'
                 +  'border-radius:5px;overflow:hidden;min-width:120px">'
                 +  '<div id="mpFill" style="height:100%;width:' + pct + '%;'
                 +  'background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .4s"></div></div>'
                 +  '<span style="color:var(--warn);font-variant-numeric:tabular-nums;width:42px;'
                 +  'text-align:right">' + pct + '%</span>'
                 +  '<span style="color:var(--text-dim);white-space:nowrap">' + App.mbText(bytes)
                 +  (total > 0 ? ' / ' + App.mbText(total) : '')
                 +  (speedTxt ? ' · ' + speedTxt : '') + '</span>'
                 +  '</div>';
        }

        // ---- 摊开时：每个版本一行 ----
        if (open) {
            html += '<div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">';
            for (var k = 0; k < models.length; k++) {
                var m = models[k];
                var tag = '';
                if (m.current) { tag = ' <span style="color:var(--accent)">· 正在用</span>'; }
                else if (m.configured) { tag = ' <span style="color:var(--accent)">· 已选中</span>'; }
                if (m.downloading) { tag += ' <span style="color:var(--warn)">· 正在下载</span>'; }
                else if (!m.downloaded) { tag += ' <span style="color:var(--text-mute)">· 未下载</span>'; }
                html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;'
                     +  'padding:5px 8px;background:var(--inset);border:1px solid var(--border-soft);border-radius:6px">'
                     +  '<span style="flex:1;min-width:200px;color:var(--text)">'
                     +  App.escapeHtml(m.label) + tag
                     +  ' <span style="color:var(--text-mute);font-size:11px">'
                     +  (m.sizeText || (m.sizeGb + ' GB')) + (m.custom ? ' · 你放进去的' : '')
                     +  '</span></span>';
                if (m.downloading) {
                    html += '<span style="color:var(--warn);font-size:11.5px">下载中…</span>';
                } else {
                    if (!m.downloaded) {
                        html += '<button class="btn btn-sm" onclick="App.downloadLlamaModel(\''
                             +  App.escapeAttr(m.file) + '\')">下载</button>';
                    }
                    if (!m.current) {
                        html += '<button class="btn btn-sm" onclick="App.switchLlamaModel(\''
                             +  App.escapeAttr(m.file) + '\')">'
                             +  (m.configured ? '重启生效' : '使用') + '</button>';
                    }
                }
                html += '</div>';
            }
            html += '</div>';
            html += '<div style="margin-top:7px;font-size:11px;color:var(--text-mute)">'
                 +  '模型目录：<span style="font-family:monospace">'
                 +  App.escapeHtml(st.modelDir || '') + '</span>'
                 +  ' —— 自己的 .gguf 丢进去，点「📂 文件夹」就能打开；'
                 +  '想让下好的那份生效，点「使用」，再发一条消息即可。</div>';
        }
        box.innerHTML = html;
    },

    /** 把状态渲染成前台进度条；不在下载就收起来 */
    renderDownloadBar: function(st) {
        var bar = document.getElementById('dlBar');
        if (!bar) return;
        var phase = st.phase || '';
        var file = st.downloadingFile || st.modelFile || '';
        var bytes = st.downloadBytes || 0;
        var total = st.downloadTotal || 0;

        if (phase === 'downloading') {
            var pct = total > 0 ? Math.floor(bytes * 100 / total) : 0;
            // 速度 / 剩余时间：拿上一次的采样算
            var now = Date.now();
            var speedTxt = '';
            if (App._dlPrev && App._dlPrev.bytes > 0 && now > App._dlPrev.at) {
                var sp = (bytes - App._dlPrev.bytes) / ((now - App._dlPrev.at) / 1000.0);
                if (sp > 0) {
                    speedTxt = (sp / 1048576).toFixed(1) + ' MB/s';
                    if (total > bytes) {
                        var left = Math.round((total - bytes) / sp);
                        speedTxt += ' · 约 ' + (left >= 60
                            ? Math.round(left / 60) + ' 分钟'
                            : left + ' 秒') + '后完成';
                    }
                }
            }
            App._dlPrev = {bytes: bytes, at: now};
            App._dlSpeedTxt = speedTxt;      // 前台面板也用这一份速度/剩余时间

            bar.style.display = 'block';
            bar.style.background = 'var(--panel-2)';
            document.getElementById('dlIcon').textContent = '⏳';
            document.getElementById('dlText').textContent = '正在下载 ' + file;
            document.getElementById('dlFill').style.width = pct + '%';
            document.getElementById('dlPct').textContent = pct + '%';
            document.getElementById('dlSpeed').textContent =
                App.mbText(bytes) + (total > 0 ? ' / ' + App.mbText(total) : '')
                + (speedTxt ? ' · ' + speedTxt : '') + ' · 下完自动可用';
            // 设置页里那一行的小进度条也一起动
            var rowFill = document.getElementById('dlrowfill_' + file);
            if (rowFill) { rowFill.style.width = pct + '%'; }
            App._dlWasRunning = true;
            if (App._localSpeed !== 1500) { App.startLocalWatcher(true); }
            return;
        }

        // 不在下载了：如果刚刚还在下，闪一句结果再收起来
        if (App._dlWasRunning) {
            App._dlWasRunning = false;
            App._dlPrev = null;
            var done = !!st.modelInstalled;
            var failed = phase === 'failed';
            bar.style.display = 'block';
            bar.style.background = failed ? 'var(--err-bg)' : 'var(--ok-bg)';
            document.getElementById('dlIcon').textContent = failed ? '✗' : '✓';
            document.getElementById('dlText').textContent = failed
                ? ('下载失败：' + (st.lastError || '原因见日志'))
                : ('下载完成：' + file + '（在「设置 → 模型版本」里点「使用」就能切过去）');
            document.getElementById('dlFill').style.width = failed ? '0%' : '100%';
            document.getElementById('dlPct').textContent = failed ? '' : '100%';
            document.getElementById('dlSpeed').textContent = '';
            setTimeout(function() {
                var b = document.getElementById('dlBar');
                if (b) b.style.display = 'none';
            }, failed ? 15000 : 8000);
            // 清单/设置页/前台面板跟着刷新（下载完成状态要变）
            if (App.fillModelsFromConfig) { App.fillModelsFromConfig(); }
            App.refreshModelCache();
            var settingsOpen = document.getElementById('settingsContent');
            if (settingsOpen && settingsOpen.innerHTML.indexOf('模型版本') >= 0) {
                App.renderLlamaTab();
            }
        } else {
            bar.style.display = 'none';
        }
        // 空闲下来：放慢轮询，但**不停** —— 后端开机也会自己下权重，停掉就看不见了
        if (App._localSpeed !== 5000) { App.startLocalWatcher(false); }
    },

    /** 把字节数说成人话 */
    mbText: function(b) {
        b = b || 0;
        if (b >= 1073741824) { return (b / 1073741824).toFixed(2) + ' GB'; }
        return Math.floor(b / 1048576) + ' MB';
    },

        var box = document.getElementById('cfgLocalStatus') || document.getElementById('localStatus');

    // ====== 审批策略页签 ======
    renderApprovalsTab: function() {

        box.innerHTML = '<p style="color:var(--text-dim)">正在加载工具列表…</p>';

    // 本地版：不再有“选择服务商 / 填 API Key / Token-Plan”流程。
    // 模型来源固定为 LionBox 本地端点，检测入口见 checkBoxModel()。

    fillModels: function(models) {
        var sel = document.getElementById('modelSelect');
        sel.innerHTML = '<option value="">选择模型...</option>';
        models.forEach(function(m) {
            var opt = document.createElement('option');
            opt.value = m.modelId || m.id;
            opt.textContent = m.modelName || m.name || m.modelId || m.id;
            sel.appendChild(opt);
        });
        // 默认选第一个
        if (models.length > 0) {
            sel.selectedIndex = 1;
            this.onModelChange();
        }
    },

    // 只内置一个模型；保留该函数仅为兜底，不再含任何云厂商列表
    fillDefaultModels: function(providerId) {
        this.fillModels([{modelId:'lion-models1', modelName:'lion-models1'}]);
    },

    onModelChange: function() {
        var sel = document.getElementById('modelSelect');
        var modelId = sel.value;
        var tl = document.getElementById('thinkingLevel');
        if (!modelId) { tl.disabled = true; tl.innerHTML = '<option>选择模型后加载</option>'; return; }

        // 本地模型不支持思考等级（GGUF 运行时无 reasoning effort 参数）
        var levels = [];
        var lower = modelId.toLowerCase();

        if (levels.length === 0) {
            tl.disabled = true;
            tl.innerHTML = '<option>不支持思考等级</option>';
        } else {
            tl.disabled = false;
            tl.innerHTML = '';
            levels.forEach(function(l) {
                var opt = document.createElement('option');
                opt.value = l.code;
                opt.textContent = l.name;
                if (l.default) opt.selected = true;
                tl.appendChild(opt);
            });
            // 恢复上次保存的思考等级
            if (this.savedThinkingLevel) {
                tl.value = this.savedThinkingLevel;
                this.savedThinkingLevel = '';
            }
        }

        // 持久化模型与思考等级选择（重启后自动恢复）
        fetch('/api/chat/adapter/model', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                model: modelId,
                thinkingLevel: tl.disabled ? '' : tl.value
            })
        }).catch(function() {});
    },

    // ====== 界面主题（黑灰 / 白灰两套，设置里切换，立即生效、刷新后保持）======
    /** 用户选的主题：'auto' | 'dark' | 'light'（存在 localStorage） */
    themeChoice: function() {
        try {
            var v = localStorage.getItem('lionbox.theme');
            return (v === 'dark' || v === 'light') ? v : 'auto';
        } catch (e) { return 'auto'; }        // 隐私模式读不了 localStorage 就当跟随系统
    },

    /** 系统当前偏好（拿不到 matchMedia 就当暗色） */
    systemTheme: function() {
        try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                return 'light';
            }
        } catch (e) { /* 老浏览器没有 matchMedia */ }
        return 'dark';
    },

    /** auto → 跟随系统 */
    effectiveTheme: function(pref) {
        var p = pref || this.themeChoice();
        return (p === 'auto') ? this.systemTheme() : p;
    },

    /**
     * 把主题挂到 <html data-theme>。所有颜色都是 CSS 变量，所以这里改完**立即生效**，
     * 不用刷新，也不需要两套重复样式。
     */
    applyTheme: function(pref) {
        var p = pref || this.themeChoice();
        var eff = this.effectiveTheme(p);
        this.themePref = p;
        this.themeEffective = eff;
        try {
            if (document.documentElement && document.documentElement.setAttribute) {
                document.documentElement.setAttribute('data-theme', eff);
            }
            if (document.body && document.body.setAttribute) {
                document.body.setAttribute('data-theme', eff);
            }
        } catch (e) { /* 挂不上也不影响别的功能 */ }
        return eff;
    },

    /** 设置 → 界面：点「暗色 / 亮色 / 跟随系统」 */
    setTheme: function(pref) {
        if (pref !== 'dark' && pref !== 'light') { pref = 'auto'; }
        try { localStorage.setItem('lionbox.theme', pref); } catch (e) { /* 存不下就只生效这一次 */ }
        this.applyTheme(pref);
        if (this.currentSettingsTab === 'appearance') { this.renderAppearanceTab(); }
    },

    /** 启动时恢复上次的选择；选了「跟随系统」就跟着系统变 */
    initTheme: function() {
        var self = this;
        this.applyTheme(this.themeChoice());
        try {
            if (window.matchMedia) {
                var mq = window.matchMedia('(prefers-color-scheme: light)');
                var onChange = function() {
                    if (self.themeChoice() === 'auto') { self.applyTheme('auto'); }
                };
                if (mq.addEventListener) { mq.addEventListener('change', onChange); }
                else if (mq.addListener) { mq.addListener(onChange); }
            }
        } catch (e) { /* 监听不上也没关系，下次刷新按系统走 */ }
    },

    renderAppearanceTab: function() {
        var box = document.getElementById('settingsContent');
        if (!box) return;
        var cur = this.themeChoice();
        function card(code, title, desc, swatch) {
            var on = (cur === code);
            return '<button class="theme-card' + (on ? ' active' : '') + '" onclick="App.setTheme(\'' + code + '\')">'
                 +   '<span class="theme-swatch" style="background:' + swatch + '"></span>'
                 +   '<span class="grow"><span class="set-name">' + title + '</span>'
                 +   '<span class="set-desc">' + desc + '</span></span>'
                 +   '<span class="theme-check">' + (on ? '✓' : '') + '</span>'
                 + '</button>';
        }
        var html = '<div class="set-block">'
            + '<div class="set-block-head"><div class="set-block-title">主题</div>'
            + '<span class="set-msg">当前生效：' + (this.themeEffective === 'light' ? '亮色（白 + 偏灰）' : '暗色（黑 + 灰）') + '</span></div>'
            + card('dark', '暗色（黑 + 灰）', '近黑底 + 灰面板，长时间看代码不刺眼', 'var(--sw-dark)')
            + card('light', '亮色（白 + 偏灰）', '白底 + 浅灰面板，白天或投屏时更清楚', 'var(--sw-light)')
            + card('auto', '跟随系统', '系统是深色就用暗色，是浅色就用亮色',
                   'linear-gradient(90deg,var(--sw-dark) 50%,var(--sw-light) 50%)')
            + '<div class="set-note" style="margin-top:8px">换主题立即生效，不用刷新；'
            + '选择记在本机（localStorage），下次打开还是这一套。</div>'
            + '</div>';
        box.innerHTML = html;
    },

    // ====== 设置：插件 ======
    /** 后端两种返回都认：新的 {ok:true,...} 和旧的 {success:true,data:...} */
    respOk: function(res) {
        if (!res) return false;
        if (res.ok === true) return true;
        if (res.ok === false) return false;
        return res.success === true;
    },

    /** 从响应里取数组：新契约在 plugins/skills/items 字段，旧契约在 data 里 */
    respList: function(res, key) {
        if (!res) return null;
        if (res[key] && res[key].length !== undefined) { return res[key]; }
        if (res.data && res.data.length !== undefined) { return res.data; }
        if (res.data && res.data[key] && res.data[key].length !== undefined) { return res.data[key]; }
        if (res.items && res.items.length !== undefined) { return res.items; }
        return null;
    },

    /** 插件分类中文名：优先用后端给的 kinds，其次内置默认表 */
    kindLabel: function(kind, kinds) {
        var k = String(kind || '').toUpperCase();
        var list = kinds || [];
        for (var i = 0; i < list.length; i++) {
            if (String(list[i].code || '').toUpperCase() === k) { return list[i].label || list[i].code; }
        }
        var def = { TOOL: '工具', SKILL: '技能', PROVIDER: '模型来源', HOOK: '钩子', EXTENSION: '扩展' };
        return def[k] || (kind || '其他');
    },

    /**
     * 来源怎么显示：内置 / 外置。
     * 优先后端的 builtin 布尔值；只有旧接口（没有 builtin，只给 source 字符串）时才看 source。
     * 有的后端在 source 里塞的是文件路径，那种一律算"外置"（放在插件目录里的），
     * 完整路径挂在 title 上，想看细节鼠标停一下就出来。
     */
    sourceLabel: function(it) {
        if (it && it.builtin === true) { return '内置'; }
        if (it && it.builtin === false) { return '外置'; }
        var s = (it && it.source) ? String(it.source) : '';
        if (!s) { return '内置'; }          // 旧接口不给 builtin/source：注册表里的都是随程序带的内置插件
        if (s.indexOf('\\') >= 0 || s.indexOf('/') >= 0) { return '外置'; }
        var u = s.toUpperCase();
        if (u === 'BUILTIN') { return '内置'; }
        if (u === 'EXTERNAL') { return '外置'; }
        return s;
    },

    /** 来源的完整原始值（路径那种当 tooltip 用） */
    sourceTitle: function(it) {
        var s = (it && it.source) ? String(it.source) : '';
        return (s.indexOf('\\') >= 0 || s.indexOf('/') >= 0) ? s : '';
    },

    /** 后端还没就绪时的兜底文案：说清楚是哪个接口失败，不影响别的功能 */
    notReady: function(what, api, res) {
        var why = (res && (res.error || res.message)) ? ('后端返回：' + (res.error || res.message)) : '接口还没实现或请求失败';
        return '<div class="set-block"><div class="set-block-title">' + what + '</div>'
             + '<div class="set-note" style="margin-top:6px">该功能的后端还没就绪（'
             + this.escapeHtml(api) + '：' + this.escapeHtml(String(why))
             + '）。聊天、工具调用、模型设置都不受影响。</div></div>';
    },

    renderPluginsTab: function() {
        var self = this;
        var box = document.getElementById('settingsContent');
        if (!box) return;
        box.innerHTML = '<p class="set-note">正在加载插件列表…</p>';
        fetch('/api/plugins').then(function(r) { return r.json(); }).then(function(res) {
            if (!self.respOk(res)) { box.innerHTML = self.notReady('插件', 'GET /api/plugins', res); return; }
            self.pluginsData = self.respList(res, 'plugins') || [];
            self.pluginKinds = res.kinds || ((res.data && res.data.kinds) || []);
            self.pluginDevMode = (res.devMode === true) || !!(res.data && res.data.devMode === true);
            self.pluginsDir = res.pluginsDir || ((res.data && res.data.pluginsDir) || '');
            box.innerHTML = self.pluginsTabHtml();
        }).catch(function() {
            box.innerHTML = self.notReady('插件', 'GET /api/plugins');
        });
    },

    pluginsTabHtml: function() {
        var self = this;
        var plugins = this.pluginsData || [];
        var kinds = this.pluginKinds || [];
        var html = '<div class="set-block">'
            + '<div class="set-block-head">'
            +   '<div class="set-block-title">插件（' + plugins.length + '）</div>'
            +   '<button class="btn btn-sm" onclick="App.reloadPlugins()">↻ 重新加载插件</button>'
            + '</div>'
            + '<label class="set-row" style="cursor:pointer">'
            +   '<span class="grow"><span class="set-name">插件开发模式</span>'
            +   '<span class="set-desc">打开后可以在下面生成插件骨架；改完代码重新加载即可生效</span></span>'
            +   '<span class="switch"><input type="checkbox" id="pluginDevMode"' + (this.pluginDevMode ? ' checked' : '')
            +     ' onchange="App.setPluginDevMode(this.checked)"><span class="knob"></span></span>'
            + '</label>'
            + '<div class="set-msg" id="pluginTabMsg">'
            +   (this.pluginsDir ? ('插件目录：<span style="font-family:monospace">' + this.escapeHtml(this.pluginsDir) + '</span>') : '')
            + '</div>';

        // 按 kind 分组：顺序按后端给的 kinds，后端没给过的分类排后面
        var order = [];
        kinds.forEach(function(k) { order.push(String(k.code || '').toUpperCase()); });
        var groups = {};
        plugins.forEach(function(p) {
            var k = String(p.kind || p.type || 'OTHER').toUpperCase();
            if (!groups[k]) { groups[k] = []; if (order.indexOf(k) < 0) { order.push(k); } }
            groups[k].push(p);
        });
        order.forEach(function(k) {
            var items = groups[k];
            if (!items || !items.length) { return; }
            html += '<div class="set-group-title" style="display:flex;align-items:center;gap:8px">'
                 +  '<span class="grow">' + self.escapeHtml(self.kindLabel(k, kinds)) + '（' + items.length + '）</span>'
                 +  '<button class="btn btn-sm" onclick="App.togglePluginKind(\'' + k + '\', true)">全开</button>'
                 +  '<button class="btn btn-sm" onclick="App.togglePluginKind(\'' + k + '\', false)">全关</button>'
                 +  '</div>';
            items.forEach(function(p) { html += self.pluginRow(p); });
        });
        if (!plugins.length) {
            html += '<div class="set-note" style="margin-top:6px">后端没返回任何插件。</div>';
        }

        // 开发模式：生成插件骨架
        if (this.pluginDevMode) {
            var opts = kinds.length ? kinds : [{code: 'TOOL', label: '工具'}, {code: 'SKILL', label: '技能'}];
            html += '<div class="set-group-title">生成插件骨架</div>'
                 +  '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
                 +    '<input class="set-input" id="pfId" style="flex:1;min-width:150px" placeholder="插件 id（英文，如 my_tool）">'
                 +    '<input class="set-input" id="pfName" style="flex:1;min-width:150px" placeholder="显示名称">'
                 +    '<select class="set-input" id="pfKind" style="width:120px">';
            opts.forEach(function(k) {
                html += '<option value="' + self.escapeAttr(k.code) + '">' + self.escapeHtml(k.label || k.code) + '</option>';
            });
            html += '</select>'
                 +    '<button class="btn btn-sm btn-primary" onclick="App.scaffoldPlugin()">生成骨架</button>'
                 +  '</div>'
                 +  '<div class="set-msg" id="pfMsg" style="margin-top:6px"></div>';
        }
        html += '</div>';
        return html;
    },

    pluginRow: function(p) {
        var on = p.enabled !== false;
        var src = this.sourceLabel(p);
        return '<div class="set-row">'
            +   '<span class="grow">'
            +     '<span class="set-name">' + this.escapeHtml(p.displayName || p.name || p.id) + '</span>'
            +     (p.description ? '<span class="set-desc">' + this.escapeHtml(p.description) + '</span>' : '')
            +     (p.error ? '<span class="set-err">✗ ' + this.escapeHtml(String(p.error)) + '</span>' : '')
            +   '</span>'
            +   '<span class="set-badge" title="' + this.escapeAttr(this.sourceTitle(p)) + '">' + this.escapeHtml(src)
            +     (p.version ? (' · ' + this.escapeHtml(String(p.version))) : '') + '</span>'
            +   '<span class="switch"><input type="checkbox" id="plug_' + this.escapeAttr(p.id) + '"'
            +     (on ? ' checked' : '') + ' onchange="App.togglePlugin(\'' + this.escapeAttr(p.id)
            +     '\', this.checked, this)"><span class="knob"></span></span>'
            + '</div>';
    },

    /** 单个插件开关：成功后就地更新；失败把开关拨回去并说明原因 */
    togglePlugin: function(id, enable, el) {
        var self = this;
        var msg = document.getElementById('pluginTabMsg');
        if (el) { el.disabled = true; }
        if (msg) { msg.className = 'set-msg'; msg.textContent = (enable ? '正在启用 ' : '正在禁用 ') + id + ' …'; }
        fetch('/api/plugins/' + encodeURIComponent(id) + '/' + (enable ? 'enable' : 'disable'), {method: 'POST'})
          .then(function(r) { return r.json(); })
          .then(function(res) {
            if (el) { el.disabled = false; }
            if (!self.respOk(res)) { throw new Error((res && (res.error || res.message)) || '请求失败'); }
            (self.pluginsData || []).forEach(function(p) { if (p.id === id) { p.enabled = enable; } });
            if (msg) { msg.className = 'set-msg ok'; msg.textContent = '✓ ' + id + (enable ? ' 已启用' : ' 已禁用'); }
            self.loadPlugins();
          })
          .catch(function(e) {
            if (el) { el.disabled = false; el.checked = !enable; }         // 回滚
            if (msg) {
                msg.className = 'set-msg err';
                msg.textContent = '✗ ' + id + (enable ? ' 启用失败：' : ' 禁用失败：') + (e && e.message ? e.message : e);
            }
          });
    },

    reloadPlugins: function() {
        var self = this;
        var msg = document.getElementById('pluginTabMsg');
        if (msg) { msg.className = 'set-msg'; msg.textContent = '正在重新加载插件…'; }
        fetch('/api/plugins/reload', {method: 'POST'})
          .then(function(r) { return r.json(); })
          .then(function(res) {
            if (!self.respOk(res)) { throw new Error((res && res.error) || '请求失败'); }
            var list = self.respList(res, 'plugins');
            if (list) { self.pluginsData = list; }
            else { self.renderPluginsTab(); return; }
            var box = document.getElementById('settingsContent');
            if (box) { box.innerHTML = self.pluginsTabHtml(); }
            var m = document.getElementById('pluginTabMsg');
            if (m) {
                m.className = 'set-msg ok';
                m.textContent = '✓ 插件已重新加载'
                    + ((res.count === undefined || res.count === null) ? '' : ('，共 ' + res.count + ' 个'));
            }
            self.loadPlugins();
          })
          .catch(function(e) {
            var m = document.getElementById('pluginTabMsg');
            if (m) { m.className = 'set-msg err'; m.textContent = '✗ 重新加载失败：' + (e && e.message ? e.message : e); }
          });
    },

    setPluginDevMode: function(enabled) {
        var self = this;
        var msg = document.getElementById('pluginTabMsg');
        fetch('/api/plugins/dev-mode', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({enabled: !!enabled})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!self.respOk(res)) { throw new Error((res && res.error) || '请求失败'); }
            self.pluginDevMode = !!enabled;
            var box = document.getElementById('settingsContent');
            if (box) { box.innerHTML = self.pluginsTabHtml(); }
            var m = document.getElementById('pluginTabMsg');
            if (m) { m.className = 'set-msg ok'; m.textContent = '✓ 插件开发模式已' + (enabled ? '打开' : '关闭'); }
        }).catch(function(e) {
            var el = document.getElementById('pluginDevMode');
            if (el) { el.checked = !enabled; }
            if (msg) { msg.className = 'set-msg err'; msg.textContent = '✗ 切换失败：' + (e && e.message ? e.message : e); }
        });
    },

    scaffoldPlugin: function() {
        var self = this;
        var idEl = document.getElementById('pfId');
        var nameEl = document.getElementById('pfName');
        var kindEl = document.getElementById('pfKind');
        var id = ((idEl && idEl.value) || '').trim();
        var name = ((nameEl && nameEl.value) || '').trim();
        var kind = (kindEl && kindEl.value) || 'TOOL';
        var msg = document.getElementById('pfMsg');
        if (!id) { if (msg) { msg.className = 'set-msg err'; msg.textContent = '先填插件 id'; } return; }
        if (msg) { msg.className = 'set-msg'; msg.textContent = '正在生成…'; }
        fetch('/api/plugins/scaffold', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id, name: name || id, kind: kind})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!self.respOk(res)) { throw new Error((res && res.error) || '请求失败'); }
            var path = res.path || ((res.data && res.data.path) || '');
            if (msg) { msg.className = 'set-msg ok'; msg.textContent = '✓ 已生成：' + path; }
            self.reloadPlugins();
        }).catch(function(e) {
            if (msg) { msg.className = 'set-msg err'; msg.textContent = '✗ 生成失败：' + (e && e.message ? e.message : e); }
        });

    // ====== 设置：技能 ======
    // ====== 插件参数页签 ======
    /**
     * 「插件参数」页签：九类插件里那些"参数得用户自己定"的，全在这里改。
     *
     * 【为什么必须补这一页】这些参数原本只有后端接口，界面上一个入口都没有 ——
     * 用户根本没法把"每条命令最多跑多久""最多输出多少""子智能体递归几层""一轮派几个工具"
     * 设成自己要的值，那这些插件就等于只有出厂默认值。要求写的是"用户自定义"，
     * 没有界面就不算做到。
     */
    renderPluginParamsTab: function() {
        var self = this;
        var box = document.getElementById('settingsContent');
        if (!box) return;
        box.innerHTML = '<p class="set-note">正在读取插件参数…</p>';
        Promise.all([
            fetch('/api/plugins/settings').then(function(r) { return r.json(); }),
            fetch('/api/plugins/team').then(function(r) { return r.json(); }).catch(function() { return {}; }),
            fetch('/api/plugins/automation').then(function(r) { return r.json(); }).catch(function() { return {}; })
        ]).then(function(res) {
            var s = res[0];
            if (!self.respOk(s)) { box.innerHTML = self.notReady('插件参数', 'GET /api/plugins/settings', s); return; }
            var d = s.data || s;
            self.pluginParams = {
                terminal: d.terminal || {},
                loop: d.loop || {},
                subagent: d.subagent || {},
                review: d.review || {},
                team: self.respList(res[1], 'team') || [],
                automation: (function() {
                    var a = res[2] && (res[2].data || res[2]);
                    return (a && a.tasks) || [];
                })()
            };
            box.innerHTML = self.pluginParamsHtml();
        }).catch(function() {
            box.innerHTML = self.notReady('插件参数', 'GET /api/plugins/settings');
        });
    },

    /** 整组开关：一类插件一次全开/全关（基础工具 22 个一个个点太烦） */
    togglePluginKind: function(kind, enabled) {
        var self = this;
        var verb = enabled ? 'enable' : 'disable';
        fetch('/api/plugins/kind/' + encodeURIComponent(kind) + '/' + verb, {method: 'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                if (!self.respOk(res)) {
                    var el = document.getElementById('pluginTabMsg');
                    if (el) { el.textContent = '整组开关失败：' + (res.message || ''); }
                    return;
                }
                self.renderPluginsTab();
            })
            .catch(function() { self.renderPluginsTab(); });
    },

    /** 保存某一类插件参数（terminal / loop / subagent / review） */
    savePluginSection: function(kind) {
        var self = this;
        var map = {terminal: 'ppMsgTerminal', loop: 'ppMsgLoop', subagent: 'ppMsgSubagent', review: 'ppMsgReview'};
        var url = {terminal: '/api/plugins/settings/terminal', loop: '/api/plugins/settings/loop',
                   subagent: '/api/plugins/settings/subagent', review: '/api/plugins/settings/review'}[kind];
        var num = function(id, dflt) { var v = parseInt((document.getElementById(id) || {}).value, 10); return isNaN(v) ? dflt : v; };
        var str = function(id) { return ((document.getElementById(id) || {}).value || '').trim(); };
        var body = {};
        if (kind === 'terminal') {
            body = {maxCommandSeconds: num('ppTermSecs', 300), maxOutputBytes: num('ppTermBytes', 200000)};
        } else if (kind === 'loop') {
            body = {maxIterations: num('ppLoopIters', 0), toolTimeoutSeconds: num('ppLoopTimeout', 600),
                    maxToolsPerRound: num('ppLoopTools', 0)};
        } else if (kind === 'subagent') {
            body = {maxDepth: num('ppSubDepth', 1), maxConcurrency: num('ppSubConc', 3), model: str('ppSubModel')};
        } else {
            var tools = str('ppRevTools').split(/[,，\s]+/).filter(function(x) { return !!x; });
            body = {model: str('ppRevModel'), provider: str('ppRevProvider'), tools: tools};
        }
        fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                var el = document.getElementById(map[kind]);
                if (el) { el.textContent = self.respOk(res) ? '已保存。' : ('保存失败：' + (res.message || '后端没接受')); }
            })
            .catch(function(e) {
                var el = document.getElementById(map[kind]);
                if (el) { el.textContent = '保存失败：' + e; }
            });
    },

    /** 往团队里加一个成员 */
    addTeamMember: function() {
        var self = this;
        var name = ((document.getElementById('ppTmName') || {}).value || '').trim();
        var mode = ((document.getElementById('ppTmMode') || {}).value || 'standard').trim();
        var role = ((document.getElementById('ppTmRole') || {}).value || '').trim();
        var el = document.getElementById('ppMsgTeam');
        if (!name) { if (el) { el.textContent = '先给成员起个名字。'; } return; }
        fetch('/api/plugins/team', {method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name, mode: mode, role: role, enabled: true})})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                if (!self.respOk(res)) { if (el) { el.textContent = '加入失败：' + (res.message || ''); } return; }
                self.renderPluginParamsTab();
            })
            .catch(function(e) { if (el) { el.textContent = '加入失败：' + e; } });
