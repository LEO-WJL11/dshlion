<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LionBox - 本地 AI 编程助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; color: #e8e8f0; background: #1a1a2e; }
        #app { display: flex; height: 100vh; overflow: hidden; }
        
        /* 侧边栏 */
        .sidebar { width: 280px; background: #16213e; border-right: 1px solid #2d2d4a; display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #2d2d4a; }
        .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .logo-icon { font-size: 28px; }
        .logo-text { font-size: 18px; font-weight: 700; }
        .sidebar-section { padding: 16px; border-bottom: 1px solid #252540; }
        .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #6a6a80; margin-bottom: 8px; letter-spacing: 0.5px; }
        .workspace-info { display: flex; align-items: center; justify-content: space-between; padding: 8px; background: #1e1e3a; border-radius: 8px; border: 1px solid #2d2d4a; }
        .workspace-path { font-size: 12px; color: #a0a0b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
        .session-list { max-height: 300px; overflow-y: auto; }

        /* ---- 按工作区分组的"选项卡" ---- */
        .session-list { max-height: 46vh; overflow-y: auto; }
        .ws-tab { margin-bottom: 6px; border-radius: 8px; background: #1b1b2b; overflow: hidden; }
        .ws-tab-head { display: flex; align-items: center; gap: 6px; padding: 7px 8px;
                       cursor: pointer; user-select: none; }
        .ws-tab-head:hover { background: #23233a; }
        .ws-tab-head.current { box-shadow: inset 3px 0 0 #6c5ce7; }
        .ws-caret { width: 12px; font-size: 10px; color: #a0a0b8; }
        .ws-name { flex: 1; font-size: 12.5px; color: #e8e8f0; overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap; }
        .ws-count { font-size: 10.5px; color: #a0a0b8; background: #2d2d4a;
                    border-radius: 8px; padding: 1px 6px; }
        .ws-add { border: 0; background: transparent; color: #a0a0b8; cursor: pointer;
                  font-size: 14px; line-height: 1; padding: 2px 4px; }
        .ws-add:hover { color: #74b9ff; }
        .ws-body { padding: 2px 4px 6px 4px; }
        .ws-body .session-item { padding: 6px 6px 6px 8px; }
        .ws-empty { font-size: 11px; color: #6a6a80; padding: 4px 10px 8px; }
        .ws-pick { margin-left: 4px; background: #23233a; color: #a0a0b8; border: 1px solid #2d2d4a;
                   border-radius: 5px; font-size: 10.5px; padding: 1px 3px; max-width: 112px; }
        .ws-pick:hover { color: #e8e8f0; }
        #clearAllSessions:hover { color: #e17055; }
        #clearAllSessions:disabled { opacity: .4; cursor: default; }
        .session-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; margin-bottom: 4px; border-radius: 8px; cursor: pointer; }
        .session-item:hover { background: #2a2a4a; }
        .session-item.active { background: #6c5ce7; color: white; }
        .session-item .del-btn { opacity: 0; background: none; border: none; color: #e17055; cursor: pointer; font-size: 16px; }
        .session-item:hover .del-btn { opacity: 1; }
        .mode-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .mode-btn { padding: 8px; background: #1e1e3a; border: 1px solid #2d2d4a; border-radius: 8px; color: #a0a0b8; font-size: 12px; cursor: pointer; }
        .mode-btn:hover { background: #2a2a4a; }
        .mode-btn.active { background: #6c5ce7; border-color: #6c5ce7; color: white; }
        .sidebar-footer { margin-top: auto; padding: 16px; border-top: 1px solid #2d2d4a; }
        
        /* 主内容 */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #16213e; border-bottom: 1px solid #2d2d4a; }
        .top-bar-left { display: flex; align-items: center; gap: 12px; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #a0a0b8; }
        .breadcrumb .sep { color: #6a6a80; }
        .top-bar-right { display: flex; align-items: center; gap: 12px; }
        .adapter-dot { width: 8px; height: 8px; border-radius: 50%; background: #00b894; display: inline-block; }
        select { padding: 6px 12px; background: #1e1e3a; border: 1px solid #2d2d4a; border-radius: 8px; color: #e8e8f0; font-size: 13px; min-width: 100px; }
        select:focus { outline: none; border-color: #6c5ce7; }
        
        /* 消息区 */
        .message-area { flex: 1; overflow-y: auto; padding: 24px; scroll-behavior: smooth; }
        .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; text-align: center; }
        .welcome-icon { font-size: 64px; margin-bottom: 16px; }
        .welcome h1 { font-size: 28px; margin-bottom: 8px; background: linear-gradient(135deg, #6c5ce7, #a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .welcome p { color: #a0a0b8; margin-bottom: 24px; }
        .features { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 500px; }
        .feature { padding: 16px; background: #1e1e3a; border: 1px solid #2d2d4a; border-radius: 12px; }
        .feature:hover { border-color: #6c5ce7; }
        .feature .fi { font-size: 24px; }
        .feature .ft { font-size: 13px; font-weight: 600; }
        .feature .fd { font-size: 11px; color: #a0a0b8; }
        
        /* 消息气泡 */
        .msg { display: flex; gap: 12px; margin-bottom: 16px; max-width: 800px; margin-left: auto; margin-right: auto; }
        .msg.user { flex-direction: row-reverse; }
        .msg-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .msg.user .msg-avatar { background: #6c5ce7; }
        .msg.bot .msg-avatar { background: #a29bfe; }
        .msg-body { padding: 12px 16px; border-radius: 12px; line-height: 1.6; max-width: 700px; }
        .msg.user .msg-body { background: #6c5ce7; color: white; border-bottom-right-radius: 4px; }
        .msg.bot .msg-body { background: #1e1e3a; border: 1px solid #2d2d4a; border-bottom-left-radius: 4px; }
        .msg-body pre { background: #1a1a2e; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; font-family: monospace; font-size: 13px; }
        .msg-body code { font-family: monospace; font-size: 13px; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 4px; }
        
        /* 输入区 */
        .input-area { padding: 12px 24px; background: #16213e; border-top: 1px solid #2d2d4a; }
        .input-row { display: flex; align-items: flex-end; gap: 8px; max-width: 800px; margin: 0 auto; }
        .input-row textarea { flex: 1; padding: 12px; background: #1e1e3a; border: 1px solid #2d2d4a; border-radius: 12px; color: #e8e8f0; font-family: inherit; font-size: 14px; resize: none; min-height: 44px; max-height: 200px; }
        .input-row textarea:focus { outline: none; border-color: #6c5ce7; }
        .input-hints { display: flex; justify-content: space-between; max-width: 800px; margin: 6px auto 0; font-size: 12px; color: #6a6a80; }
        
        /* 按钮通用 */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 6px 14px; border: 1px solid transparent; border-radius: 8px; font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #6c5ce7; color: white; border-color: #6c5ce7; }
        .btn-primary:hover:not(:disabled) { background: #5a4bd6; }
        .btn-ghost { background: transparent; color: #a0a0b8; border-color: #2d2d4a; }
        .btn-ghost:hover:not(:disabled) { background: #2a2a4a; color: #e8e8f0; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-icon { width: 36px; height: 36px; padding: 0; }
        .btn-send { width: 44px; height: 44px; border-radius: 50%; font-size: 18px; flex-shrink: 0; }
        
        /* 模态框 */
        .modal-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 9000; display: none; }
        .modal-mask.show { display: flex; align-items: center; justify-content: center; }
        .modal-box { background: #1e1e3a; border: 1px solid #2d2d4a; border-radius: 12px; width: 90%; max-width: 700px; max-height: 80vh; display: flex; flex-direction: column; z-index: 9001; }
        .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #2d2d4a; }
        .modal-head h2 { font-size: 16px; }
        .modal-head .close { background: none; border: none; color: #a0a0b8; font-size: 22px; cursor: pointer; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        
        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3d3d5a; border-radius: 3px; }
    </style>
</head>
<body>
<div id="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo"><span class="logo-icon">🦁</span><span class="logo-text">LionBox</span></div>
            <button class="btn btn-primary btn-sm" style="width:100%" onclick="App.newSession()">＋ 新建对话</button>
        </div>
        <div class="sidebar-section">
            <div class="section-title">工作区</div>
            <div class="workspace-info">
                <span class="workspace-path" id="wsPath">未选择工作区</span>
                <button class="btn btn-ghost btn-sm" onclick="App.pickWorkspace()">选择</button>
            </div>
        </div>
        <div class="sidebar-section">
            <div class="section-title" style="display:flex;align-items:center;justify-content:space-between">
                <span>对话（按工作区分组）<span id="sessionTotal" style="color:#6a6a80;font-weight:400"></span></span>
                <button class="ws-add" id="clearAllSessions" title="删除所有对话（工作区保留）"
                        style="font-size:11.5px" onclick="App.deleteAllSessions()">🗑 清空</button>
            </div>
            <div class="session-list" id="sessionList"><div style="text-align:center;color:#6a6a80;padding:20px">暂无会话</div></div>
        </div>
        <div class="sidebar-section">
            <div class="section-title">工作模式</div>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="STANDARD" onclick="App.setMode(this,'STANDARD')">标准</button>
                                <button class="mode-btn" data-mode="MINIMAL" onclick="App.setMode(this,'MINIMAL')">极简</button>
            </div>
        </div>
        <div class="sidebar-footer">
            <button class="btn btn-ghost" style="width:100%;margin-bottom:6px" onclick="App.showSettings()">⚙️ 设置</button>
            <button class="btn btn-ghost" style="width:100%" onclick="App.showPlugins()">🧩 插件管理</button>
        </div>
    </aside>

    <!-- 主内容 -->
    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="btn btn-ghost btn-icon" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
                <div class="breadcrumb"><span id="bcWs">工作区</span><span class="sep">›</span><span id="bcSession">新会话</span></div>
            </div>
            <div class="top-bar-right">
                <span id="runtimeBanner" onclick="App.showSettings()" title="点这里切换模型来源"
                      style="font-size:12px;color:#a0a0b8;margin-right:4px;cursor:pointer;
                             padding:3px 8px;border:1px solid #2d2d4a;border-radius:6px"></span>
                <span style="font-size:12px;color:#a0a0b8" title="接口调用格式"><span class="adapter-dot"></span> <span id="adapterName">就绪</span></span>
                <select id="modelSelect" onchange="App.onModelChange()"><option value="">选择模型...</option></select>
                <select id="thinkingLevel" disabled><option>选择模型后加载</option></select>
            </div>
        </header>

        <!-- 模型下载进度：前台可见（这是"下 5 GB 时到底在干嘛"的唯一答案） -->
        <div id="dlBar" style="display:none;padding:8px 16px;background:#1a1a2e;
             border-bottom:1px solid #2d2d4a">
            <div style="display:flex;align-items:center;gap:10px;font-size:12.5px;
                 color:#e8e8f0;max-width:1100px;margin:0 auto">
                <span id="dlIcon">⏳</span>
                <span id="dlText" style="white-space:nowrap;color:#e8e8f0">正在下载模型…</span>
                <div style="flex:1;height:9px;background:#12121f;border:1px solid #2d2d4a;
                     border-radius:5px;overflow:hidden;min-width:120px">
                    <div id="dlFill" style="height:100%;width:0%;
                         background:linear-gradient(90deg,#6c5ce7,#00b894);transition:width .4s"></div>
                </div>
                <span id="dlPct" style="width:46px;text-align:right;color:#fdcb6e;
                     font-variant-numeric:tabular-nums">0%</span>
                <span id="dlSpeed" style="color:#6a6a80;min-width:150px"></span>
            </div>
        </div>

        <div class="message-area" id="msgArea">
            <div class="welcome">
                <div class="welcome-icon">🦁</div>
                <h1>LionBox</h1>
                <p>本地 AI 编程助手 · 51个插件 · 流式执行 · 模型完全本地运行</p>
                <div class="features">
                    <div class="feature"><div class="fi">🔧</div><div class="ft">51个插件</div><div class="fd">4 Skill + 47 Tool</div></div>
                    <div class="feature"><div class="fi">⚡</div><div class="ft">流式执行</div><div class="fd">识别即调度</div></div>
                    <div class="feature"><div class="fi">📦</div><div class="ft">盒子本地推理</div><div class="fd">无需联网 · 无需API Key</div></div>
                    <div class="feature"><div class="fi">📝</div><div class="ft">事件溯源</div><div class="fd">完整记录回放</div></div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <!-- 本地模型：前台常驻（挑版本、下载、看进度都在这儿，不用翻设置） -->
            <div id="modelPanel" style="max-width:1100px;margin:0 auto 8px;padding:8px 12px;
                 background:#1a1a2e;border:1px solid #2d2d4a;border-radius:8px;
                 font-size:12.5px;color:#a0a0b8"></div>

            <!-- 模型提问面板：ask_user 工具调用时弹出，用户答完自动收起 -->
            <div id="askUserPanel" style="display:none;max-width:800px;margin:0 auto 10px;
                 background:#1a1a2e;border:1px solid #6c5ce7;border-radius:8px;padding:12px 14px">
                <div style="font-size:12px;color:#a29bfe;margin-bottom:6px">🤖 模型需要你确认</div>
                <div id="askUserText" style="font-size:14px;color:#e8e8f0;line-height:1.7;
                     margin-bottom:10px;white-space:pre-wrap"></div>
                <div id="askUserOptions" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px"></div>
                <div style="display:flex;gap:8px;align-items:center">
                    <input id="askUserInput" placeholder="输入你的回答…"
                           style="flex:1;padding:7px 12px;background:#12121f;border:1px solid #2d2d4a;
                                  border-radius:6px;color:#e8e8f0;font-size:13px;box-sizing:border-box"
                           onkeydown="if(event.key==='Enter'){event.preventDefault();App.submitAskUser();}">
                    <button class="btn btn-primary btn-sm" onclick="App.submitAskUser()">提交回答</button>
                </div>
                <div id="askUserHint" style="font-size:11px;color:#6a6a80;margin-top:8px"></div>
            </div>
            <div id="agentControls" style="display:none;max-width:800px;margin:0 auto 8px;align-items:center;gap:8px">
                <button class="btn btn-ghost btn-sm" id="btnPause" onclick="App.togglePause()">⏸ 暂停</button>
                <button class="btn btn-ghost btn-sm" onclick="App.stopAgent()" style="color:#e17055;border-color:#e17055">⏹ 停止</button>
                <span id="agentStateHint" style="font-size:12px;color:#6a6a80">运行中…</span>
            </div>
            <div class="input-row">
                <textarea id="msgInput" placeholder="输入消息... (Shift+Enter换行，Enter发送)" rows="1"></textarea>
                <button class="btn btn-primary btn-send" id="sendBtn" onclick="App.send()">➤</button>
            </div>
            <div class="input-hints">
                <span>💡 先选择工作区，再创建会话</span>
                <span id="pluginCount">已加载 0 个插件</span>
            </div>
        </div>
    </main>
</div>

<!-- 模态框 -->
<div class="modal-mask" id="modalMask">
    <div class="modal-box">
        <div class="modal-head">
            <h2 id="modalTitle">标题</h2>
            <button class="close" onclick="App.closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script>
var App = {
    ws: null,
    mode: 'STANDARD',
    sessionId: null,
    processing: false,
    paused: false,
    currentBotDiv: null,
    toolLines: [],
    lastEventTs: 0,
    pollTimer: null,
    appConfig: null,
    savedModel: '',
    savedThinkingLevel: '',
    pickingWs: false,

    init: function() {
        var self = this;
        // 回车发送
        document.getElementById('msgInput').onkeydown = function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); self.send(); }
        };
        // 自动高度
        document.getElementById('msgInput').oninput = function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        };
        // 自动初始化：创建工作区+会话
        this.autoInit();
    },

    autoInit: function() {
        var self = this;
        this.loadPlugins();
        // 顶部显示当前模型来源（本地模型 / 自定义 API），以及本地模型是否已加载
        this.refreshRuntimeBanner();
        // 模型下载进度：前台进度条靠它每 1.5 秒刷一次
        this.startLocalWatcher();
        // 前台「模型」面板：先拿到清单，才知道你选的那份下没下
        this.refreshModelCache();
        // 先恢复应用配置（模型、apiKey、baseUrl等），再恢复会话与历史
        this.restoreConfig(function() {
            self.refreshRuntimeBanner();
            self.loadSessions(function(sessions) {
                if (sessions && sessions.length > 0) {
                    // 有历史会话：恢复最近一个会话及其对话历史
                    var latest = sessions[sessions.length - 1];
                    self.sessionId = latest.sessionId;
                    self.ws = latest.workspaceId;
                    if (latest.mode) self.setModeUi(latest.mode);
                    document.getElementById('wsPath').textContent = latest.workspaceId;
                    document.getElementById('bcWs').textContent = latest.workspaceId;
                    self.setBreadcrumbSession(latest.sessionId);
                    self.loadHistory(latest.sessionId);
                } else {
                    // 无历史会话：注册默认工作区并创建会话
                    self.createDefaultSession();
                }
            });
        });
    },

    // 从后端恢复持久化的应用配置（模型、适配器、提供商）
    restoreConfig: function(callback) {
        var self = this;
        fetch('/api/chat/config').then(function(r) { return r.json(); }).then(function(result) {
            if (!result.success) { if (callback) callback(); return; }
            self.appConfig = result.data || {};
            var key = self.appConfig.activeAdapter === 'ANTHROPIC' ? 'anthropic' : 'openai';
            var ac = self.appConfig[key] || {};
            self.savedModel = ac.model || '';
            self.savedThinkingLevel = ac.thinkingLevel || '';
            self.fillModelsFromConfig(function() {
                if (callback) callback();
            });
        }).catch(function() { if (callback) callback(); });
    },

    // 从保存的配置填充模型下拉框
    fillModelsFromConfig: function(callback) {
        var self = this;
        var sel = document.getElementById('modelSelect');
        var cfg = this.appConfig || {};
        var key = cfg.activeAdapter === 'ANTHROPIC' ? 'anthropic' : 'openai';
        var ac = cfg[key] || {};
        var models = [];
        var providers = cfg.providers || {};
        for (var pid in providers) {
            var p = providers[pid];
            if (p && p.availableModels && p.availableModels.length > 0 && p.baseUrl === ac.baseUrl) {
                models = p.availableModels;
                break;
            }
        }
        if (models.length === 0 && ac.model) {
            models = [{modelId: ac.model, modelName: ac.model}];
        }
        sel.innerHTML = '<option value="">选择模型...</option>';
        if (models.length === 0) { if (callback) callback(); return; }
        models.forEach(function(m) {
            var opt = document.createElement('option');
            opt.value = m.modelId || m.id;
            opt.textContent = m.modelName || m.name || m.modelId || m.id;
            sel.appendChild(opt);
        });
        if (ac.model) {
            sel.value = ac.model;
            if (!sel.value) sel.selectedIndex = 1;
        } else {
            sel.selectedIndex = 1;
        }
        this.onModelChange();
        if (callback) callback();
    },

    createDefaultSession: function() {
        var self = this;
        // 无历史会话时：从后端获取系统常用目录（动态，不含本机信息），
        // 注册默认工作区并创建会话
        fetch('/api/native-dialog/common-dirs').then(function(r) { return r.json(); })
          .then(function(dirs) {
            var defaultPath = (dirs.success && dirs.data && dirs.data['用户目录']) ? dirs.data['用户目录'] : '';
            if (!defaultPath) { throw new Error('无法获取用户目录'); }
            return fetch('/api/workspaces', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({path: defaultPath})
            }).then(function(r) { return r.json(); })
              .then(function(result) {
                if (result.success) {
                    self.ws = result.data.id || result.data.path;
                    document.getElementById('wsPath').textContent = result.data.path;
                    document.getElementById('bcWs').textContent = result.data.path;
                }
                // 自动创建会话
                return fetch('/api/sessions', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({workspaceId: self.ws || defaultPath, mode: self.mode})
                }).then(function(r) { return r.json(); });
              })
              .then(function(result) {
                if (result.success && result.data) {
                    self.sessionId = result.data.sessionId;
                    self.setBreadcrumbSession(result.data.sessionId);
                }
              });
          })
          .catch(function(e) { console.log('自动初始化:', e); });
    },

    // ====== 工作区 ======
    pickWorkspace: function() {
        var self = this;
        if (this.pickingWs) return; // 防止重复点击弹出多个窗口
        this.pickingWs = true;
        // 按钮置为"请稍候"，防止连点
        var btn = document.querySelector('.workspace-info .btn');
        var btnOriginal = btn ? btn.textContent : '选择';
        if (btn) { btn.textContent = '请稍候…'; btn.disabled = true; }
        var done = function() {
            self.pickingWs = false;
            if (btn) { btn.textContent = btnOriginal; btn.disabled = false; }
        };
        // 弹Windows原生标准文件夹选择窗口（现代Explorer样式）
        var initial = this.ws || '';
        fetch('/api/native-dialog/select-directory?initialPath=' + encodeURIComponent(initial))
          .then(function(r) { return r.json(); })
          .then(function(result) {
            done();
            if (result.success && result.data) {
                self.selectWs(result.data);
            } else {
                // 取消或失败 → 页内常用路径模态框兜底（不再弹系统窗口）
                self.openWorkspaceFallbackModal();
            }
          })
          .catch(function() {
            done();
            self.openWorkspaceFallbackModal();
          });
    },

    // 常用路径兜底模态框（原生对话框不可用时）
    openWorkspaceFallbackModal: function() {
        var self = this;
        var render = function(commonPaths) {
            var icons = {'桌面':'🖥️', '文档':'📄', '下载':'📥', '图片':'🖼️', '用户目录':'🏠'};
            var html = '<p style="color:#a0a0b8;margin-bottom:16px">选择常用目录或手动输入路径：</p>';
            html += '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">';
            Object.keys(commonPaths).forEach(function(name) {
                var p = commonPaths[name];
                if (!p) return;
                var esc = p.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                html += '<button onclick="App.selectWs(\'' + esc + '\')" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1a1a2e;border:1px solid #2d2d4a;border-radius:8px;color:#e8e8f0;cursor:pointer;font-size:13px;text-align:left">';
                html += '<span style="font-size:18px">' + (icons[name] || '📁') + '</span><span style="flex:1">' + name + '</span>';
                html += '<span style="font-size:11px;color:#6a6a80;font-family:monospace">' + p + '</span></button>';
            });
            html += '</div>';
            html += '<div style="display:flex;gap:8px"><input id="customWsPath" style="flex:1;padding:8px 12px;background:#1a1a2e;border:1px solid #2d2d4a;border-radius:6px;color:#e8e8f0;font-family:monospace;font-size:13px" placeholder="输入自定义路径，如 D:\\my-project">';
            html += '<button class="btn btn-primary" onclick="App.selectWs(document.getElementById(\'customWsPath\').value)">确定</button></div>';
            self.openModal('选择工作区', html);
        };
        // 常用目录从后端动态获取（基于当前系统用户，不含本机硬编码信息）
        fetch('/api/native-dialog/common-dirs').then(function(r) { return r.json(); })
          .then(function(result) { render((result.success && result.data) ? result.data : {}); })
          .catch(function() { render({}); });
    },

    selectWs: function(path) {
        if (!path || !path.trim()) return;
        var self = this;
        fetch('/api/workspaces', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({path: path.trim()})
        }).then(function(r) { return r.json(); })
          .then(function(result) {
            if (!result.success) { alert(result.error || '注册失败'); return; }
            // 会话绑定工作区ID（绝对路径），界面显示原始路径
            self.ws = result.data.id || path.trim();
            document.getElementById('wsPath').textContent = result.data.path || path.trim();
            document.getElementById('bcWs').textContent = result.data.path || path.trim();
            self.closeModal();
            // 立即创建绑定新工作区的会话，让工作区设置生效
            return fetch('/api/sessions', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({workspaceId: self.ws, mode: self.mode})
            }).then(function(r) { return r.json(); });
        })
          .then(function(sres) {
            if (sres && sres.success && sres.data) {
                self.sessionId = sres.data.sessionId;
                self.setBreadcrumbSession(sres.data.sessionId);
                self.loadSessions();
                self.clearMessages();
            }
        }).catch(function(e) { alert('注册失败: ' + e.message); });
    },

    // ====== 会话 ======
    newSession: function() {
        var self = this;
        if (!this.ws) { alert('请先选择工作区'); return; }
        fetch('/api/sessions', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({workspaceId: this.ws, mode: this.mode})
        }).then(function(r) { return r.json(); })
          .then(function(result) {
            if (result.success) {
                self.sessionId = result.data.sessionId;
                self.setBreadcrumbSession(result.data.sessionId);
                self.loadSessions();
                self.clearMessages();
            } else {
                alert(result.error || '创建失败');
            }
        });
    },

    /** 会话在界面上的显示名：有名字用名字；还没命名的显示"新会话 + 时间"，绝不再显示UUID */
    sessionLabel: function(s) {
        if (s && s.name && s.name.trim()) return s.name;
        var t = '';
        if (s && s.createdAt) {
            try {
                var d = new Date(s.createdAt);
                if (!isNaN(d.getTime())) {
                    t = ' · ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
                }
            } catch (e) { /* 时间解析失败就不显示 */ }
        }
        return '新会话' + t;
    },

    /** 把会话名写进顶部面包屑；没有名字时显示"新会话" */
    setBreadcrumbSession: function(sid) {
        var s = (this.sessionsData || []).filter(function(x) { return x.sessionId === sid; })[0];
        var el = document.getElementById('bcSession');
        if (!el) return;
        if (s && s.name && s.name.trim()) {
            el.textContent = s.name;
        } else if (!sid) {
            el.textContent = '新会话';
        } else {
            el.textContent = '新会话（发出第一条消息后自动命名）';
        }
    },

    /**
     * 加载对话列表 —— 现在按**工作区分组**显示成可收起的选项卡。
     *
     * 为什么要同时拉工作区：会话里只存了 workspaceId（就是工作区路径），
     * 光看路径不好认，得拿工作区列表把显示名取出来。
     */
    loadSessions: function(callback) {
        var self = this;
        Promise.all([
            fetch('/api/sessions').then(function(r) { return r.json(); }),
            fetch('/api/workspaces').then(function(r) { return r.json(); })
        ]).then(function(res) {
            var sessions = (res[0] && res[0].success && res[0].data) ? res[0].data : [];
            var workspaces = (res[1] && res[1].success && res[1].data) ? res[1].data : [];
            self.sessionsData = sessions;
            self.workspacesData = workspaces;
            self.renderSessionTabs(sessions, workspaces);
            // 当前会话的名字可能刚由模型生成，同步到面包屑
            var cur = sessions.filter(function(x) { return x.sessionId === self.sessionId; })[0];
            if (cur && cur.name && cur.name.trim()) {
                document.getElementById('bcSession').textContent = cur.name;
            }
            if (callback) callback(sessions);
        }).catch(function() {
            var list = document.getElementById('sessionList');
            if (list) list.innerHTML = '<div style="text-align:center;color:#e17055;padding:16px">对话列表加载失败</div>';
            if (callback) callback([]);
        });
    },

    /**
     * 清空所有对话（工作区保留）。
     *
     * 这是不可撤销的操作，所以问两次：第二次把"要删掉多少个"写清楚，
     * 避免手滑点一下就没了。
     */
    deleteAllSessions: function() {
        var self = this;
        var n = (this.sessionsData || []).length;
        if (n === 0) { alert('当前没有对话。'); return; }
        if (!confirm('要删除全部 ' + n + ' 个对话吗？\n\n工作区会保留，对话内容与历史都会删掉。')) return;
        if (!confirm('再确认一次：这 ' + n + ' 个对话删掉之后**无法恢复**。继续？')) return;

        var btn = document.getElementById('clearAllSessions');
        if (btn) { btn.disabled = true; btn.textContent = '清空中…'; }
        fetch('/api/sessions', {method: 'DELETE'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                if (btn) { btn.disabled = false; btn.textContent = '🗑 清空'; }
                if (!res || !res.success) { alert('清空失败：' + ((res && res.error) || '未知错误')); return; }
                var deleted = (res.data && res.data.deleted) || n;
                // 当前对话已经不存在了：清干净界面上的消息区
                self.sessionId = null;
                var box = document.getElementById('messages');
                if (box) box.innerHTML = '<div style="text-align:center;color:#6a6a80;padding:40px">'
                    + '对话已清空，点「＋ 新建对话」开始</div>';
                var bc = document.getElementById('bcSession');
                if (bc) bc.textContent = '未选择对话';
                self.loadSessions();
                setTimeout(function() { alert('已清空 ' + deleted + ' 个对话。'); }, 50);
            })
            .catch(function(e) {
                if (btn) { btn.disabled = false; btn.textContent = '🗑 清空'; }
                alert('清空失败：' + e);
            });
    },

    /** 工作区显示名：取路径最后一段（反斜杠/正斜杠都认） */
    wsLabel: function(ws) {
        var p = (ws && (ws.path || ws.workspaceId)) ? String(ws.path || ws.workspaceId) : '';
        p = p.replace(/[\/]+$/, '');
        var parts = p.split(/[\/]+/).filter(function(x) { return x; });
        return parts.length ? parts[parts.length - 1] : (p || '(未知工作区)');
    },

    /** 被收起的工作区（记在 localStorage，刷新后保持） */
    collapsedWs: function() {
        try { return JSON.parse(localStorage.getItem('lionbox.wsCollapsed') || '[]'); }
        catch (e) { return []; }
    },

    /** 收起 / 展开一个工作区选项卡 */
    toggleWsTab: function(wsId) {
        var c = this.collapsedWs();
        var i = c.indexOf(wsId);
        if (i >= 0) { c.splice(i, 1); } else { c.push(wsId); }
        localStorage.setItem('lionbox.wsCollapsed', JSON.stringify(c));
        this.renderSessionTabs(this.sessionsData || [], this.workspacesData || []);
    },

    /** 给某个对话换工作区（选项卡会跟着变） */
    moveSession: function(sid, wsId) {
        var self = this;
        fetch('/api/sessions/' + sid + '/workspace', {
            method: 'PUT', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({workspaceId: wsId})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!res || !res.success) {
                alert('换工作区失败：' + ((res && res.error) || '未知错误'));
                return;
            }
            self.loadSessions();
        }).catch(function(e) { alert('换工作区失败：' + e); });
    },

    /** 在某个工作区里新建对话 */
    newSessionIn: function(wsId) {
        var self = this;
        this.ws = wsId;
        document.getElementById('wsPath').textContent = wsId;
        fetch('/api/sessions', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({workspaceId: wsId, mode: this.mode})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!res || !res.success) { alert('新建对话失败：' + ((res && res.error) || '')); return; }
            var sid = res.data.sessionId;
            var c = self.collapsedWs().filter(function(x) { return x !== wsId; });
            localStorage.setItem('lionbox.wsCollapsed', JSON.stringify(c));
            self.loadSessions(function() { self.switchSession(sid); });
        });
    },

    /**
     * 渲染工作区选项卡：每个工作区一行表头（可点开/收起），
     * 展开后列出属于它的对话；每行对话右边有个小下拉可以改工作区。
     *
     * <p>**没有对话的工作区不显示**（只是不占列表位置，文件夹和注册都不动）。
     * 以前为了能在空工作区里建对话而把它们全列出来，结果历史遗留的
     * 空壳工作区把列表撑满了；而且顶栏「选择」挑完文件夹会立刻在里面
     * 建一个会话，真用过的工作区本来就至少有 1 个。
     */
    renderSessionTabs: function(sessions, workspaces) {
        var self = this;
        var list = document.getElementById('sessionList');
        if (!list) return;
        sessions = sessions || [];
        workspaces = workspaces || [];

        var groups = {};
        var order = [];
        sessions.forEach(function(s) {
            var k = s.workspaceId || '(未绑定工作区)';
            if (!groups[k]) { groups[k] = []; order.push(k); }
            groups[k].push(s);
        });
        // 注意：这里**不再**把没有对话的工作区加进来。
        // workspaces（/api/workspaces）仍然全部保留，只是不在对话列表里占位：
        //   · 对话右边的「选工作区」下拉仍然列全部工作区，想把对话挪进去照样可以；
        //   · 挪进去之后那个工作区自然就出现了。
        // （用户要的就是这个：没对话就删掉显示 —— 不是删文件夹。）
        // 当前对话所在工作区排最前
        var cur = sessions.filter(function(x) { return x.sessionId === self.sessionId; })[0];
        if (cur && cur.workspaceId && order.indexOf(cur.workspaceId) > 0) {
            order.splice(order.indexOf(cur.workspaceId), 1);
            order.unshift(cur.workspaceId);
        }

        // 标题右边显示对话总数（清空前用户能看到要删掉多少）
        var totalEl = document.getElementById('sessionTotal');
        if (totalEl) totalEl.textContent = sessions.length ? '（' + sessions.length + '）' : '';
        var clearBtn = document.getElementById('clearAllSessions');
        if (clearBtn) clearBtn.disabled = sessions.length === 0;

        if (!order.length) {
            // 一个对话都没有时，不列任何工作区（含以前用过、现在空的）
            list.innerHTML = '<div style="text-align:center;color:#6a6a80;padding:20px">还没有对话<br>' +
                '<span style="font-size:11px">点上面「选择」挑个工作区，或直接「＋ 新建对话」</span></div>';
            return;
        }

        var collapsed = self.collapsedWs();
        var html = '';
        order.forEach(function(wsId) {
            var items = groups[wsId] || [];
            var isCur = cur && cur.workspaceId === wsId;
            var isCollapsed = collapsed.indexOf(wsId) >= 0;
            var label = self.wsLabel({path: wsId});
            html += '<div class="ws-tab">'
                 +  '<div class="ws-tab-head' + (isCur ? ' current' : '') + '" title="' + self.escapeAttr(wsId) + '"'
                 +       ' onclick="App.toggleWsTab(\'' + self.escapeAttr(wsId) + '\')">'
                 +    '<span class="ws-caret">' + (isCollapsed ? '▶' : '▼') + '</span>'
                 +    '<span class="ws-name">' + self.escapeHtml(label) + '</span>'
                 +    '<span class="ws-count">' + items.length + '</span>'
                 +    '<button class="ws-add" title="在这个工作区新建对话"'
                 +            ' onclick="event.stopPropagation();App.newSessionIn(\'' + self.escapeAttr(wsId) + '\')">＋</button>'
                 +  '</div>';
            if (!isCollapsed) {
                html += '<div class="ws-body">';
                items.forEach(function(s) {
                    var active = s.sessionId === self.sessionId ? ' active' : '';
                    var unnamed = !(s.name && s.name.trim());
                    html += '<div class="session-item' + active + '"'
                         +      ' onclick="App.switchSession(\'' + s.sessionId + '\')">'
                         +   '<span class="s-name" style="' + (unnamed ? 'color:#6a6a80' : '') + '"'
                         +         ' title="双击重命名"'
                         +         ' ondblclick="event.stopPropagation();App.renameSession(\'' + s.sessionId + '\')">'
                         +     self.escapeHtml(self.sessionLabel(s)) + '</span>'
                         +   '<button class="del-btn" title="重命名"'
                         +           ' onclick="event.stopPropagation();App.renameSession(\'' + s.sessionId + '\')">✎</button>'
                         +   '<button class="del-btn" title="删除"'
                         +           ' onclick="event.stopPropagation();App.deleteSession(\'' + s.sessionId + '\')">×</button>';
                    // 每个对话都能选工作区
                    html += '<select class="ws-pick" title="把这个对话放到别的工作区"'
                         +        ' onclick="event.stopPropagation()"'
                         +        ' onchange="event.stopPropagation();App.moveSession(\'' + s.sessionId + '\', this.value)">';
                    var seen = {};
                    var opts = order.slice();
                    workspaces.forEach(function(w) {
                        var k = w.path || w.workspaceId;
                        if (k && opts.indexOf(k) < 0) opts.push(k);
                    });
                    if (opts.indexOf(wsId) < 0) opts.push(wsId);
                    opts.forEach(function(k) {
                        if (seen[k]) return;
                        seen[k] = 1;
                        html += '<option value="' + self.escapeAttr(k) + '"'
                             +  (k === wsId ? ' selected' : '') + '>'
                             +  self.escapeHtml(self.wsLabel({path: k})) + '</option>';
                    });
                    html += '</select></div>';
                });
                html += '</div>';
            }
            html += '</div>';
        });
        list.innerHTML = html;
    },

    /** 放进 HTML 属性里的转义 */
    escapeAttr: function(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    },

    escapeHtml: function(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    },

    /**
     * 修改会话名。
     * 标题是模型在首条消息之后异步生成的，所以刚发完消息那几秒名字可能还没出来——
     * 这里如果用户没看到名字就点了重命名，也允许他直接起一个（模型看到已有名字就不会再覆盖）。
     */
    renameSession: function(sid) {
        var self = this;
        var cur = (this.sessionsData || []).filter(function(x) { return x.sessionId === sid; })[0];
        var old = (cur && cur.name) ? cur.name : '';
        var name = prompt('给这个会话起个名字：', old);
        if (name === null) return;                 // 取消
        name = name.trim();
        if (!name) return;
        fetch('/api/sessions/' + encodeURIComponent(sid) + '/name', {
            method: 'PUT', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({name: name})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!res.success) { alert(res.error || '重命名失败'); return; }
            if (self.sessionId === sid) document.getElementById('bcSession').textContent = name;
            self.loadSessions();
        });
    },

    /**
     * 首条消息发出后，模型异步生成标题，这里轮询等它出现。
     * 最多等 30 秒；等不到也没关系，用户可以自己双击改名。
     */
    pollSessionTitle: function(sid) {
        var self = this;
        var tries = 0;
        var timer = setInterval(function() {
            tries++;
            var cur = (self.sessionsData || []).filter(function(x) { return x.sessionId === sid; })[0];
            if (cur && cur.name && cur.name.trim()) { clearInterval(timer); self.loadSessions(); return; }
            if (tries > 15) { clearInterval(timer); return; }
            self.loadSessions();
        }, 2000);
    },

    switchSession: function(sid) {
        this.sessionId = sid;
        var s = (this.sessionsData || []).filter(function(x) { return x.sessionId === sid; })[0];
        this.setBreadcrumbSession(sid);
        // 同步该会话的工作模式到界面
        if (s && s.mode) {
            this.mode = s.mode;
            this.setModeUi(s.mode);
        }
        this.loadSessions();
        // 加载该会话的历史消息
        this.loadHistory(sid);
    },

    // 从后端加载会话历史消息并渲染
    loadHistory: function(sid) {
        var self = this;
        var area = document.getElementById('msgArea');
        area.innerHTML = '';
        fetch('/api/sessions/' + encodeURIComponent(sid) + '/history')
          .then(function(r) { return r.json(); })
          .then(function(result) {
            if (!result.success || !result.data || result.data.length === 0) {
                area.innerHTML = '<div class="welcome"><div class="welcome-icon">🦁</div><h1>LionBox</h1><p>此会话暂无消息，开始对话吧</p></div>';
                return;
            }
            result.data.forEach(function(m) {
                if (m.role === 'user') {
                    self.appendMsg('user', self.formatContent(m.content || ''));
                } else if (m.role === 'assistant') {
                    var c = m.content || '';
                    if (m.toolCalls && m.toolCalls.length > 0) {
                        c += '\n\n' + m.toolCalls.map(function(t) { return '🔧 ' + t.name; }).join('\n');
                    }
                    if (c) self.appendMsg('bot', self.formatContent(c));
                } else if (m.role === 'tool') {
                    self.appendMsg('bot', '<span style="font-size:12px;color:#6a6a80">🔧 工具结果: ' + (m.toolName || '') + '</span>');
                }
                // system消息不显示
            });
          })
          .catch(function() {
            area.innerHTML = '<div class="welcome"><div class="welcome-icon">🦁</div><h1>LionBox</h1><p>历史加载失败</p></div>';
          });
    },

    deleteSession: function(sid) {
        var self = this;
        if (!confirm('确定删除此会话？')) return;
        fetch('/api/sessions/' + sid, {method:'DELETE'}).then(function() {
            if (self.sessionId === sid) self.sessionId = null;
            self.loadSessions();
        });
    },

    // ====== 模式 ======
    setMode: function(btn, mode) {
        this.setModeUi(mode);
        this.mode = mode;
        // 同步到后端：当前会话立即按新模式工作
        if (this.sessionId) {
            fetch('/api/sessions/' + encodeURIComponent(this.sessionId) + '/mode', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({mode: mode})
            }).catch(function() {});
        }
    },

    // 仅更新界面高亮（恢复历史会话时使用）
    setModeUi: function(mode) {
        document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
        // 现在只有标准/极简；老会话里存着 PTC/CREATIVE 的，高亮落回「标准」
        if (mode !== 'STANDARD' && mode !== 'MINIMAL') { mode = 'STANDARD'; }
        var btn = document.querySelector('.mode-btn[data-mode="' + mode + '"]');
        if (btn) btn.classList.add('active');
    },

    // ====== 聊天 ======
    send: function() {
        var self = this;
        var input = document.getElementById('msgInput');
        var msg = input.value.trim();
        if (!msg) return;
        if (!this.sessionId) { alert('请先创建会话'); return; }
        if (this.processing) { return; }

        this.appendMsg('user', msg);
        input.value = '';
        input.style.height = 'auto';

        var botDiv = this.appendMsg('bot', '<span style="color:#6a6a80">思考中...</span>');
        this.currentBotDiv = botDiv;
        this.processing = true;
        this.paused = false;
        this.toolLines = [];
        this.lastEventTs = Date.now();

        // 显示控制条，禁用发送按钮
        var controls = document.getElementById('agentControls');
        controls.style.display = 'flex';
        document.getElementById('btnPause').textContent = '⏸ 暂停';
        document.getElementById('agentStateHint').textContent = '运行中…';
        document.getElementById('sendBtn').disabled = true;

        // 启动工具事件轮询：实时显示调用的工具名
        if (this.pollTimer) clearInterval(this.pollTimer);
        this.pollTimer = setInterval(function() { self.pollEvents(); }, 800);

        // 会话还没有名字的话，这条消息会触发模型生成标题（后端异步做），
        // 这里起一个短轮询把生成好的名字拉回来显示。
        var curSess = (this.sessionsData || []).filter(function(x) { return x.sessionId === self.sessionId; })[0];
        if (!curSess || !curSess.name || !curSess.name.trim()) {
            this.pollSessionTitle(this.sessionId);
        }

        fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                sessionId: this.sessionId,
                message: msg,
                model: document.getElementById('modelSelect').value || '',
                thinkingLevel: document.getElementById('thinkingLevel').value || 'MEDIUM'
            })
        }).then(function(r) { return r.json(); })
          .then(function(result) {
            var toolsHtml = self.toolLines.join('');
            botDiv.querySelector('.msg-body').innerHTML = toolsHtml + (result.success ? self.formatContent(result.data) : '<span style="color:#e17055">❌ ' + (result.error || '未知错误') + '</span>');
            self.finishProcessing();
          })
          .catch(function(e) {
            botDiv.querySelector('.msg-body').innerHTML = self.toolLines.join('') + '<span style="color:#e17055">❌ ' + e.message + '</span>';
            self.finishProcessing();
          });
    },

    // 轮询工具事件，实时显示工具调用名
    pollEvents: function() {
        var self = this;
        if (!this.sessionId || !this.processing) return;
        // 顺带看一眼模型有没有在向我提问（ask_user 工具）
        this.pollQuestion();
        fetch('/api/events/' + encodeURIComponent(this.sessionId) + '?after=' + this.lastEventTs)
          .then(function(r) { return r.json(); })
          .then(function(res) {
            if (!res.success || !res.data) return;
            var changed = false;
            res.data.forEach(function(ev) {
                var t = ev.timestamp ? new Date(ev.timestamp).getTime() : 0;
                if (t > self.lastEventTs) self.lastEventTs = t;
                var name = (ev.data && ev.data.toolName) || '';
                if (ev.type === 'TOOL_CALL_START' && name) {
                    self.toolLines.push('<div style="font-size:12px;color:#74b9ff;margin-top:4px">🔧 调用工具：<b>' + name + '</b> …</div>');
                    changed = true;
                } else if (ev.type === 'TOOL_CALL_COMPLETE' && name) {
                    self.toolLines.push('<div style="font-size:12px;color:#00b894;margin-top:2px">✅ ' + name + ' 完成</div>');
                    changed = true;
                } else if (ev.type === 'TOOL_CALL_ERROR' && name) {
                    self.toolLines.push('<div style="font-size:12px;color:#e17055;margin-top:2px">❌ ' + name + ' 失败</div>');
                    changed = true;
                }
            });
            if (changed) {
                self.updateBotStatus(self.paused
                    ? '<span style="color:#fdcb6e">⏸ 已暂停，点击「继续」恢复</span>'
                    : '<span style="color:#6a6a80">思考中...</span>');
            }
          })
          .catch(function() { /* 轮询失败忽略 */ });
    },

    // ====== 模型提问（ask_user 工具）======
    // 后端在等用户回答时会把问题挂成"待回答"，这里轮询到就弹面板。
    // 用户在面板里答完 → POST 答案 → 后端放行 → 模型接着做。
    pollQuestion: function() {
        var self = this;
        if (!this.sessionId || !this.processing) return;
        fetch('/api/questions/pending?sessionId=' + encodeURIComponent(this.sessionId))
          .then(function(r) { return r.json(); })
          .then(function(res) {
            if (!res || !res.success) return;
            var q = res.data;
            if (q && q.id) {
                if (self.currentQuestionId !== q.id) self.showAskUser(q);
            } else if (self.currentQuestionId) {
                self.hideAskUser();          // 已经答过或超时了，收起面板
            }
          })
          .catch(function() { /* 轮询失败忽略 */ });
    },

    showAskUser: function(q) {
        this.currentQuestionId = q.id;
        var panel = document.getElementById('askUserPanel');
        document.getElementById('askUserText').textContent = q.question || '';
        var opts = document.getElementById('askUserOptions');
        opts.innerHTML = '';
        (q.options || []).forEach(function(o) {
            var b = document.createElement('button');
            b.className = 'btn btn-sm';
            b.textContent = o;
            b.onclick = function() { App.submitAskUser(o); };
            opts.appendChild(b);
        });
        var input = document.getElementById('askUserInput');
        input.value = '';
        document.getElementById('askUserHint').textContent =
            (q.options && q.options.length ? '可以点上面的选项，也可以自己输入；' : '')
            + '不回答的话，模型等一会儿会自己往下走。';
        panel.style.display = 'block';
        input.focus();
    },

    hideAskUser: function() {
        this.currentQuestionId = null;
        var panel = document.getElementById('askUserPanel');
        if (panel) panel.style.display = 'none';
    },

    submitAskUser: function(preset) {
        var self = this;
        if (!this.currentQuestionId) return;
        var input = document.getElementById('askUserInput');
        var answer = (preset != null ? preset : input.value || '').trim();
        if (!answer) { input.focus(); return; }
        var hint = document.getElementById('askUserHint');
        fetch('/api/questions/answer', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({questionId: this.currentQuestionId, answer: answer})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (res && res.success) {
                self.hideAskUser();
                if (self.toolLines) {
                    self.toolLines.push('<div style="font-size:12px;color:#a29bfe;margin-top:2px">💬 已回答：' +
                        self.escapeHtml(answer) + '</div>');
                    self.updateBotStatus('<span style="color:#6a6a80">思考中...</span>');
                }
            } else if (hint) {
                hint.style.color = '#e17055';
                hint.textContent = '✗ ' + ((res && res.error) || '提交失败');
            }
        }).catch(function(e) {
            if (hint) { hint.style.color = '#e17055'; hint.textContent = '✗ ' + e; }
        });
    },

    // 刷新机器人气泡状态文字（保留已显示的工具调用行）
    updateBotStatus: function(statusHtml) {        if (!this.currentBotDiv) return;
        this.currentBotDiv.querySelector('.msg-body').innerHTML = statusHtml + this.toolLines.join('');
    },

    // 完成处理：隐藏控制条、恢复发送按钮
    finishProcessing: function() {
        this.processing = false;
        this.paused = false;
        this.currentBotDiv = null;
        this.toolLines = [];
        if (this.pollTimer) { clearInterval(this.pollTimer); this.pollTimer = null; }
        this.hideAskUser();          // 任务结束了，提问面板也要收掉
        document.getElementById('agentControls').style.display = 'none';
        document.getElementById('sendBtn').disabled = false;
    },

    // 暂停/继续切换
    togglePause: function() {
        if (!this.sessionId || !this.processing) return;
        var self = this;
        var action = this.paused ? 'resume' : 'pause';
        fetch('/api/chat/control/' + action, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({sessionId: this.sessionId})
        }).then(function(r) { return r.json(); })
          .then(function(res) {
            if (!res.success) { alert(res.error || '操作失败'); return; }
            self.paused = !self.paused;
            var btn = document.getElementById('btnPause');
            var hint = document.getElementById('agentStateHint');
            if (self.paused) {
                btn.textContent = '▶ 继续';
                hint.textContent = '⏸ 已暂停（下一轮工具调用前生效）';
                self.updateBotStatus('<span style="color:#fdcb6e">⏸ 已暂停，点击「继续」恢复</span>');
            } else {
                btn.textContent = '⏸ 暂停';
                hint.textContent = '运行中…';
                self.updateBotStatus('<span style="color:#6a6a80">思考中...</span>');
            }
          })
          .catch(function(e) { alert('操作失败: ' + e.message); });
    },

    // 停止任务
    stopAgent: function() {
        if (!this.sessionId || !this.processing) return;
        var self = this;
        fetch('/api/chat/control/stop', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({sessionId: this.sessionId})
        }).then(function(r) { return r.json(); })
          .then(function(res) {
            if (!res.success) { alert(res.error || '操作失败'); return; }
            document.getElementById('agentStateHint').textContent = '⏹ 正在停止…（下一轮工具调用前生效）';
            self.updateBotStatus('<span style="color:#e17055">⏹ 正在停止…</span>');
          })
          .catch(function(e) { alert('操作失败: ' + e.message); });
    },

    appendMsg: function(role, html) {
        var area = document.getElementById('msgArea');
        var welcome = area.querySelector('.welcome');
        if (welcome) welcome.remove();

        var div = document.createElement('div');
        div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
        div.innerHTML = '<div class="msg-avatar">' + (role === 'user' ? '👤' : '🦁') + '</div><div class="msg-body">' + html + '</div>';
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
        return div;
    },

    clearMessages: function() {
        document.getElementById('msgArea').innerHTML = '<div class="welcome"><div class="welcome-icon">🦁</div><h1>LionBox</h1><p>选择会话或新建对话开始</p></div>';
    },

    formatContent: function(text) {
        if (!text) return '';
        return text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                   .replace(/`([^`]+)`/g, '<code>$1</code>')
                   .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                   .replace(/\n/g, '<br>');
    },

    // ====== 插件 ======
    loadPlugins: function() {
        fetch('/api/plugins').then(function(r) { return r.json(); }).then(function(result) {
            if (result.success) {
                document.getElementById('pluginCount').textContent = '已加载 ' + (result.data ? result.data.length : 0) + ' 个插件';
            }
        });
    },

    showPlugins: function() {
        var self = this;
        fetch('/api/plugins').then(function(r) { return r.json(); }).then(function(result) {
            if (!result.success) { alert('加载失败'); return; }
            var skills = result.data.filter(function(p) { return p.type === 'SKILL'; });
            var tools = result.data.filter(function(p) { return p.type === 'TOOL'; });
            var html = '<h3 style="margin-bottom:12px;color:#6c5ce7">📚 技能插件 (' + skills.length + ')</h3>';
            skills.forEach(function(p) { html += self.pluginCard(p); });
            html += '<h3 style="margin:20px 0 12px;color:#74b9ff">🔧 工具插件 (' + tools.length + ')</h3>';
            tools.forEach(function(p) { html += self.pluginCard(p); });
            self.openModal('插件管理 (' + result.data.length + '个)', html);
        });
    },

    pluginCard: function(p) {
        var icon = p.type === 'SKILL' ? '📚' : '🔧';
        return '<div style="display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:8px;background:#1a1a2e;border:1px solid #2d2d4a;border-radius:8px">' +
            '<span style="font-size:20px">' + icon + '</span>' +
            '<div style="flex:1"><div style="font-weight:600;font-size:13px">' + p.name + '</div><div style="font-size:12px;color:#a0a0b8">' + p.description + '</div></div>' +
            '<span style="font-size:11px;padding:2px 8px;background:#2d2d4a;border-radius:4px;color:#74b9ff">' + (p.type === 'SKILL' ? '技能' : '工具') + '</span></div>';
    },

    // ====== 设置 ======
    showSettings: function() {
        // 页签名要直白：本地模型不是"API提供商"，叫那个名字没人会点进来找本地模型
        var html = '<div style="display:flex;gap:8px;margin-bottom:16px">'
            + '<button class="btn btn-sm" id="setTabProviders" onclick="App.settingsTab(\'providers\')">模型来源（本地 / API）</button>'
            + '<button class="btn btn-sm" id="setTabApprovals" onclick="App.settingsTab(\'approvals\')">审批策略</button>'
            + '<button class="btn btn-sm" id="setTabNotification" onclick="App.settingsTab(\'notification\')">音效提醒</button>'
            + '<button class="btn btn-sm" id="setTabLlama" onclick="App.settingsTab(\'llama\')">本地模型 / llama.cpp</button>'
            + '</div><div id="settingsContent"></div>';
        this.openModal('设置', html);
        this.settingsTab('providers');
    },

    // 设置页签切换
    settingsTab: function(tab) {
        var self = this;
        var titles = {'providers':'setTabProviders', 'approvals':'setTabApprovals',
                      'notification':'setTabNotification', 'llama':'setTabLlama'};
        Object.keys(titles).forEach(function(t) {
            var b = document.getElementById(titles[t]);
            if (!b) return;
            if (t === tab) { b.style.background = '#6c5ce7'; b.style.color = 'white'; }
            else { b.style.background = ''; b.style.color = ''; }
        });
        if (tab === 'providers') self.renderProvidersTab();
        else if (tab === 'approvals') self.renderApprovalsTab();
        else if (tab === 'notification') self.renderNotificationTab();
        else if (tab === 'llama') self.renderLlamaTab();
    },

    // ====== 本地模型 / llama.cpp 页签 ======
    // 两件事：换模型版本（安装包里选的是同一份清单）、改 llama.cpp 的全部启动参数。
    // 参数改完要重启本地模型才生效 —— 界面会明确提示，并提供一键重启。
    renderLlamaTab: function() {
        var self = this;
        var inp = 'width:100%;padding:6px 10px;background:#1a1a2e;border:1px solid #2d2d4a;'
                + 'border-radius:6px;color:#e8e8f0;font-size:13px;box-sizing:border-box';
        var lbl = 'font-size:11.5px;color:#a0a0b8;display:block;margin-bottom:3px';
        var box = 'border:1px solid #2d2d4a;border-radius:8px;padding:12px;margin-bottom:12px';
        var grid = 'display:grid;grid-template-columns:1fr 1fr;gap:10px';

        function field(key, label, hint, value, type) {
            return '<div><label style="' + lbl + '" title="' + self.escapeAttr(hint) + '">' + label + '</label>'
                 + '<input id="llama_' + key + '" type="' + (type || 'text') + '" style="' + inp + '"'
                 + ' value="' + self.escapeAttr(value == null ? '' : value) + '"></div>';
        }

        Promise.all([
            fetch('/api/runtime/local/config').then(function(r) { return r.json(); }),
            fetch('/api/runtime/local/models').then(function(r) { return r.json(); })
        ]).then(function(res) {
            var d = (res[0] && res[0].success && res[0].data) ? res[0].data : {};
            var models = (res[1] && res[1].success && res[1].data) ? res[1].data : [];
            // 还没启动过运行时的话，“正在用”谁都不该标；这时候配置的那个只是“当前选择”，
            // 不能写成“已选中但没在用”（那会让人以为跑着呢、只是跑错了）。
            var hasCurrent = models.some(function(m) { return m.current; });

            var html = '';
            // 配置的模型和实际在用的不一致时（例如选的量化还没下载），明确提示
            if (d.modelMismatch) {
                html += '<div style="border:1px solid #e17055;background:#2a1f1c;border-radius:8px;'
                     +  'padding:10px 12px;margin-bottom:12px;font-size:12.5px;color:#ffb8a3">'
                     +  '⚠️ ' + self.escapeHtml(d.modelMismatch)
                     +  '<div style="margin-top:8px">'
                     +  '<button class="btn btn-sm" onclick="App.switchLlamaModel(\''
                     +  self.escapeAttr(d.modelFile) + '\')">立即下载并切换</button></div></div>';
            }
            html += '<p style="color:#a0a0b8;margin-bottom:14px;font-size:12px;line-height:1.7">'
                + '这里改的是<b style="color:#e8e8f0">本机 llama.cpp 的启动参数</b>（随盒子一起跑的那个推理进程）。'
                + '改完点保存，然后<b style="color:#e8e8f0">重启本地模型</b>才会生效。<br>'
                + '拿不准的项就别动，默认值都是按这台机器调过的。</p>';

            // ---- 模型版本（可以同时存好几份，想用哪份点哪份）----
            html += '<div style="' + box + '">';
            html += '<div style="font-weight:600;margin-bottom:8px">模型版本</div>';

            // 模型目录：用户问过“文件到底放哪”，这里把路径直接给出来，
            // 并且说清楚可以自己往里面塞 GGUF。
            var mdir = d.modelDir || '';
            html += '<div style="border:1px solid #2d2d4a;background:#1a1a2e;border-radius:8px;'
                 +  'padding:9px 11px;margin-bottom:10px;font-size:11.5px;color:#a0a0b8;line-height:1.75">'
                 +  '<div>模型目录：<span style="font-family:monospace;color:#e8e8f0" title="'
                 +  self.escapeAttr(mdir) + '">' + self.escapeHtml(mdir) + '</span></div>'
                 +  '<div>下载的权重都放在这里；<b style="color:#e8e8f0">你自己的 .gguf 直接丢进去，'
                 +  '下面就会出现，点「使用」就行</b>。一份权重一个文件，'
                 +  '可以同时存好几份。</div>'
                 +  '<div style="margin-top:7px">'
                 +  '<button class="btn btn-sm" onclick="App.openModelsDir()">📂 打开文件夹</button>'
                 +  '<button class="btn btn-sm" style="margin-left:6px" onclick="App.renderLlamaTab()">🔄 刷新</button>'
                 +  '</div></div>';

            // 一行 = 一份权重：名字、状态、体积、按钮（下载 / 使用 / 重启生效）
            var modelRow = function(m) {
                var tags = '';
                if (m.current) {
                    tags += ' <span style="color:#6c5ce7">· 正在用</span>';
                } else if (m.configured) {
                    tags += hasCurrent
                        ? ' <span style="color:#e17055">· 已选中但没在用</span>'
                        : ' <span style="color:#6c5ce7">· 当前选择（还没启动）</span>';
                }
                // 自己塞的小模型可能不到 1 GB，后端会给 sizeText（按 MB 显示）
                var sizeTxt = m.sizeText ? m.sizeText : (m.sizeGb + ' GB');
                var state = sizeTxt + (m.downloading
                    ? ' · <span style="color:#fdcb6e">正在下载…</span>'
                    : ' · ' + (m.downloaded ? '已下载' : '未下载'));
                var row = '<tr style="border-bottom:1px solid #23233a">'
                        +    '<td style="padding:7px 4px">'
                        +      '<div style="color:#e8e8f0">' + self.escapeHtml(m.label) + tags + '</div>'
                        +      '<div style="color:#6a6a80;font-size:11px">' + self.escapeHtml(m.note || '') + '</div>'
                        +      '<div style="color:#6a6a80;font-size:11px">' + state + '</div>'
                        +      (m.downloading
                                  ? '<div style="margin-top:5px;height:6px;background:#12121f;'
                                    + 'border:1px solid #2d2d4a;border-radius:4px;overflow:hidden">'
                                    + '<div id="dlrowfill_' + self.escapeAttr(m.file) + '" '
                                    + 'style="height:100%;width:0%;background:#6c5ce7;transition:width .4s">'
                                    + '</div></div>'
                                  : '')
                        +    '</td>'
                        +    '<td style="padding:7px 4px;text-align:right;white-space:nowrap">';
                if (m.downloading) {
                    row += '<button class="btn btn-sm" disabled>下载中…</button>';
                } else {
                    if (!m.downloaded) {
                        row += '<button class="btn btn-sm" title="先下载不切换，可以把几份都下好"'
                             +        ' onclick="App.downloadLlamaModel(\'' + m.file + '\')">下载</button>';
                    }
                    if (!m.current) {
                        row += '<button class="btn btn-sm" style="margin-left:6px"'
                             +        ' onclick="App.switchLlamaModel(\'' + m.file + '\')">'
                             +        (m.configured ? '重启生效' : '使用') + '</button>';
                    }
                }
                row += '</td></tr>';
                return row;
            };

            var official = models.filter(function(m) { return !m.custom; });
            var custom = models.filter(function(m) { return m.custom; });
            html += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
            official.forEach(function(m) { html += modelRow(m); });
            if (custom.length) {
                html += '<tr><td colspan="2" style="padding:10px 4px 4px;color:#a0a0b8;font-size:11.5px;'
                     +  'border-top:1px solid #2d2d4a">你自己放进来的（' + custom.length
                     +  '）——直接能用</td></tr>';
                custom.forEach(function(m) { html += modelRow(m); });
            }
            html += '</table></div>';

            // ---- 上下文 / 显存 ----
            html += '<div style="' + box + '">';
            html += '<div style="font-weight:600;margin-bottom:8px">上下文与显存</div>';
            html += '<div style="' + grid + '">'
                 + field('ctxSize', '上下文长度 -c', '越大越吃显存；本地模型默认 262144（256K）', d.ctxSize)
                 + field('ngl', 'GPU 层数 -ngl', '999 = 全部放到显卡；0 = 纯 CPU', d.ngl)
                 + field('kvCacheTypeK', 'KV 缓存类型 K -ctk', 'q4_0 / q8_0 / f16；量化必须开 flash attention', d.kvCacheTypeK)
                 + field('kvCacheTypeV', 'KV 缓存类型 V -ctv', '同上', d.kvCacheTypeV)
                 + field('parallelSlots', '并行槽位 -np', '多槽位会把上下文平分，一般保持 1', d.parallelSlots)
                 + '<div><label style="' + lbl + '">flash attention -fa</label>'
                 +   '<select id="llama_flashAttn" style="' + inp + '">'
                 +   '<option value="true"' + (String(d.flashAttn) === 'true' ? ' selected' : '') + '>开（on）</option>'
                 +   '<option value="false"' + (String(d.flashAttn) === 'true' ? '' : ' selected') + '>关（off）</option>'
                 +   '</select></div>'
                 + '</div></div>';

            // ---- 性能 ----
            html += '<div style="' + box + '">';
            html += '<div style="font-weight:600;margin-bottom:8px">性能</div>';
            html += '<div style="' + grid + '">'
                 + field('threads', 'CPU 线程 -t', '0 = 让 llama.cpp 自己决定', d.threads)
                 + field('batchSize', '批大小 -b', '预填充批次；显存紧张就调小', d.batchSize)
                 + field('ubatchSize', '微批 -ub', '同上，一般不动', d.ubatchSize)
                 + field('maxPredict', '单次生成上限 -n', '防止一轮写满上下文', d.maxPredict)
                 + '</div></div>';

            // ---- 采样 ----
            html += '<div style="' + box + '">';
            html += '<div style="font-weight:600;margin-bottom:8px">采样</div>';
            html += '<div style="font-size:11.5px;color:#6a6a80;margin-bottom:8px">'
                 + '出厂默认（temp 0.8、无重复惩罚）实测会让这个模型跑飞，别随手改回去。</div>';
            html += '<div style="' + grid + '">'
                 + field('temperature', '温度 --temp', '', d.temperature)
                 + field('topP', 'top-p', '', d.topP)
                 + field('topK', 'top-k', '0 = 关闭', d.topK)
                 + field('minP', 'min-p', '0 = 关闭', d.minP)
                 + field('repeatPenalty', '重复惩罚 --repeat-penalty', '1.0 = 关闭', d.repeatPenalty)
                 + field('repeatLastN', '惩罚回看窗口 --repeat-last-n', '', d.repeatLastN)
                 + field('seed', '随机种子 --seed', '-1 = 每次随机', d.seed)
                 + '</div></div>';

            // ---- 服务与自由参数 ----
            html += '<div style="' + box + '">';
            html += '<div style="font-weight:600;margin-bottom:8px">服务地址与自由参数</div>';
            html += '<div style="' + grid + '">'
                 + field('host', '监听地址 --host', '一般不动', d.host)
                 + field('port', '端口 --port', '改了要同步改自定义 API 的地址', d.port)
                 + '</div>';
            html += '<div style="margin-top:10px"><label style="' + lbl + '">'
                 + '额外参数（原样拼到命令行最后，能填任何这里没有的开关）</label>'
                 + '<textarea id="llama_extraArgs" rows="2" style="' + inp + ';font-family:monospace"'
                 + ' placeholder="例如：--no-mmap --log-disable">'
                 + self.escapeHtml(d.extraArgs || '') + '</textarea></div>';
            html += '</div>';

            // ---- 操作按钮 ----
            html += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
                 +  '<button class="btn btn-primary" onclick="App.saveLlamaConfig()">保存参数</button>'
                 +  '<button class="btn" onclick="App.restartLocalModel()">重启本地模型</button>'
                 +  '<span id="llamaMsg" style="font-size:12px;color:#6a6a80"></span></div>';
            html += '<div style="margin-top:10px;font-size:11.5px;color:#6a6a80">'
                 + '当前状态：' + (d.running ? '本地模型正在运行' : '本地模型未运行')
                 + '；改完参数请点「重启本地模型」。</div>';

            document.getElementById('settingsContent').innerHTML = html;
        });
    },

    /** 保存 llama.cpp 参数 */
    saveLlamaConfig: function() {
        var self = this;
        var keys = ['ctxSize', 'ngl', 'kvCacheTypeK', 'kvCacheTypeV', 'parallelSlots',
                    'threads', 'batchSize', 'ubatchSize', 'maxPredict',
                    'temperature', 'topP', 'topK', 'minP', 'repeatPenalty', 'repeatLastN', 'seed',
                    'host', 'port', 'extraArgs'];
        var body = {};
        keys.forEach(function(k) {
            var el = document.getElementById('llama_' + k);
            if (el) body[k] = el.value;
        });
        var fa = document.getElementById('llama_flashAttn');
        if (fa) body.flashAttn = (fa.value === 'true');
        var msg = document.getElementById('llamaMsg');
        if (msg) msg.textContent = '保存中…';
        fetch('/api/runtime/local/config', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (msg) msg.textContent = res && res.success
                ? '已保存。重启本地模型后生效。'
                : ('保存失败：' + ((res && res.error) || ''));
        }).catch(function(e) { if (msg) msg.textContent = '保存失败：' + e; });
    },

    /** 切换/使用某个模型（没下载的会在**后台**开始下，不再把这个请求堵上十几分钟） */
    switchLlamaModel: function(file) {
        if (!confirm('用 ' + file + '？\n\n没下过的话会在后台下载（几百 MB 到 9 GB，进度看顶部横幅）。')) return;
        App.startLocalWatcher(true);   // 缺权重的话会在后台下，进度条马上出来
        var msg = document.getElementById('llamaMsg');
        if (msg) msg.textContent = '正在切换…';
        fetch('/api/runtime/local/model', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({file: file, download: true})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (msg) msg.textContent = (res && res.success)
                ? ((res.message || '已切换') + '（' + file + '）')
                : ('切换失败：' + ((res && res.error) || ''));
            setTimeout(function() { App.renderLlamaTab(); }, 1200);
        }).catch(function(e) { if (msg) msg.textContent = '切换失败：' + e; });
    },

    /** 只下载这一份（不切换）：可以把几份都先下好，再挑一份用 */
    downloadLlamaModel: function(file) {
        App.startLocalWatcher(true);   // 立刻开始盯，前台进度条马上出来
        if (App.refreshModelCache) { App.refreshModelCache(); }
        var msg = document.getElementById('llamaMsg');
        if (msg) msg.textContent = '已开始下载 ' + file + '（后台进行，进度看顶部横幅）…';
        fetch('/api/runtime/local/models/download', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({file: file})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (msg) msg.textContent = (res && res.success)
                ? (res.message || '已开始下载')
                : ('下载没启动：' + ((res && res.error) || ''));
            setTimeout(function() { App.renderLlamaTab(); }, 1500);
        }).catch(function(e) { if (msg) msg.textContent = '下载没启动：' + e; });
    },

    /** 打开模型目录（想自己往里面塞 GGUF 时用） */
    openModelsDir: function() {
        var msg = document.getElementById('llamaMsg');
        fetch('/api/runtime/local/models/open-dir', {method: 'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                var dir = (res && res.data && res.data.dir) || '';
                if (msg) msg.textContent = (res && res.success)
                    ? ('已打开：' + dir + '（把 .gguf 丢进去，点「刷新」就能看到）')
                    : ('没能自动打开，请手动打开：' + dir);
            })
            .catch(function(e) { if (msg) msg.textContent = '没能打开目录：' + e; });
    },

    /** 重启本地模型（参数生效） */
    restartLocalModel: function() {
        var msg = document.getElementById('llamaMsg');
        if (msg) msg.textContent = '正在重启本地模型（要重新加载权重，可能要一两分钟）…';
        fetch('/api/runtime/local/restart', {method: 'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                if (msg) msg.textContent = res && res.success
                    ? '本地模型已按新参数启动。'
                    : ('重启失败：' + ((res && res.error) || ''));
            })
            .catch(function(e) { if (msg) msg.textContent = '重启失败：' + e; });
    },

    // ====== 音效提醒页签 ======
    // 任务完成 / 需要审批 / 任务出错时播放提示音。
    // 试听走的是后端真实播放（POST /api/notification/test），和实际提醒完全同一条路径 ——
    // 如果用浏览器 <audio> 放，会出现"试听挺响、真提醒没声"这种对不上的情况。
    renderNotificationTab: function() {
        fetch('/api/notification').then(function(r) { return r.json(); }).then(function(res) {
            var c = (res && res.success && res.data) ? res.data : {};
            var rowStyle = 'display:flex;align-items:center;justify-content:space-between;'
                         + 'padding:9px 0;border-bottom:1px solid #23233a';
            var nameStyle = 'font-size:13px;color:#e8e8f0';
            var descStyle = 'font-size:11px;color:#6a6a80;margin-top:3px';
            var chk = 'width:16px;height:16px;cursor:pointer;accent-color:#6c5ce7';

            function row(id, label, desc, checked, disabled) {
                return '<div style="' + rowStyle + '">'
                     +   '<div><div style="' + nameStyle + '">' + label + '</div>'
                     +   '<div style="' + descStyle + '">' + desc + '</div></div>'
                     +   '<input type="checkbox" id="' + id + '" style="' + chk + '"'
                     +   (checked ? ' checked' : '') + (disabled ? ' disabled' : '')
                     +   ' onchange="App.onNotificationChange()">'
                     + '</div>';
            }

            var html = '<p style="color:#a0a0b8;margin-bottom:14px;font-size:12px;line-height:1.7">'
                + '在这些时机播放提示音，不用一直盯着屏幕。<br>'
                + '音效由本机播放（不联网、不上传），改完立即生效。</p>';

            html += row('ntfEnabled', '启用音效提醒', '总开关', c.enabled !== false);

            var off = (c.enabled === false);
            html += row('ntfDone', '任务完成', '一轮任务跑完、停下来等你时',
                        c.soundDone !== false, off);
            html += row('ntfApproval', '需要审批', '工具被审批策略拦下、要你确认时',
                        c.soundApproval !== false, off);
            html += row('ntfQuestion', '向你提问', '模型信息不足、用 ask_user 问你一件事时',
                        c.soundQuestion !== false, off);
            html += row('ntfError', '任务出错', '模型调用失败或被手动中止时',
                        c.soundError !== false, off);

            // 音量
            var vol = (c.volume == null ? 80 : c.volume);
            html += '<div style="padding:14px 0 4px">'
                 +  '<div style="display:flex;justify-content:space-between;margin-bottom:6px">'
                 +    '<span style="' + nameStyle + '">音量</span>'
                 +    '<span id="ntfVolText" style="font-size:12px;color:#a0a0b8">' + vol + '</span>'
                 +  '</div>'
                 +  '<input type="range" id="ntfVolume" min="0" max="100" step="5" value="' + vol + '"'
                 +  ' style="width:100%;accent-color:#6c5ce7"'
                 +  ' oninput="document.getElementById(\'ntfVolText\').textContent=this.value"'
                 +  ' onchange="App.onNotificationChange()">'
                 +  '<div style="' + descStyle + '">0 = 静音</div>'
                 + '</div>';
