    removeTeamMember: function(id) {
        var self = this;
        fetch('/api/plugins/team/' + encodeURIComponent(id), {method: 'DELETE'})
            .then(function() { self.renderPluginParamsTab(); })
            .catch(function() {});
    },

    /** 加一个自动化任务（绑当前会话） */
    addAutomation: function() {
        var self = this;
        var name = ((document.getElementById('ppAutoName') || {}).value || '').trim();
        var every = parseInt((document.getElementById('ppAutoEvery') || {}).value, 10);
        var prompt = ((document.getElementById('ppAutoPrompt') || {}).value || '').trim();
        var el = document.getElementById('ppMsgAutomation');
        if (!self.sessionId) { if (el) { el.textContent = '先打开一个会话（任务要绑到会话上）。'; } return; }
        if (!prompt) { if (el) { el.textContent = '写一下要它做什么。'; } return; }
        if (isNaN(every) || every < 5) { if (el) { el.textContent = '周期至少 5 秒。'; } return; }
        fetch('/api/plugins/automation', {method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name || prompt.slice(0, 12), sessionId: self.sessionId,
                                  prompt: prompt, everySeconds: every, enabled: true})})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                if (!self.respOk(res)) { if (el) { el.textContent = '创建失败：' + (res.message || ''); } return; }
                self.renderPluginParamsTab();
            })
            .catch(function(e) { if (el) { el.textContent = '创建失败：' + e; } });
    },

    removeAutomation: function(id) {
        var self = this;
        fetch('/api/plugins/automation/' + encodeURIComponent(id), {method: 'DELETE'})
            .then(function() { self.renderPluginParamsTab(); })
            .catch(function() {});
    },

    renderSkillsTab: function() {
        var self = this;
        var box = document.getElementById('settingsContent');
        if (!box) return;
        box.innerHTML = '<p class="set-note">正在加载技能列表…</p>';
        fetch('/api/skills').then(function(r) { return r.json(); }).then(function(res) {
            if (!self.respOk(res)) { box.innerHTML = self.notReady('技能', 'GET /api/skills', res); return; }
            self.skillsData = self.respList(res, 'skills') || [];
            box.innerHTML = self.skillsTabHtml();
            self.loadActiveSkills();
        }).catch(function() {
            box.innerHTML = self.notReady('技能', 'GET /api/skills');
        });
    },

    skillsTabHtml: function() {
        var self = this;
        var skills = this.skillsData || [];
        var pinned = this.activeSkills || [];
        var html = '<div class="set-block">'
            + '<div class="set-block-head">'
            +   '<div class="set-block-title">技能（' + skills.length + '）</div>'
            +   '<button class="btn btn-sm" onclick="App.reloadSkills()">↻ 重新加载技能</button>'
            + '</div>'
            + '<div class="set-note">当前会话指定使用（指定后这条会话会带上这些技能）：</div>'
            + '<div id="skillPinned" style="margin:6px 0 4px">' + this.skillPinnedHtml() + '</div>'
            + '<div class="set-msg" id="skillTabMsg"></div>';
        if (!skills.length) {
            html += '<div class="set-note" style="margin-top:6px">后端没返回任何技能。</div>';
        }
        skills.forEach(function(s) { html += self.skillRow(s); });
        html += '</div>';
        return html;
    },

    skillPinnedHtml: function() {
        var self = this;
        var skills = this.skillsData || [];
        var pinned = this.activeSkills || [];
        if (!pinned.length) {
            return '<span class="set-msg">' + (this.sessionId ? '还没有指定技能' : '还没有会话，先发一条消息再指定') + '</span>';
        }
        var html = '';
        pinned.forEach(function(id) {
            var s = null;
            skills.forEach(function(x) { if (x.id === id) { s = x; } });
            html += '<span class="tag" title="' + self.escapeAttr(id) + '">'
                 +   self.escapeHtml((s && (s.displayName || s.name)) || id)
                 +   '<button title="取消指定" onclick="App.unpinSkill(\'' + self.escapeAttr(id) + '\')">×</button>'
                 + '</span>';
        });
        return html;
    },

    renderSkillPinned: function() {
        var box = document.getElementById('skillPinned');
        if (!box) return;
        box.innerHTML = this.skillPinnedHtml();
    },

    skillRow: function(s) {
        var on = s.enabled !== false;
        var pinned = (this.activeSkills || []).indexOf(s.id) >= 0;
        var src = this.sourceLabel(s);
        return '<div class="set-row">'
            +   '<span class="grow">'
            +     '<span class="set-name">' + this.escapeHtml(s.displayName || s.name || s.id) + '</span>'
            +     (s.description ? '<span class="set-desc">' + this.escapeHtml(s.description) + '</span>' : '')
            +     (s.whenToUse ? '<span class="set-desc">适用：' + this.escapeHtml(s.whenToUse) + '</span>' : '')
            +     (s.error ? '<span class="set-err">✗ ' + this.escapeHtml(String(s.error)) + '</span>' : '')
            +   '</span>'
            +   '<span class="set-badge" title="' + this.escapeAttr(this.sourceTitle(s)) + '">' + this.escapeHtml(src)
            +     (s.mode ? (' · ' + this.escapeHtml(String(s.mode))) : '') + '</span>'
            +   '<button class="btn btn-sm" onclick="App.' + (pinned ? 'unpinSkill' : 'pinSkill')
            +     '(\'' + this.escapeAttr(s.id) + '\')">' + (pinned ? '取消指定' : '指定使用') + '</button>'
            +   '<span class="switch"><input type="checkbox" id="skill_' + this.escapeAttr(s.id) + '"'
            +     (on ? ' checked' : '') + ' onchange="App.toggleSkill(\'' + this.escapeAttr(s.id)
            +     '\', this.checked, this)"><span class="knob"></span></span>'
            + '</div>';
    },

    toggleSkill: function(id, enable, el) {
        var self = this;
        var msg = document.getElementById('skillTabMsg');
        if (el) { el.disabled = true; }
        if (msg) { msg.className = 'set-msg'; msg.textContent = (enable ? '正在启用 ' : '正在禁用 ') + id + ' …'; }
        fetch('/api/skills/' + encodeURIComponent(id) + '/' + (enable ? 'enable' : 'disable'), {method: 'POST'})
          .then(function(r) { return r.json(); })
          .then(function(res) {
            if (el) { el.disabled = false; }
            if (!self.respOk(res)) { throw new Error((res && (res.error || res.message)) || '请求失败'); }
            (self.skillsData || []).forEach(function(s) { if (s.id === id) { s.enabled = enable; } });
            var m = document.getElementById('skillTabMsg');
            if (m) { m.className = 'set-msg ok'; m.textContent = '✓ ' + id + (enable ? ' 已启用' : ' 已禁用'); }
          })
          .catch(function(e) {
            if (el) { el.disabled = false; el.checked = !enable; }         // 回滚
            var m = document.getElementById('skillTabMsg');
            if (m) {
                m.className = 'set-msg err';
                m.textContent = '✗ ' + id + (enable ? ' 启用失败：' : ' 禁用失败：') + (e && e.message ? e.message : e);
            }
          });
    },

    reloadSkills: function() {
        var self = this;
        var msg = document.getElementById('skillTabMsg');
        if (msg) { msg.className = 'set-msg'; msg.textContent = '正在重新加载技能…'; }
        fetch('/api/skills/reload', {method: 'POST'})
          .then(function(r) { return r.json(); })
          .then(function(res) {
            if (!self.respOk(res)) { throw new Error((res && res.error) || '请求失败'); }
            var list = self.respList(res, 'skills');
            if (list) { self.skillsData = list; }
            var box = document.getElementById('settingsContent');
            if (box) { box.innerHTML = self.skillsTabHtml(); }
            var m = document.getElementById('skillTabMsg');
            if (m) { m.className = 'set-msg ok'; m.textContent = '✓ 技能已重新加载'; }
          })
          .catch(function(e) {
            var m = document.getElementById('skillTabMsg');
            if (m) { m.className = 'set-msg err'; m.textContent = '✗ 重新加载失败：' + (e && e.message ? e.message : e); }
          });
    },

    /** 当前会话钉住了哪些技能 */
    loadActiveSkills: function() {
        var self = this;
        if (!this.sessionId) { this.activeSkills = []; this.renderSkillPinned(); return; }
        fetch('/api/skills/active?sessionId=' + encodeURIComponent(this.sessionId))
          .then(function(r) { return r.json(); })
          .then(function(res) {
            if (!self.respOk(res)) { return; }
            var list = self.respList(res, 'skills') || [];
            self.activeSkills = list.map(function(x) {
                return (typeof x === 'string') ? x : (x && x.id);
            }).filter(function(x) { return !!x; });
            self.renderSkillPinned();
          })
          .catch(function() { /* 拿不到就不显示钉住的技能，别的照常用 */ });
    },

    pinSkill: function(id) {
        this.activeSkills = this.activeSkills || [];
        if (this.activeSkills.indexOf(id) < 0) { this.activeSkills.push(id); }
        this.saveActiveSkills();
    },

    unpinSkill: function(id) {
        this.activeSkills = (this.activeSkills || []).filter(function(x) { return x !== id; });
        this.saveActiveSkills();
    },

    saveActiveSkills: function() {
        var self = this;
        if (!this.sessionId) {
            var m0 = document.getElementById('skillTabMsg');
            if (m0) { m0.className = 'set-msg err'; m0.textContent = '还没有会话，先发一条消息再指定'; }
            return;
        }
        var msg = document.getElementById('skillTabMsg');
        if (msg) { msg.className = 'set-msg'; msg.textContent = '正在保存…'; }
        fetch('/api/skills/active', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({sessionId: this.sessionId, skills: this.activeSkills || []})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!self.respOk(res)) { throw new Error((res && res.error) || '请求失败'); }
            var box = document.getElementById('settingsContent');      // 按钮文字要跟着变
            if (box) { box.innerHTML = self.skillsTabHtml(); }
            var m = document.getElementById('skillTabMsg');
            if (m) { m.className = 'set-msg ok'; m.textContent = '✓ 已更新当前会话指定的技能'; }
        }).catch(function(e) {
            var m = document.getElementById('skillTabMsg');
            if (m) { m.className = 'set-msg err'; m.textContent = '✗ 保存失败：' + (e && e.message ? e.message : e); }
        });
    },

    // ====== 输入框 @ 补全（文件 / 历史对话 / 技能）======
    /** 输入变化：刷新引用小标签 + 决定要不要弹候选 */
    onInputChanged: function() {
        this.renderRefs();
        this.updateMentionPopup();
    },

    /** 把正文里的 @file: / @history: / @skill: 抽出来渲染成可删的小标签 */
    renderRefs: function() {
        var bar = document.getElementById('refBar');
        if (!bar) return;
        var input = document.getElementById('msgInput');
        var text = (input && input.value) || '';
        var self = this;
        var re = /@(file|history|skill):([^\s@]+)/g;
        var items = [];
        var m;
        while ((m = re.exec(text)) !== null) {
            items.push({ type: m[1], value: m[2], raw: m[0] });
        }
        this._refs = items;
        if (!items.length) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
        var html = '';
        items.forEach(function(it, i) {
            html += '<span class="ref-chip" title="' + self.escapeAttr(it.raw) + '">'
                 +   '<span class="mi-type">' + self.mentionTypeLabel(it.type) + '</span>'
                 +   '<span class="t">' + self.escapeHtml(it.value) + '</span>'
                 +   '<button title="删掉这个引用" onclick="App.removeRef(' + i + ')">×</button>'
                 + '</span>';
        });
        bar.innerHTML = html;
        bar.style.display = 'flex';
    },

    /** 点标签上的 ×：把对应的 @xxx 从输入框里删掉 */
    removeRef: function(index) {
        var input = document.getElementById('msgInput');
        if (!input) return;
        var it = (this._refs || [])[index];
        if (!it) return;
        var text = String(input.value || '');
        var at = text.indexOf(it.raw);
        if (at >= 0) {
            var end = at + it.raw.length;
            if (text.charAt(end) === ' ') { end++; }
            else if (at > 0 && text.charAt(at - 1) === ' ') { at--; }
            text = text.slice(0, at) + text.slice(end);
        }
        input.value = text;
        this.renderRefs();
        if (input.focus) { input.focus(); }
    },

    mentionTypeLabel: function(t) {
        var map = { file: '文件', history: '历史', skill: '技能' };
        return map[t] || (t || '');
    },

    /** 光标前那个还没写完的 @ 词；没有就返回 null */
    findMentionToken: function() {
        var input = document.getElementById('msgInput');
        if (!input) return null;
        var text = String(input.value || '');
        var pos = text.length;
        if (typeof input.selectionStart === 'number') { pos = input.selectionStart; }
        var before = text.slice(0, pos);
        var m = /(^|[\s(（])@([^\s@]{0,40})$/.exec(before);
        if (!m) return null;
        return { query: m[2], start: pos - m[2].length - 1, end: pos };
    },

    /** 输入后 200ms 再查（防抖）：连打几个字只发一次请求 */
    updateMentionPopup: function() {
        var self = this;
        var tok = this.findMentionToken();
        if (!tok) { this.hideMentionPopup(); return; }
        if (this._mentionTimer) { clearTimeout(this._mentionTimer); }
        this._mentionTimer = setTimeout(function() { self.fetchMentions(tok.query); }, 200);
    },

    /**
     * 查候选项。请求带序号：慢的旧响应回来时如果已经有更新的请求发出去了，
     * 直接丢掉 —— 否则会出现"打完字了，列表跳回上一个词的结果"。
     * 端点不存在 / 报错都只是浮层不出现，绝不弹错误、不挡输入。
     */
    fetchMentions: function(query) {
        var self = this;
        this._mentionSeq = (this._mentionSeq || 0) + 1;
        var seq = this._mentionSeq;
        var url = '/api/context/mentions?q=' + encodeURIComponent(query || '')
                + '&kind=all&limit=20'
                + '&root=' + encodeURIComponent(this.ws || '')
                + (this.sessionId ? ('&sessionId=' + encodeURIComponent(this.sessionId)) : '');
        try {
            fetch(url).then(function(r) { return r.json(); }).then(function(res) {
                if (seq !== self._mentionSeq) { return; }
                if (!self.respOk(res)) { self.hideMentionPopup(); return; }
                var items = self.respList(res, 'items') || [];
                if (!items.length) { self.hideMentionPopup(); return; }
                self._mentionItems = items;
                self._mentionIndex = 0;
                self._mentionToken = self.findMentionToken() || {query: query, start: 0, end: 0};
                self.renderMentionPopup();
            }).catch(function() {
                if (seq === self._mentionSeq) { self.hideMentionPopup(); }
            });
        } catch (e) {
            this.hideMentionPopup();
        }
    },

    renderMentionPopup: function() {
        var pop = document.getElementById('mentionPopup');
        if (!pop) return;
        var self = this;
        var items = this._mentionItems || [];
        var html = '';
        items.forEach(function(it, i) {
            html += '<div class="mention-item' + (i === self._mentionIndex ? ' active' : '') + '"'
                 +      ' onmousedown="event.preventDefault();App.mentionPick(' + i + ')"'
                 +      ' onmouseenter="App.mentionHover(' + i + ')">'
                 +   '<span class="mi-type">' + self.escapeHtml(self.mentionTypeLabel(it.type)) + '</span>'
                 +   '<span class="mi-label">' + self.escapeHtml(it.label || it.id || it.insert || '') + '</span>'
                 +   (it.detail ? '<span class="mi-detail">' + self.escapeHtml(String(it.detail)) + '</span>' : '')
                 + '</div>';
        });
        pop.innerHTML = html;
        pop.style.display = 'block';
        this._mentionOpen = items.length > 0;
    },

    hideMentionPopup: function() {
        this._mentionOpen = false;
        this._mentionItems = [];
        this._mentionIndex = 0;
        var pop = document.getElementById('mentionPopup');
        if (pop) { pop.style.display = 'none'; pop.innerHTML = ''; }
    },

    mentionHover: function(i) {
        this._mentionIndex = i;
        this.renderMentionPopup();
    },

    /** 键盘：↑↓ 选择、Enter/Tab 确认、Esc 关闭。返回 true 表示这次按键被浮层吃掉了 */
    mentionKeydown: function(e) {
        if (!this._mentionOpen || !(this._mentionItems || []).length) { return false; }
        var key = e.key;
        if (key === 'ArrowDown') { this.mentionMove(1); e.preventDefault(); return true; }
        if (key === 'ArrowUp') { this.mentionMove(-1); e.preventDefault(); return true; }
        if (key === 'Enter' || key === 'Tab') { this.mentionPick(this._mentionIndex); e.preventDefault(); return true; }
        if (key === 'Escape') { this.hideMentionPopup(); e.preventDefault(); return true; }
        return false;
    },

    mentionMove: function(delta) {
        var n = (this._mentionItems || []).length;
        if (!n) return;
        this._mentionIndex = (this._mentionIndex + delta + n) % n;
        this.renderMentionPopup();
    },

    /** 选中一项：把 @ 后面那个词换成后端给的 insert 文本，并显示成小标签 */
    mentionPick: function(i) {
        var it = (this._mentionItems || [])[i];
        if (!it) { this.hideMentionPopup(); return; }
        var input = document.getElementById('msgInput');
        if (!input) { this.hideMentionPopup(); return; }
        var text = String(input.value || '');
        // 以"此刻光标前的 @ 词"为准（拉候选这段时间用户可能又敲了几个字），拿不到才退回记下的位置
        var tok = this.findMentionToken() || this._mentionToken || {start: text.length, end: text.length};
        var insert = String(it.insert || it.id || it.label || '');
        input.value = text.slice(0, tok.start) + insert + ' ' + text.slice(tok.end);
        var caret = tok.start + insert.length + 1;
        if (input.setSelectionRange) {
            try { input.setSelectionRange(caret, caret); } catch (e) { /* 不支持就算了 */ }
        }
        this.hideMentionPopup();
        this.renderRefs();
        if (input.focus) { input.focus(); }
    },

    // ====== 模态框 ======
    openModal: function(title, html) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('modalMask').classList.add('show');
    },

    closeModal: function() {
        document.getElementById('modalMask').classList.remove('show');
    }
};

// 点击遮罩关闭
document.getElementById('modalMask').onclick = function(e) {
    if (e.target === this) App.closeModal();
};

// 启动
App.init();
</script>
