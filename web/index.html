            // 试听
            html += '<div style="margin-top:16px;padding-top:14px;border-top:1px solid #2d2d4a">'
                 +  '<div style="' + nameStyle + ';margin-bottom:8px">试听</div>'
                 +  '<button class="btn btn-sm" style="margin-right:8px" onclick="App.testSound(\'done\')">任务完成</button>'
                 +  '<button class="btn btn-sm" style="margin-right:8px" onclick="App.testSound(\'approval\')">需要审批</button>'
                 +  '<button class="btn btn-sm" style="margin-right:8px" onclick="App.testSound(\'question\')">向你提问</button>'
                 +  '<button class="btn btn-sm" onclick="App.testSound(\'error\')">任务出错</button>'
                 +  '<div style="' + descStyle + ';margin-top:8px">'
                 +  '试听不受总开关和节流限制，可以连点；音量按上面那条走。</div>'
                 + '</div>';

            html += '<div id="ntfStatus" style="margin-top:12px;font-size:12px;color:#00b894"></div>';

            document.getElementById('settingsContent').innerHTML = html;
        });
    },

    /** 任一开关/音量变化：立即保存，不需要额外的"保存"按钮 */
    onNotificationChange: function() {
        var st = document.getElementById('ntfStatus');
        var enabledEl = document.getElementById('ntfEnabled');
        if (!enabledEl) return;
        var body = {
            enabled: enabledEl.checked,
            soundDone: document.getElementById('ntfDone').checked,
            soundApproval: document.getElementById('ntfApproval').checked,
            soundQuestion: document.getElementById('ntfQuestion').checked,
            soundError: document.getElementById('ntfError').checked,
            volume: parseInt(document.getElementById('ntfVolume').value, 10)
        };
        // 总开关关掉时把分开关置灰；但不动它们的值，重新打开还能恢复原样
        ['ntfDone','ntfApproval','ntfQuestion','ntfError'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.disabled = !body.enabled;
        });
        fetch('/api/notification', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify(body)
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!st) return;
            st.style.color = res.success ? '#00b894' : '#e17055';
            st.textContent = res.success ? '✓ 已保存' : ('✗ ' + (res.error || '保存失败'));
            setTimeout(function() { if (st) st.textContent = ''; }, 2000);
        }).catch(function(e) {
            if (st) { st.style.color = '#e17055'; st.textContent = '✗ 保存失败: ' + e; }
        });
    },

    /** 试听：走后端真实播放，和实际提醒同一条路径 */
    testSound: function(kind) {
        var st = document.getElementById('ntfStatus');
        fetch('/api/notification/test?kind=' + encodeURIComponent(kind), {method:'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                if (!st) return;
                st.style.color = res.success ? '#00b894' : '#e17055';
                st.textContent = (res.success ? '✓ ' : '✗ ')
                               + (res.data || res.message || res.error || '');
            })
            .catch(function(e) {
                if (st) { st.style.color = '#e17055'; st.textContent = '✗ ' + e; }
            });
    },

    // ====== 模型来源页签（本地模型 / 自定义 API） ======

            html += '<div style="margin-top:10px;font-size:12px;color:#6a6a80">'
                 +  '权重不随安装包分发：你在下面选了哪份，软件一启动就在<b>后台自动下那一份</b>'
                 +  '（不占显存，进度看顶部横幅；也可以点「下载模型」手动催）。<br>'
                 +  '没下完也不耽误聊天：会先用目录里现成的那份，并在上面如实说明用的是哪份。'
                 +  '如果用自定义 API，本地模型永远不会被加载。<br>'
                 +  '<b>纯 CPU 推理时建议点一次「预热提示词」</b>：它会把系统提示词和工具定义'
                 +  '的前缀缓存提前算好，这样你的第一条消息不用等预填充（顺便实测出预填充速度）。</div>';

            var saved = d.customApi || {};

            }
            html += '<div style="margin-bottom:8px"><label style="' + lbl + '">接口地址（Base URL）</label>'
                 +  '<input id="cfgCustomUrl" style="' + mono + '" placeholder="https://..." value="'
                 +  self.escapeHtml(cUrl) + '"></div>';
            html += '<div style="margin-bottom:8px"><label style="' + lbl + '">API Key</label>'
                 +  '<input id="cfgCustomKey" type="password" style="' + mono + '" placeholder="在这里粘贴你的 Key" value="'
                 +  self.escapeHtml(cKey) + '"></div>';
            html += '<div style="margin-bottom:8px"><label style="' + lbl + '">模型名称</label>'
                 +  '<input id="cfgCustomModel" style="' + mono + '" placeholder="填服务商给出的模型 ID" value="'
                 +  self.escapeHtml(cModel) + '"></div>';
            html += '<div id="customStatus" style="margin:10px 0;font-size:13px;color:#a0a0b8"></div>';
            html += '<button class="btn btn-primary" onclick="App.saveCustomApi()">保存并启用</button>';
            html += '<div style="margin-top:10px;font-size:12px;color:#6a6a80;line-height:1.8">'
                 +  '· 地址要填到版本号那一层，通常是 <span style="font-family:monospace">…/v1</span><br>'
                 +  '· 只要兼容 OpenAI 的 <span style="font-family:monospace">/chat/completions</span> 调用格式就能用，不限服务商<br>'
                 +  '· Key 只存在本机（用户目录下的 .lioncode/app-config.json），不会上传到任何地方<br>'
                 +  '· 切到本地模型不会清掉这里的内容，随时可以切回来</div>';
            html += '</div>';

            // ---- 工具调用方式（两种格式都支持，这里只是选"首选哪个"）----
            var tcm = d.toolCallMode || 'auto';
            html += '<div style="border:1px solid #2d2d4a;border-radius:8px;padding:14px;margin-top:14px">';
            html += '<div style="font-weight:600;margin-bottom:10px">工具调用方式</div>';
            html += '<div style="margin-bottom:8px"><label style="' + lbl + '">首选格式</label>'
                 +  '<select id="cfgToolCallMode" onchange="App.saveToolCallMode()" style="' + inp + '">'
                 +  '<option value="auto"'   + (tcm === 'auto'   ? ' selected' : '') + '>自动（推荐）—— 云端走原生 function calling，本地模型走向文本格式</option>'
                 +  '<option value="native"' + (tcm === 'native' ? ' selected' : '') + '>原生 function calling —— 下发 tools 定义，走 API 工具通道</option>'
                 +  '<option value="text"'   + (tcm === 'text'   ? ' selected' : '') + '>仅文本 —— 不发 tools，用提示词里的 &lt;tool_call&gt; 格式</option>'
                 +  '</select></div>';
            html += '<div id="toolCallModeStatus" style="margin:6px 0 10px;font-size:13px;color:#a0a0b8"></div>';
            html += '<div style="font-size:12px;color:#6a6a80;line-height:1.8">'
                 +  '· 两种格式<b>都能识别</b>：模型用原生 tool_calls 回、还是用文本 '
                 +  '<span style="font-family:monospace">&lt;tool_call&gt;</span> 回，系统都认，这里选的只是"让模型优先用哪种"<br>'
                 +  '· 本地模型是按住文本格式微调的，而且本地运行时没开工具模板，所以默认走文本<br>'
                 +  '· 云端 API 走原生更稳（结构化返回、不用解析文本），默认就这样<br>'
                 +  '· 接口不认 tools 或工具配套参数时会自动降级重试，不用手动切换</div>';
            html += '</div>';

            document.getElementById('settingsContent').innerHTML = html;
        });
    },

    /** 把本地运行时状态渲染成一行中文 */
    localStatusText: function(st) {
        st = st || {};
        if (!st.runtimeInstalled) {
            return '<span style="color:#e17055">✗ 找不到模型运行时（runtime-vulkan\\llama-server.exe）</span>';
        }
        if (!st.modelInstalled) {
            // 没下载 ≠ 出错：权重是首次使用时才下的，这里要把话说清楚，
            // 不然用户一打开设置页就以为坏了（而且真正的失败原因会被这行红字盖住）。
            if (st.phase === 'downloading') {
                var mb = Math.floor((st.downloadBytes || 0) / 1048576);
                if (st.downloadTotal > 0) {
                    var pct = Math.floor((st.downloadBytes || 0) * 100 / st.downloadTotal);
                    return '<span style="color:#fdcb6e">⏳ 正在下载模型… ' + pct + '%（'
                         + mb + ' / ' + Math.floor(st.downloadTotal / 1048576) + ' MB）</span>';
                }
                return '<span style="color:#fdcb6e">⏳ 正在下载模型…（已下 ' + mb + ' MB）</span>';
            }
            if (st.lastError) {
                return '<span style="color:#e17055">✗ 模型没能就绪：' + st.lastError + '</span>';
            }
            return '<span style="color:#fdcb6e">○ 模型尚未下载（只下一次）</span>'
                 + '<span style="color:#6a6a80"> —— 发第一条消息会自动开始下载，'
                 + '也可以点下面的「下载模型」先下好</span>';
        }
        if (st.running) {
            return '<span style="color:#00b894">✓ 模型已加载，正在服务</span>'
                 + '<span style="color:#6a6a80"> （' + (st.host || '') + ':' + (st.port || '') + '）</span>';
        }
        if (st.starting) {
            return '<span style="color:#fdcb6e">⏳ 正在加载模型…</span>'
                 + '<span style="color:#6a6a80"> 首次加载约 30~90 秒</span>';
        }
        if (st.lastError) {
            return '<span style="color:#e17055">✗ 上次启动失败：' + st.lastError + '</span>';
        }
        return '<span style="color:#a0a0b8">○ 模型未加载（发出第一条消息时自动加载）</span>';
    },

    /** 切换运行方式 */
    setRuntimeMode: function(mode) {
        var self = this;
        if (mode === 'custom') {
            // 先看表单里有没有值；没有就把存档读回来填上（表单在本地模式下是空的时候才会这样）
            var box = document.getElementById('customStatus');
            var url = (document.getElementById('cfgCustomUrl') || {}).value || '';
            var key = (document.getElementById('cfgCustomKey') || {}).value || '';
            var mdl = (document.getElementById('cfgCustomModel') || {}).value || '';
            if (url.trim() && mdl.trim()) {
                self.saveCustomApi();
                return;
            }
            // 表单本身也空 —— 让后端从存档里取，取不到会明确报错
            fetch('/api/runtime/mode', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({mode: 'custom', baseUrl: url.trim(),
                                      apiKey: key.trim(), model: mdl.trim()})
            }).then(function(r) { return r.json(); }).then(function(res) {
                if (!res.success) {
                    if (box) {
                        box.style.color = '#e17055';
                        box.textContent = '✗ ' + (res.error || '切换失败') + '（请在下面填好三项再点）';
                    }
                    return;
                }
                App.fillModels([{modelId: res.data.model, modelName: res.data.model}]);
                App.renderProvidersTab();
                App.refreshRuntimeBanner();
            });
            return;
        }
        fetch('/api/runtime/mode', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({mode: 'local'})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!res.success) { alert(res.error || '切换失败'); return; }
            App.renderProvidersTab();
            App.refreshRuntimeBanner();
        });
    },

    /** 保存自定义 API 并切过去 */
    saveCustomApi: function() {
        var box = document.getElementById('customStatus');
        var baseUrl = (document.getElementById('cfgCustomUrl') || {}).value || '';
        var apiKey  = (document.getElementById('cfgCustomKey') || {}).value || '';
        var model   = (document.getElementById('cfgCustomModel') || {}).value || '';
        if (!baseUrl.trim()) { box.style.color = '#e17055'; box.textContent = '请填写 Base URL'; return; }
        if (!model.trim())   { box.style.color = '#e17055'; box.textContent = '请填写模型名称'; return; }
        box.style.color = '#a0a0b8';
        box.textContent = '正在保存并测试连接…';
        fetch('/api/runtime/mode', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({mode: 'custom', baseUrl: baseUrl.trim(), apiKey: apiKey.trim(), model: model.trim()})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!res.success) { box.style.color = '#e17055'; box.textContent = '✗ ' + (res.error || '保存失败'); return; }
            box.style.color = '#00b894';
            box.textContent = '✓ 已启用自定义 API';
            App.fillModels([{id: model.trim(), name: model.trim()}]);
            App.renderProvidersTab();
            App.refreshRuntimeBanner();
        }).catch(function(e) {
            box.style.color = '#e17055'; box.textContent = '✗ 保存失败: ' + e;
        });
    },

    /** 保存工具调用方式（auto / native / text） */
    saveToolCallMode: function() {
        var sel = document.getElementById('cfgToolCallMode');
        var box = document.getElementById('toolCallModeStatus');
        if (!sel) { return; }
        var mode = sel.value;
        box.style.color = '#a0a0b8';
        box.textContent = '正在保存…';
        fetch('/api/runtime/tool-call-mode', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({mode: mode})
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!res || !res.success) {
                box.style.color = '#e17055';
                box.textContent = '✗ ' + ((res && res.error) || '保存失败');
                return;
            }
            box.style.color = '#00b894';
            box.textContent = '✓ 已保存：' + ({
                auto:   '自动（云端原生 / 本地文本）',
                native: '原生 function calling',
                text:   '仅文本 <tool_call>'
            }[mode] || mode) + '（下一条消息生效）';
        }).catch(function(e) {
            box.style.color = '#e17055';
            box.textContent = '✗ 保存失败: ' + e;
        });
    },

    /** 预热：把系统提示词 + 工具定义的前缀缓存提前算好（纯 CPU 推理时很关键） */
    warmUpModel: function() {
        var box = document.getElementById('warmupStatus');
        if (box) { box.innerHTML = '<span style="color:#fdcb6e">⏳ 正在预热（首次会把模型也拉起来）…</span>'; }
        fetch('/api/runtime/warmup', {method:'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                var d = (res && res.data) || {};
                if (!box) { return; }
                if (!d.warmed) {
                    box.innerHTML = '<span style="color:#e17055">未预热：' + (d.reason || '未知') + '</span>';
                    return;
                }
                box.innerHTML = '<span style="color:#00b894">✓ 预热完成</span>'
                    + '<span style="color:#6a6a80">　前缀 ' + d.promptTokens + ' token，'
                    + '耗时 ' + d.seconds + ' 秒 → <b>' + d.tokensPerSecond + ' tok/s</b> 预填充速度'
                    + '（含工具定义 ' + d.toolDefinitions + ' 个）</span>';
            })
            .catch(function(e) {
                if (box) { box.innerHTML = '<span style="color:#e17055">✗ 预热失败: ' + e + '</span>'; }
            });
    },

    /** 手动加载本地模型 */
    /**
     * 只下载权重、不加载模型（不占显存）。
     * 权重不随安装包分发，首次用到时后端会自动下；这个按钮是给"想先下好"的人用的。
     */
    downloadLocalModel: function() {
        var box = document.getElementById('localStatus');
        box.innerHTML = '<span style="color:#fdcb6e">⏳ 正在从 ModelScope 下载权重…'
                      + '（只下一次，不占显存；体积见下面「模型版本」）</span>';
        fetch('/api/runtime/local/download', {method:'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                var st = (res && res.data) || {};
                if (st.modelInstalled) {
                    box.innerHTML = '<span style="color:#00b894">✓ 权重已下载完成</span>'
                                  + App.localStatusText(st);
                } else {
                    box.innerHTML = App.localStatusText(st);
                }
                // 注意：这里原来调的是 App.loadModels()，而那个函数根本不存在 ——
                // 异常会被下面的 catch 捕获，于是界面显示"✗ 下载失败: TypeError: ..."，
                // 明明下载成功了却报失败。刷新模型下拉用的是 fillModelsFromConfig()。
                if (res && res.success) { App.fillModelsFromConfig(); }
            })
            .catch(function(e) {
                box.innerHTML = '<span style="color:#e17055">✗ 下载失败: ' + e + '</span>';
            });
    },

    loadLocalModel: function() {
        var box = document.getElementById('localStatus');
        box.innerHTML = '<span style="color:#fdcb6e">⏳ 正在加载模型…（首次约 30~90 秒）</span>';
        fetch('/api/runtime/local/start', {method:'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                box.innerHTML = App.localStatusText((res && res.data) || {});
                if (res && res.success) { App.refreshRuntimeBanner(); App.fillModelsFromConfig(); }
            })
            .catch(function(e) {
                box.innerHTML = '<span style="color:#e17055">✗ 加载失败: ' + e + '</span>';
            });
    },

    /** 手动卸载本地模型 */
    unloadLocalModel: function() {
        fetch('/api/runtime/local/stop', {method:'POST'})
            .then(function(r) { return r.json(); })
            .then(function(res) {
                var box = document.getElementById('localStatus');
                if (box) box.innerHTML = App.localStatusText((res && res.data) || {});
                App.refreshRuntimeBanner();
            });
    },

    /** 顶部提示条：当前用的是本地模型还是自定义 API */
    refreshRuntimeBanner: function() {
        fetch('/api/runtime/mode').then(function(r) { return r.json(); }).then(function(res) {
            if (!res || !res.success) return;
            var d = res.data || {};
            var el = document.getElementById('runtimeBanner');
            if (!el) return;
            if (d.mode === 'custom') {
                el.innerHTML = '<span style="color:#74b9ff">●</span> 自定义 API：'
                             + '<span style="font-family:monospace">' + (d.model || '') + '</span>'
                             + ' <span style="color:#6a6a80">切换 ▾</span>';
                el.title = (d.baseUrl || '') + '（点击切换模型来源）';
            } else {
                var st = d.localStatus || {};
                var dot = st.running ? '<span style="color:#00b894">●</span>'
                                     : '<span style="color:#6a6a80">○</span>';
                var txt = st.running ? '已加载' : '未加载';
                // 正在下载你选的那份权重时，横幅里直接报进度，
                // 不然用户只看到“未加载”，以为没动静。
                if (st.phase === 'downloading') {
                    var dmb = Math.floor((st.downloadBytes || 0) / 1048576);
                    txt = st.downloadTotal > 0
                        ? '正在下载 ' + Math.floor((st.downloadBytes || 0) * 100 / st.downloadTotal)
                          + '%（' + dmb + '/' + Math.floor(st.downloadTotal / 1048576) + ' MB）'
                        : '正在下载（已下 ' + dmb + ' MB）';
                    dot = '<span style="color:#fdcb6e">●</span>';
                }
                el.innerHTML = dot + ' 本地模型：' + (d.model || '')
                             + ' <span style="color:#6a6a80">' + txt + ' · 切换 ▾</span>';
                el.title = (d.baseUrl || '') + '（点击切换模型来源）';
                // 下载中的进度由 App.tickLocal 统一刷（进度条 + 横幅一起动）
                if (st.phase === 'downloading') { App.startLocalWatcher(); }
            }
        });
    },

    /**
     * 模型下载观察器：每 1.5 秒查一次本地运行时状态，把前台进度条刷新。
     *
     * 为什么单独一个：下载是后端后台线程在跑，界面得自己盯着；
     * 顺带算出速度和剩余时间 —— 下 5 GB 的时候，"还要多久"比百分比更让人安心。
     */
    startLocalWatcher: function(fast) {
        // 下载时 1.5 秒一次（进度条要跟得上），空闲时 5 秒一次（够发现"后端自己开始下了"）
        var want = fast ? 1500 : 5000;
        if (App._localTimer && App._localSpeed === want) return;
        if (App._localTimer) { clearInterval(App._localTimer); }
        App._localSpeed = want;
        App._localTimer = setInterval(function() { App.tickLocal(); }, want);
        App.tickLocal();
    },

    tickLocal: function() {
        fetch('/api/runtime/local').then(function(r) { return r.json(); }).then(function(res) {
            var st = (res && res.data) || {};
            App._lastLocal = st;
            App.renderDownloadBar(st);
            App.renderModelPanel();
        }).catch(function() { /* 网络抖一下就等下一拍 */ });
    },

    /** 模型清单缓存（面板要用；别每 1.5 秒拉一次） */
    refreshModelCache: function() {
        return fetch('/api/runtime/local/models').then(function(r) { return r.json(); })
            .then(function(res) {
                App.modelsCache = (res && res.success && res.data) ? res.data : [];
                App.renderModelPanel();
                return App.modelsCache;
            }).catch(function() { return App.modelsCache || []; });
    },

    toggleModelPanel: function() {
        App._modelPanelOpen = !App._modelPanelOpen;
        App.renderModelPanel();
    },

    /**
     * 前台「模型」面板。收起来是一行状态，有事（没下 / 在下 / 下载失败 / 手动展开）就摊开。
     */
    renderModelPanel: function() {
        var box = document.getElementById('modelPanel');
        if (!box) return;
        var st = App._lastLocal || {};
        var models = App.modelsCache || [];
        if (!models.length) { box.style.display = 'none'; return; }
        box.style.display = 'block';

        var phase = st.phase || '';
        var downloading = phase === 'downloading';
        var dfile = st.downloadingFile || '';
        var cur = st.modelFile || '';
        var curRow = null;
        for (var i = 0; i < models.length; i++) {
            if (models[i].file === cur) { curRow = models[i]; }
        }
        var curLabel = curRow ? curRow.label : cur;

        // 你选的那份还没下载：这是最该让用户看见的情况
        var missing = curRow && !curRow.downloaded;
        var open = App._modelPanelOpen === true || downloading || phase === 'failed' || missing;

        var html = '';
        // ---- 收起时的那一行 ----
        var dot, line;
        if (downloading) {
            dot = '<span style="color:#fdcb6e">●</span>';
            line = '正在下载 <b style="color:#e8e8f0">' + App.escapeHtml(dfile || cur) + '</b>';
        } else if (phase === 'failed') {
            dot = '<span style="color:#e17055">●</span>';
            line = '下载失败：' + App.escapeHtml(st.lastError || '看日志');
        } else if (missing) {
            dot = '<span style="color:#e17055">●</span>';
            line = '你选的 <b style="color:#e8e8f0">' + App.escapeHtml(curLabel)
                 + '</b> 还没下载（' + (curRow.sizeText || (curRow.sizeGb + ' GB')) + '）'
                 + (st.running ? '，现在临时在用别的' : '');
        } else {
            dot = st.running ? '<span style="color:#00b894">●</span>' : '<span style="color:#6a6a80">○</span>';
            line = '本地模型：<b style="color:#e8e8f0">' + App.escapeHtml(curLabel) + '</b>'
                 + ' <span style="color:#6a6a80">'
                 + (st.running ? '正在用' : '已就绪（发消息时加载）') + '</span>';
        }
        html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
             +  '<span>' + dot + '</span><span style="flex:1;min-width:180px">' + line + '</span>'
             +  '<button class="btn btn-sm" onclick="App.toggleModelPanel()">'
             +  (open ? '收起 ▴' : '版本 / 下载 ▾') + '</button>'
             +  '<button class="btn btn-sm" onclick="App.openModelsDir()">📂 文件夹</button>'
             +  '<button class="btn btn-sm" onclick="App.showSettings()">⚙️ 详细设置</button>'
             +  '</div>';

        // ---- 摊开时：下载总进度条 ----
        if (open && downloading) {
            var bytes = st.downloadBytes || 0, total = st.downloadTotal || 0;
            var pct = total > 0 ? Math.floor(bytes * 100 / total) : 0;
            var speedTxt = App._dlSpeedTxt || '';
            html += '<div style="display:flex;align-items:center;gap:10px;margin-top:8px">'
                 +  '<div style="flex:1;height:10px;background:#12121f;border:1px solid #2d2d4a;'
                 +  'border-radius:5px;overflow:hidden;min-width:120px">'
                 +  '<div id="mpFill" style="height:100%;width:' + pct + '%;'
                 +  'background:linear-gradient(90deg,#6c5ce7,#00b894);transition:width .4s"></div></div>'
                 +  '<span style="color:#fdcb6e;font-variant-numeric:tabular-nums;width:42px;'
                 +  'text-align:right">' + pct + '%</span>'
                 +  '<span style="color:#a0a0b8;white-space:nowrap">' + App.mbText(bytes)
                 +  (total > 0 ? ' / ' + App.mbText(total) : '')
                 +  (speedTxt ? ' · ' + speedTxt : '') + '</span>'
                 +  '</div>';
        }

        // ---- 摊开时：每个版本一行 ----
        if (open) {
            html += '<div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">';
            for (var k = 0; k < models.length; k++) {
                var m = models[k];
                var tag = '';
                if (m.current) { tag = ' <span style="color:#6c5ce7">· 正在用</span>'; }
                else if (m.configured) { tag = ' <span style="color:#6c5ce7">· 已选中</span>'; }
                if (m.downloading) { tag += ' <span style="color:#fdcb6e">· 正在下载</span>'; }
                else if (!m.downloaded) { tag += ' <span style="color:#6a6a80">· 未下载</span>'; }
                html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;'
                     +  'padding:5px 8px;background:#12121f;border:1px solid #23233a;border-radius:6px">'
                     +  '<span style="flex:1;min-width:200px;color:#e8e8f0">'
                     +  App.escapeHtml(m.label) + tag
                     +  ' <span style="color:#6a6a80;font-size:11px">'
                     +  (m.sizeText || (m.sizeGb + ' GB')) + (m.custom ? ' · 你放进去的' : '')
                     +  '</span></span>';
                if (m.downloading) {
                    html += '<span style="color:#fdcb6e;font-size:11.5px">下载中…</span>';
                } else {
                    if (!m.downloaded) {
                        html += '<button class="btn btn-sm" onclick="App.downloadLlamaModel(\''
                             +  App.escapeAttr(m.file) + '\')">下载</button>';
                    }
                    if (!m.current) {
                        html += '<button class="btn btn-sm" onclick="App.switchLlamaModel(\''
                             +  App.escapeAttr(m.file) + '\')">'
                             +  (m.configured ? '重启生效' : '使用') + '</button>';
                    }
                }
                html += '</div>';
            }
            html += '</div>';
            html += '<div style="margin-top:7px;font-size:11px;color:#6a6a80">'
                 +  '模型目录：<span style="font-family:monospace">'
                 +  App.escapeHtml(st.modelDir || '') + '</span>'
                 +  ' —— 自己的 .gguf 丢进去，点「📂 文件夹」就能打开；'
                 +  '想让下好的那份生效，点「使用」，再发一条消息即可。</div>';
        }
        box.innerHTML = html;
    },

    /** 把状态渲染成前台进度条；不在下载就收起来 */
    renderDownloadBar: function(st) {
        var bar = document.getElementById('dlBar');
        if (!bar) return;
        var phase = st.phase || '';
        var file = st.downloadingFile || st.modelFile || '';
        var bytes = st.downloadBytes || 0;
        var total = st.downloadTotal || 0;

        if (phase === 'downloading') {
            var pct = total > 0 ? Math.floor(bytes * 100 / total) : 0;
            // 速度 / 剩余时间：拿上一次的采样算
            var now = Date.now();
            var speedTxt = '';
            if (App._dlPrev && App._dlPrev.bytes > 0 && now > App._dlPrev.at) {
                var sp = (bytes - App._dlPrev.bytes) / ((now - App._dlPrev.at) / 1000.0);
                if (sp > 0) {
                    speedTxt = (sp / 1048576).toFixed(1) + ' MB/s';
                    if (total > bytes) {
                        var left = Math.round((total - bytes) / sp);
                        speedTxt += ' · 约 ' + (left >= 60
                            ? Math.round(left / 60) + ' 分钟'
                            : left + ' 秒') + '后完成';
                    }
                }
            }
            App._dlPrev = {bytes: bytes, at: now};
            App._dlSpeedTxt = speedTxt;      // 前台面板也用这一份速度/剩余时间

            bar.style.display = 'block';
            bar.style.background = '#1a1a2e';
            document.getElementById('dlIcon').textContent = '⏳';
            document.getElementById('dlText').textContent = '正在下载 ' + file;
            document.getElementById('dlFill').style.width = pct + '%';
            document.getElementById('dlPct').textContent = pct + '%';
            document.getElementById('dlSpeed').textContent =
                App.mbText(bytes) + (total > 0 ? ' / ' + App.mbText(total) : '')
                + (speedTxt ? ' · ' + speedTxt : '') + ' · 下完自动可用';
            // 设置页里那一行的小进度条也一起动
            var rowFill = document.getElementById('dlrowfill_' + file);
            if (rowFill) { rowFill.style.width = pct + '%'; }
            App._dlWasRunning = true;
            if (App._localSpeed !== 1500) { App.startLocalWatcher(true); }
            return;
        }

        // 不在下载了：如果刚刚还在下，闪一句结果再收起来
        if (App._dlWasRunning) {
            App._dlWasRunning = false;
            App._dlPrev = null;
            var done = !!st.modelInstalled;
            var failed = phase === 'failed';
            bar.style.display = 'block';
            bar.style.background = failed ? '#2a1f1c' : '#16261f';
            document.getElementById('dlIcon').textContent = failed ? '✗' : '✓';
            document.getElementById('dlText').textContent = failed
                ? ('下载失败：' + (st.lastError || '原因见日志'))
                : ('下载完成：' + file + '（在「设置 → 模型版本」里点「使用」就能切过去）');
            document.getElementById('dlFill').style.width = failed ? '0%' : '100%';
            document.getElementById('dlPct').textContent = failed ? '' : '100%';
            document.getElementById('dlSpeed').textContent = '';
            setTimeout(function() {
                var b = document.getElementById('dlBar');
                if (b) b.style.display = 'none';
            }, failed ? 15000 : 8000);
            // 清单/设置页/前台面板跟着刷新（下载完成状态要变）
            if (App.fillModelsFromConfig) { App.fillModelsFromConfig(); }
            App.refreshModelCache();
            var settingsOpen = document.getElementById('settingsContent');
            if (settingsOpen && settingsOpen.innerHTML.indexOf('模型版本') >= 0) {
                App.renderLlamaTab();
            }
        } else {
            bar.style.display = 'none';
        }
        // 空闲下来：放慢轮询，但**不停** —— 后端开机也会自己下权重，停掉就看不见了
        if (App._localSpeed !== 5000) { App.startLocalWatcher(false); }
    },

    /** 把字节数说成人话 */
    mbText: function(b) {
        b = b || 0;
        if (b >= 1073741824) { return (b / 1073741824).toFixed(2) + ' GB'; }
        return Math.floor(b / 1048576) + ' MB';
    },

    checkBoxModel: function() {
        // 兼容旧按钮：直接看本地运行时状态
        var box = document.getElementById('cfgLocalStatus') || document.getElementById('localStatus');
        if (!box) return;
        box.textContent = '正在检测…';
        fetch('/api/runtime/local').then(function(r) { return r.json(); }).then(function(res) {
            box.innerHTML = App.localStatusText((res && res.data) || {});
        });
    },

    // ====== 审批策略页签 ======
    renderApprovalsTab: function() {
        var box = document.getElementById('settingsContent');
        box.innerHTML = '<p style="color:#a0a0b8">正在加载工具列表…</p>';
        fetch('/api/approvals').then(function(r) { return r.json(); }).then(function(result) {
            if (!result.success) { box.innerHTML = '<p style="color:#e17055">加载失败: ' + (result.error || '') + '</p>'; return; }
            var html = '<p style="color:#a0a0b8;margin-bottom:12px">审批策略在Agent执行工具前强制检查。默认全部自动批准；设为「需确认」的工具会被拒绝执行并提示，设为「禁止」的工具不可用。</p>';
            (result.data || []).forEach(function(t) {
                html += '<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;background:#1a1a2e;border:1px solid #2d2d4a;border-radius:8px">'
                    + '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">' + t.toolName + '</div>'
                    + '<div style="font-size:11px;color:#6a6a80;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (t.description || '') + '</div></div>'
                    + '<select onchange="App.setToolPolicy(\'' + t.toolId + '\', this.value)" style="flex-shrink:0">'
                    + '<option value="AUTO_APPROVE"' + (t.policy === 'AUTO_APPROVE' ? ' selected' : '') + '>自动批准</option>'
                    + '<option value="CONFIRM"' + (t.policy === 'CONFIRM' ? ' selected' : '') + '>需确认</option>'
                    + '<option value="BLOCK"' + (t.policy === 'BLOCK' ? ' selected' : '') + '>禁止</option>'
                    + '</select></div>';
            });
            box.innerHTML = html;
        }).catch(function() { box.innerHTML = '<p style="color:#e17055">加载失败</p>'; });
    },

    setToolPolicy: function(toolId, policy) {
        fetch('/api/approvals/' + encodeURIComponent(toolId), {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({policy: policy})
        }).then(function(r) { return r.json(); }).then(function(result) {
            if (!result.success) alert(result.error || '保存失败');
        }).catch(function() { alert('保存失败'); });
    },

    // 盒子版：不再有“选择服务商 / 填 API Key / Token-Plan”流程。
    // 模型来源固定为 LionBox 本地端点，检测入口见 checkBoxModel()。

    fillModels: function(models) {
        var sel = document.getElementById('modelSelect');
        sel.innerHTML = '<option value="">选择模型...</option>';
        models.forEach(function(m) {
            var opt = document.createElement('option');
            opt.value = m.modelId || m.id;
            opt.textContent = m.modelName || m.name || m.modelId || m.id;
            sel.appendChild(opt);
        });
        // 默认选第一个
        if (models.length > 0) {
            sel.selectedIndex = 1;
            this.onModelChange();
        }
    },

    // 盒子只内置一个模型；保留该函数仅为兜底，不再含任何云厂商列表
    fillDefaultModels: function(providerId) {
        this.fillModels([{modelId:'lion-models1', modelName:'lion-models1'}]);
    },

    onModelChange: function() {
        var sel = document.getElementById('modelSelect');
        var modelId = sel.value;
        var tl = document.getElementById('thinkingLevel');
        if (!modelId) { tl.disabled = true; tl.innerHTML = '<option>选择模型后加载</option>'; return; }

        // 盒子本地模型不支持思考等级（GGUF 运行时无 reasoning effort 参数）
        var levels = [];
        var lower = modelId.toLowerCase();

        if (levels.length === 0) {
            tl.disabled = true;
            tl.innerHTML = '<option>不支持思考等级</option>';
        } else {
            tl.disabled = false;
            tl.innerHTML = '';
            levels.forEach(function(l) {
                var opt = document.createElement('option');
                opt.value = l.code;
                opt.textContent = l.name;
                if (l.default) opt.selected = true;
                tl.appendChild(opt);
            });
            // 恢复上次保存的思考等级
            if (this.savedThinkingLevel) {
                tl.value = this.savedThinkingLevel;
                this.savedThinkingLevel = '';
            }
        }

        // 持久化模型与思考等级选择（重启后自动恢复）
        fetch('/api/chat/adapter/model', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                model: modelId,
                thinkingLevel: tl.disabled ? '' : tl.value
            })
        }).catch(function() {});
    },

    // ====== 模态框 ======
    openModal: function(title, html) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('modalMask').classList.add('show');
    },

    closeModal: function() {
        document.getElementById('modalMask').classList.remove('show');
    }
};

// 点击遮罩关闭
document.getElementById('modalMask').onclick = function(e) {
    if (e.target === this) App.closeModal();
};

// 启动
App.init();
</script>
</body>
