# electron-builder 打包配置（版本 26.15.3）
# 官方文档：https://www.electron.build/
#
# 用法：
#   npm run pack     # 只产出免安装目录（dist/win-unpacked 之类），最快，用于本地验证
#   npm run dist     # 产出安装包（Windows: NSIS + portable；macOS: dmg/zip；Linux: AppImage/deb）

appId: com.lioncode.lionbox
productName: LionBox
copyright: Copyright © 2026 LionCode

directories:
  output: dist
  buildResources: build

# 打进 asar 的文件（只包含运行期真正需要的）
files:
  - main.js
  - preload.js
  - status.html
  - package.json

# ---------------------------------------------------------------------------
# 随包附带后端（fat jar + 精简 JRE + 本地模型运行时）
#
# 【桌面版为什么要把后端打进去】用户装桌面版就是想要"装完就是能用的一个窗口"，
# 而不是"先去装另一个包，再回来打开我"。后端 fat jar 35MB、精简 JRE 52MB、
# llama.cpp 运行时 49MB，合起来让安装包大一倍，但换来完全不依赖用户机器上的 Java、
# 也不依赖另一个安装包 —— 这是桌面版和网页版唯一实打实的区别。
#
# 主进程会在 process.resourcesPath/backend/ 下找：
#   lion-code-agent-harness.jar   → 用 java -jar 拉起
#   runtime-jre/bin/java.exe      → 优先用这个 java（机器上没装 Java 也能跑）
#   runtime-vulkan/llama-server.exe → 本地模型运行时（权重首次使用时自动下载）
# ---------------------------------------------------------------------------
extraResources:
  - from: ../../target/lion-code-agent-harness-1.0.0-SNAPSHOT.jar
    to: backend/lion-code-agent-harness.jar
  # 【为什么用相对暂存目录而不是 ${env:XXX}】electron-builder 的 from 字段不认
  # ${env:VAR} 这种写法 —— 实测它把整串当字面路径，日志里就一句
  # "file source doesn't exist"，包照样出，只是里面**没有** JRE，静默少东西。
  # 所以改成先把两个运行时拷到 staging-backend/（该目录在 .gitignore 里），再用相对路径打。
  - from: ./staging-backend/runtime-jre
    to: backend/runtime-jre
  - from: ./staging-backend/runtime-vulkan
    to: backend/runtime-vulkan
  # 内置技能（SKILL.md）：后端按"jar 同级目录"找 skills/，所以也放在 backend 下
  - from: ../../skills
    to: backend/skills

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # 未签名时 Windows SmartScreen 会拦截，正式发布请配置证书：
  # certificateFile / certificatePassword（或用 CSC_LINK / CSC_KEY_PASSWORD 环境变量）

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: LionBox

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  # macOS 分发必须签名 + 公证（否则 Gatekeeper 拦截）：
  # hardenedRuntime: true
  # entitlements: build/entitlements.mac.plist
  # notarize: true

linux:
  target:
    - AppImage
    - deb
  category: Development

# 自动更新：electron-builder 生成的 latest.yml / *.blockmap 需要放到一个 HTTP 更新源，
# 再由主进程的 autoUpdater 拉取。详见 https://www.electron.build/ 与
# https://www.electronjs.org/docs/latest/tutorial/tutorial-publishing-updating
publish: null
