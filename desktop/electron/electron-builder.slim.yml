# ---------------------------------------------------------------------------
# 「瘦」桌面版打包配置：不带 runtime-jre / runtime-vulkan
#
# 【实测结论：这个配置**救不了** GitHub 100MB 那条线】本来想用瘦包把体积压到 100MB 以内
# 好进仓库，实测瘦包 = 137.88 MB —— **Electron 本体（win32-x64）压缩后就约 138MB**，
# 去掉 101MB 的运行时只降到 138MB，还是超。所以桌面版无论胖瘦都得走 GitHub Releases
# （Release 附件没有 100MB 限制），仓库里放不下。
#
# 那这个配置还有什么用：**减小磁盘占用和下载量**（178MB → 138MB）。代价是要求机器上有
# Java，或者先装过 LionBox 主程序 —— 主进程 resolveJavaBin() 会按
# "包内 runtime-jre → %LOCALAPPDATA%\Programs\LionBox\runtime-jre → PATH 里的 java" 找。
# 面向"裸机也要能用"的场景，请用 electron-builder.yml（胖包，178MB，自包含）。
#
# 用法：npx electron-builder --win nsis --config electron-builder.slim.yml
# ---------------------------------------------------------------------------

appId: com.lioncode.lionbox
productName: LionBox
copyright: Copyright © 2026 LionCode

directories:
  output: dist-slim
  buildResources: build

files:
  - main.js
  - preload.js
  - status.html
  - package.json

extraResources:
  - from: ../../target/lion-code-agent-harness-1.0.0-SNAPSHOT.jar
    to: backend/lion-code-agent-harness.jar
  - from: ../../skills
    to: backend/skills

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: LionBox

publish: null
