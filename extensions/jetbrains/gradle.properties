# ---------------------------------------------------------------------------
# LionBox JetBrains 插件 —— 构建属性
# 版本基线见 README.md「版本来源」（2026-09-30 核实）
# ---------------------------------------------------------------------------

pluginGroup = com.lioncode
pluginName = LionBox
pluginVersion = 1.5.2

# 目标 IntelliJ Platform：2026.1（branch 261，Java 21）
# 官方建议"用 2026.1 构建，运行时依然兼容 2026.2"
# 参考 https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
platformType = IC
platformVersion = 2026.1

# since-build = 261（2026.1）。until-build 故意留空 = 兼容所有未来版本，
# 这是 JetBrains 官方推荐做法（见 2026.2 兼容性公告）。
pluginSinceBuild = 261

# 发布令牌：从 https://plugins.jetbrains.com/author/me/tokens 生成，
# 通过 -PintellijPlatformPublishingToken=xxx 或环境变量传入；留空即可正常构建。
intellijPlatformPublishingToken =
